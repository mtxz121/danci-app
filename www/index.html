    }), 220);
  }
  if(dir==='en2zh' && S.settings.autoSpeak && exam.spokenFor !== it.id){
    exam.spokenFor = it.id;
    setTimeout(()=>speak(it.en, true), 260);
  }
}

function togglePick(k){
  if(!exam) return;
  const it = byId(exam.ids[exam.ptr]);
  if(!it) return;
  const a = examAnswer(it);
  const c = (a.cands||[])[k];
  if(c==null) return;
  const i = a.picks.indexOf(c);
  if(i>=0) a.picks.splice(i,1); else a.picks.push(c);
  a.done = false; a.warned = false;
  if(exam.mode==='exam') S.exam = exam;
  save();
  renderExam();
}

function prevQ(){
  if(!exam || exam.ptr<=0) return;
  const it = byId(exam.ids[exam.ptr]);
  if(it && exam.ans && exam.ans[it.id]) exam.ans[it.id].done = true;
  stampAnswer();
  exam.ptr--;
  if(exam.mode==='exam') S.exam = exam;
  save();
  renderExam();
}
function nextQ(){
  if(!exam || exam.instant) return;
  if(exam.navLock && Date.now()-exam.navLock < 250) return;
  const it = byId(exam.ids[exam.ptr]);
  if(it && exam.ans){
    const a = exam.ans[it.id];
    if(a && a.dir==='en2zh'){
      const need = splitSenses(it.zh).length;
      const got = (a.picks||[]).length;
      // 多义项只选了一个时，先提醒补全，再点一次才放行
      if(got && got < need && !a.warned){
        a.warned = true;
        toast('还有 '+(need-got)+' 个义项没选，再点一次继续');
        renderExam();
        return;
      }
      a.done = got>0;
    }
  }
  if(exam.ptr+1 >= exam.ids.length){ gradeExam(); return; }
  stampAnswer();
  exam.navLock = Date.now();
  exam.ptr++;
  if(exam.mode==='exam') S.exam = exam;
  save();
  renderExam();
}

function applyReview(it,res){
  applyReviewFSRS(it, res.r==='right'?3:1, {type:'batch'});
}

function gradeExam(){
  if(!exam || exam.done) return;
  stampAnswer();
  const blank = exam.ids.filter(id=>{
    const a = exam.ans[id];
    if(!a) return true;
    return a.dir==='en2zh' ? !(a.picks||[]).length : !String(a.text||'').trim();
  });
  if(blank.length && !confirm('还有 '+blank.length+' 题没作答，确定交卷？')) return;

  const rows = [];
  let right = 0;
  exam.ids.forEach(id=>{
    const it = byId(id);
    if(!it) return;
    const idx = Math.max(0, exam.ids.indexOf(id));
    const a = exam.ans[id] || {dir: examDirAt(idx), text:'', picks:[]};
    const res = a.dir==='en2zh' ? judgePicks(a.picks, it) : judgeEn(a.text, it);
    if(res.r==='right') right++;
    if(res.r!=='right' && (a.dir==='zh2en' || a.dir==='listen')) bumpHeat(it.en, a.text);

    if(exam.mode==='free'){
      it.freeCount = (it.freeCount||0)+1;
      it.totalAnswerCount = (it.totalAnswerCount||0)+1;
      pushHist(it, {d:today(), r:res.r, mode:'free', dir:a.dir,
        a:String(a.text || (a.picks||[]).join('、') || '').slice(0,40)});
      it.updatedAt = Date.now();
    }else{
      applyReview(it, res);
    }
    rows.push({id, dir:a.dir, r:res.r, text:a.text||'', picks:a.picks||[], missing:res.missing||[], ms:a.ms||0});
  });

  exam.total = rows.length;
  exam.right = right;
  exam.results = rows;
  exam.done = true;
  S.exam = null;
  save();
  renderResults();
}

function renderResults(){
  const rows = (exam && exam.results) || [];
  const total = rows.length;
  const right = rows.filter(r=>r.r==='right').length;
  const acc = total ? Math.round(right/total*100) : 100;
  const wrong = rows.filter(r=>r.r!=='right');
  const color = acc>=80 ? 'var(--ok)' : acc>=60 ? 'var(--brand)' : 'var(--bad)';
  $('#reviewTitle').textContent = '交卷结果';
  $('#reviewCount').textContent = right+' / '+total;

  const list = rows.map(r=>{
    const it = byId(r.id);
    if(!it) return '';
    const ok = r.r==='right';
    let detail = '';
    if(!ok){
      if(r.dir==='zh2en' || r.dir==='listen'){
        detail = `<div style="color:var(--bad);font-size:12.5px;margin-top:2px">你的答案：${r.text?esc(r.text):'（空）'}　正确：<b>${esc(it.en)}</b></div>`;
      }else{
        detail = `<div style="color:var(--bad);font-size:12.5px;margin-top:2px">${r.r==='empty'?'未作答':'漏选：'+r.missing.map(esc).join('、')}　正确：${esc(it.zh)}</div>`;
      }
    }
    return `<div class="ritem">
      <span class="rstat" style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?'✓':'✗'}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:650">${esc(it.en)} <span style="font-size:12px;font-weight:400;color:var(--ink3)">${esc(it.zh)}</span></div>
        ${detail}
      </div></div>`;
  }).join('');

  const totalMs = rows.reduce((s,r)=>s+(r.ms||0),0);
  const avgS = total ? Math.round(totalMs/total/1000) : 0;

  $('#reviewStage').innerHTML = `
    <div class="pbar"><i style="width:100%"></i></div>
    <div style="flex:1;overflow-y:auto;min-height:0">
      <div style="text-align:center;padding:14px 0 4px">
        <div style="font-size:46px;font-weight:750;color:${color};letter-spacing:-1px">${acc}%</div>
        <div class="phon" style="margin-top:0">正确率　${right} / ${total}</div>
        <div style="font-size:12px;color:var(--ink3);margin-top:5px">用时 ${fmtDur(totalMs)} · 平均 ${avgS} 秒/题</div>
      </div>
      ${wrong.length
        ? `<div class="examtip" style="color:var(--warn);margin-top:6px">有 ${wrong.length} 个没过${exam.mode==='free'?'，可以重做错题再练一遍':'，明天还会出现'}</div>`
        : `<div class="examtip" style="color:var(--ok);margin-top:6px">全部正确，继续保持</div>`}
      <div class="rlist">${list}</div>
    </div>
    <div class="actions" style="padding-bottom:calc(12px + env(safe-area-inset-bottom))">
      ${wrong.length && exam.mode!=='retry'
        ? `<button class="btn" data-act="retryWrong" style="flex:0 0 44%">重做错题 ${wrong.length}</button>` : ''}
      <button class="btn primary" data-act="doneExam">完成</button>
    </div>`;
}

function retryWrong(){
  if(!exam) return;
  const ids = (exam.results||[]).filter(r=>r.r!=='right').map(r=>r.id);
  if(!ids.length){ toast('没有错题'); return; }
  exam = {mode:'retry', free:true, instant:true, ids, ans:{}, ptr:0, date:today(), done:false, deferred:0,
          startedAt:Date.now(), stats:{again:0,hard:0,good:0,easy:0,right:0}};
  renderExam();
}

function doneExam(){
  exam = null;
  S.exam = null;
  save();
  goHome();
}

    html += `<div class="banner">当前是测试日期（${S.clockOffset>0?'+':''}${S.clockOffset} 天），不是真实今天

  }
  if(S.meta.deferStreak>=3){
    html += `<div style="background:var(--warnSoft);color:var(--warn);border-radius:12px;padding:11px 14px;font-size:12.5px;margin-bottom:12px">
      连续几天有词顺延了：先清到期，暂时别批量直接学会或临时加词。</div>`;
  }
  if(undone){
    html += `<div style="background:var(--brandSoft);color:var(--brand);border-radius:12px;padding:11px 14px;font-size:12.5px;margin-bottom:12px">
      上次复习还没做完（已完成 ${Math.min(undone.ptr||0, undone.ids.length)} / ${undone.ids.length}），点「继续复习」接着来。</div>`;
  }

  html += `<div class="sect"><h3>今天要做的</h3></div>`;
  if(!due.length && !misDueN && (newTarget===0 || !fresh.length)){
    html += `<div class="empty"><b>${newTarget===0?'周六清账日，今天不加新词':'今天的任务完成了'}</b>${newTarget===0?'把到期的词和错题清一清就好':'去词库添加一些新词吧'}</div>`;
  }else{
    if(fresh.length && newTarget>0 && !catchOn) html += `
      <div class="item" data-act="startLearn">
        <div style="width:38px;height:38px;border-radius:12px;background:var(--brandSoft);color:var(--brand);
          display:flex;align-items:center;justify-content:center;font-weight:700">新</div>
        <div class="m"><div class="en">学习 ${Math.min(fresh.length, newTarget)} 个新词</div>
          <div class="zh">认识 → 回忆 → 辨义 → 默写</div></div>
        <div style="color:var(--ink3)">›</div>
      </div>`;
    if(due.length) html += `
      <div class="item" data-act="startReview">
        <div style="width:38px;height:38px;border-radius:12px;background:var(--okSoft);color:var(--ok);
          display:flex;align-items:center;justify-content:center;font-weight:700">复</div>

        <div style="color:var(--ink3)">›</div>
      </div>`;

    html += `<div class="sect"><h3>难词</h3><button data-tab="hard">全部 ${hard} 个 ›</button></div>
      <div class="item" data-act="startDrill">
        <div style="width:38px;height:38px;border-radius:12px;background:var(--badSoft);color:var(--bad);
          display:flex;align-items:center;justify-content:center;font-weight:700">难</div>
        <div class="m"><div class="en">专项复习 ${Math.min(hard,20)} 个</div>
          <div class="zh">只练反复忘的词，会同步更新记忆强度</div></div>
        <div style="color:var(--ink3)">›</div>
      </div>`;
  }

  const misDueList = dueMistakes().slice().sort(misUrgentSort);
  const misDue = misDueList.length;
  if(misDue){
    const preview = misDueList.slice(0,2).map(m=>locLabel(m)).join('、');
    html += `<div class="sect"><h3>错题</h3><button data-tab="mistakes">错题本 ›</button></div>
      <div class="item" data-act="startMrev">
        <div style="width:38px;height:38px;border-radius:12px;background:var(--warnSoft);color:var(--warn);
          display:flex;align-items:center;justify-content:center;font-weight:700">错</div>
        <div class="m"><div class="en">${mustLeft?`今天必做 ${mustLeft} 道`:'必做已清，再翻几道等等'}</div>
          <div class="zh">${esc(preview)}${misDue>2?' …':''}　·　等等 ${laterN} 道</div>
          <div class="mt">到期 ${misDue}${overdueCount()?`（逾期 ${overdueCount()}）`:''} · 必做 ${mustDone}/${mustTotal}</div></div>
        <div style="color:var(--ink3)">›</div>
      </div>`;
  }

  const learned = S.items.filter(i=>i.learned && i.status==='active').length;
  if(learned){
    html += `<div class="sect"><h3>自由复习</h3></div>
      <div class="item" data-act="openFree">
        <div style="width:38px;height:38px;border-radius:12px;background:var(--brandSoft);color:var(--brand);

        <div class="m"><div class="en">自己挑词练</div>
          <div class="zh">${learned} 个已学词 · 可听写 · 不影响排期</div></div>
        <div style="color:var(--ink3)">›</div>
      </div>`;
  }

  if(grad) html += `<div class="sect"><h3>已结业</h3><span style="font-size:12.5px;color:var(--ink3)">${grad} 个</span></div>`;
  $('#homeBody').innerHTML = html;
}

async function openBooks(){
  $('#sheetTitle').textContent = '选择词书';
  $('#sheetBody').innerHTML = `<div class="empty">正在加载词书…</div>`;
  openSheet();
  const d = await loadBooks();
  if(!d.books.length){
    $('#sheetBody').innerHTML = `<div class="empty"><b>词书数据未加载</b>请检查 books.json 是否存在</div>`;
    return;
  }
  const cur = S.settings.book;
  const cats = {};
  d.books.forEach(b=>{ (cats[b.category] = cats[b.category]||[]).push(b); });
  let html = `<p class="tip">选一本词书，学新词时会自动从里面取词；已学进度不会丢。词库来自 ECDICT（MIT）。</p>`;
  Object.keys(cats).forEach(cat=>{
    html += `<div class="sect" style="margin:14px 0 8px"><h3>${esc(cat)}</h3></div>`;
    cats[cat].forEach(b=>{
      const st = bookStats(b);
      html += `<div class="item" data-act="pickBook" data-id="${b.id}">
        <div class="bookcover">${esc(b.name.slice(0,1))}</div>
        <div class="m">
          <div class="en">${esc(b.name)} <span class="pill">${esc(b.level)}</span>${cur===b.id?'<span class="pill ok" style="margin-left:4px">当前</span>':''}</div>
          <div class="zh">${b.count} 词 · 已学 ${st.learned} · 词库中 ${st.inLib}</div>
        </div>
        <div style="color:var(--ink3)">${cur===b.id?'✓':'›'}</div>
      </div>`;
    });
  });
  html += `<p class="tip" style="text-align:center">「加入」只把词放进词库；「开始学」按每日新词上限自动取词。</p>`;
  $('#sheetBody').innerHTML = html;
  // 按钮放在滚动区外，固定在弹层底部，避免滚动时压住列表/提示
  const oldFoot = $('#sheet .bookfoot');
  if(oldFoot) oldFoot.remove();
  const foot = document.createElement('div');
  foot.className = 'bookfoot';
  foot.style.cssText = 'flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);padding:10px 18px;display:flex;gap:10px;z-index:2';
  foot.innerHTML = `<button class="btn" data-act="bookAdd">加入 100 个</button>
    <button class="btn primary" data-act="bookLearn">开始学这本</button>`;
  $('#sheet').appendChild(foot);
}
function pickBook(id){
  const bk = bookById(id);
  if(!bk) return;
  S.settings.book = id;
  S.settings.bookName = bk.name;
  save();
  renderHome();
  openBooks();
  toast('已选择：'+bk.name);
}
async function bookAdd(){
  const n = await topUpFromBook(100);
  renderHome();
  await openBooks();
  toast(n ? `已加入 ${n} 个词` : '这些词已经在词库里了');
}
function bookLearn(){
  closeSheet();
  startLearn();
}

let wordFilter = '', tagFilter = '', wordSort = 'recent', wordShown = 60, wordSearchT = null;
let wordBatch = null;   // Set<id>，批量直接学会的选择态
function renderWords(){
  $('#wordsCount').textContent = S.items.length + ' 个';
  const hasFresh = S.items.some(i=>!i.learned && i.status==='active');
  const bb = $('#batchBtn');
  if(bb) bb.style.display = (hasFresh && !wordBatch) ? '' : 'none';
  if(!S.items.length){
    $('#wordsBody').innerHTML = `<div class="empty"><b>还没有生词</b>点右下角 + 添加，或从词典查一个词</div>`;
    const bar0 = $('#batchBar'); if(bar0) bar0.style.display='none';
    return;
  }
  const tags = allTags();
  $('#wordsBody').innerHTML = `
    <input id="wSearch" placeholder="搜索单词 / 中文释义 / 标签" value="${esc(wordFilter)}"
      style="width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);
      padding:0 14px;margin:4px 0 10px;outline:none">
    <div class="chips" style="margin:0 0 10px">
      <button class="chip sm ${wordSort==='recent'?'on':''}" data-wsort="recent">最近</button>
      <button class="chip sm ${wordSort==='due'?'on':''}" data-wsort="due">按到期日</button>
      <button class="chip sm ${wordSort==='alpha'?'on':''}" data-wsort="alpha">字母</button>
    </div>
    ${tags.length?`<div class="chips" style="margin:0 0 10px">
      <button class="chip sm ${tagFilter?'':'on'}" data-tagfilter="">全部</button>
      ${tags.map(t=>`<button class="chip sm ${tagFilter===t?'on':''}" data-tagfilter="${esc(t)}">#${esc(t)}</button>`).join('')}
    </div>`:''}
    ${tagFilter?`<button class="btn primary" style="height:40px;font-size:14px;margin-bottom:10px" data-act="freeTag" data-tag="${esc(tagFilter)}">复习 #${esc(tagFilter)} 的词</button>`:''}
    <div id="wordList"></div>`;
  const inp = $('#wSearch');
  inp.addEventListener('input', e=>{
    const v = e.target.value.toLowerCase();
    clearTimeout(wordSearchT);
    wordSearchT = setTimeout(()=>{ wordFilter = v; wordShown = 60; renderWordList(); }, 140);
  });
  renderWordList();
}
function renderWordList(){
  const el = $('#wordList');
  if(!el) return;
  const q = wordFilter.trim();
  let list = S.items.filter(i=>{
    if(q){
      const hay = [i.en, i.zh||'', (i.tags||[]).join(' '), i.bookName||''].join(' ').toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    if(tagFilter && !(i.tags||[]).includes(tagFilter)) return false;
    return true;
  });
  if(wordSort==='alpha'){
    list.sort((a,b)=>String(a.en).localeCompare(String(b.en),'en'));
  }else if(wordSort==='due'){
    const key = i=> (i.learned && i.status==='active') ? (dueDate(i)||'9999-12-31') : '9999-12-31';
    list.sort((a,b)=> key(a).localeCompare(key(b)) || String(a.en).localeCompare(String(b.en),'en'));
  }else{
    list.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  }
  // 批量学会只关心待学词
  if(wordBatch) list = list.filter(i=>!i.learned && i.status==='active');
  if(!list.length){
    el.innerHTML = `<div class="empty">${wordBatch?'没有待学的词了':'没有匹配的词'}</div>`;
    const bar0 = $('#batchBar');
    if(bar0 && wordBatch){
      bar0.style.display='flex';
      bar0.innerHTML = `<div style="flex:1;font-size:13px;color:var(--ink2)">已选 ${wordBatch.size} 个</div>
        <button class="btn" data-act="batchOff" style="height:38px;flex:0 0 86px;font-size:13px">取消</button>`;
    }else if(bar0){ bar0.style.display='none'; bar0.innerHTML=''; }
    const fab0 = $('#scr-words .fab'); if(fab0) fab0.style.display = wordBatch?'none':'';
    return;
  }
  const total = list.length;
  const shown = list.slice(0, wordShown);
  const bt = wordBatch;
  el.innerHTML = shown.map(i=>{
    const dd = dueDate(i);
    const isDue = i.learned && i.status==='active' && dd && dd<=today();
    const st = i.status==='graduated' ? '<span class="pill ok">长期记忆</span>'
      : !i.learned ? '<span class="pill">待学</span>'
      : isDue ? '<span class="pill">今天到期</span>'
      : `<span class="pill ok">${i.fsrs?i.fsrs.s.toFixed(1)+' 天':'已学'}</span>`;
    if(bt){
      const sel = bt.has(i.id);
      const can = !i.learned;
      return `<div class="item" ${can?`data-batch="${i.id}"`:''} style="${can?'':'opacity:.45'}">
        <div style="width:22px;height:22px;border-radius:50%;border:1.5px solid ${sel?'var(--brand)':'var(--line)'};
          background:${sel?'var(--brand)':'transparent'};color:#fff;display:flex;align-items:center;justify-content:center;
          font-size:13px;flex:0 0 auto">${sel?'✓':''}</div>
        <div class="m">
          <div class="en">${esc(i.en)}　${st}</div>
          <div class="zh">${esc(i.zh||'（无释义）')}</div>
        </div>
      </div>`;
    }
    return `<div class="item" data-detail="${i.id}">
      <div class="m">
        <div class="en">${esc(i.en)}　${st}</div>
        <div class="zh">${esc(i.zh||'（无释义）')}</div>
        <div class="mt">${i.bookName?`<span class="tag">${esc(i.bookName)}</span>`:''}${(i.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}
          ${i.status==='active'?(i.learned?`下次 ${dd||'—'}`:'尚未学习'):'已完成全部复习'}</div>
      </div>
      <div style="color:var(--ink3)">›</div>
    </div>`;
  }).join('') + (total > wordShown
    ? `<button class="btn" data-act="moreWords" style="width:100%;margin-top:6px;height:44px">加载更多（还有 ${total-wordShown} 个）</button>`
    : '');
  const bar = $('#batchBar');
  if(bar){
    if(bt){
      const shownIds = shown.filter(i=>!i.learned && i.status==='active').map(i=>i.id);
      const allSel = shownIds.length>0 && shownIds.every(id=>bt.has(id));
      bar.style.display='flex';
      bar.innerHTML = `<div style="flex:1;font-size:13px;color:var(--ink2)">已选 ${bt.size} 个</div>
        <button class="btn" data-act="batchAll" style="height:38px;flex:0 0 62px;font-size:12px;padding:0">${allSel?'取消全选':'本页全选'}</button>
        <button class="btn" data-act="batchOff" style="height:38px;flex:0 0 56px;font-size:12.5px;padding:0">取消</button>
        <button class="btn primary" data-act="batchDo" style="height:38px;flex:0 0 112px;font-size:12.5px;padding:0" ${bt.size?'':'disabled'}>直接学会</button>`;
    }else{
      bar.style.display='none'; bar.innerHTML='';
    }
  }
  const sc = $('#wordsBody');
  if(sc) sc.style.paddingBottom = bt ? '150px' : '';
  const fab = $('#scr-words .fab');
  if(fab) fab.style.display = bt ? 'none' : '';
}

let freeSel = {scope:'all', count:20, qmode:'mix', tag:null};
function allTags(){
  const set = new Set();

}
function openFree(tag){

function renderFreeSheet(){
  const tags = allTags();
  const learned = S.items.filter(i=>i.learned && i.status==='active').length;
  const scopes = [['all','全部词库'],['low','低阶词'],['hard','难词'],['tag','按标签']];
  const counts = [[10,'10'],[20,'20'],[30,'30'],[9999,'全部']];
  const qmodes = [['mix','混合'],['zh2en','看词义默写'],['listen','听写']];
  $('#sheetTitle').textContent = '自由复习';
  $('#sheetBody').innerHTML = `
    <p class="tip">从已有词里挑着练，不影响复习排期。已学 ${learned} 个。</p>
    <div class="sect" style="margin:14px 0 8px"><h3>范围</h3></div>
    <div class="chips">
      ${scopes.map(([v,l])=>`<button class="chip sm ${freeSel.scope===v?'on':''}" data-fs="scope" data-v="${v}">${l}</button>`).join('')}
    </div>
    ${freeSel.scope==='tag'?`
      <div class="chips" style="margin-top:8px">
        ${tags.length?tags.map(t=>`<button class="chip sm ${freeSel.tag===t?'on':''}" data-fs="tag" data-v="${esc(t)}">#${esc(t)}</button>`).join('')
          :'<span class="tip">还没有标签，去添加词时写 #标签</span>'}
      </div>`:''}
    <div class="sect" style="margin:16px 0 8px"><h3>数量</h3></div>
    <div class="chips">
      ${counts.map(([v,l])=>`<button class="chip sm ${freeSel.count===v?'on':''}" data-fs="count" data-v="${v}">${l}</button>`).join('')}
    </div>
    <div class="sect" style="margin:16px 0 8px"><h3>题型</h3></div>
    <div class="chips">
      ${qmodes.map(([v,l])=>`<button class="chip sm ${freeSel.qmode===v?'on':''}" data-fs="qmode" data-v="${v}">${l}</button>`).join('')}
    </div>
    <button class="btn primary" style="margin-top:20px;width:100%" data-act="startFree">开始复习</button>`;
}
function startFree(){
  if(S.exam && S.exam.date===today() && !S.exam.done && (S.exam.ids||[]).length){
    toast('先完成今天的默写再来自由复习');
    return;
  }
  let pool = S.items.filter(i=>i.learned && i.status==='active');
  if(freeSel.scope==='hard') pool = pool.filter(i=>(i.errCount||0)>=2);
  if(freeSel.scope==='low') pool = pool.filter(i=>i.stage<=2);
  if(freeSel.scope==='tag'){
    if(!freeSel.tag){ toast('先选一个标签'); return; }
    pool = pool.filter(i=>(i.tags||[]).includes(freeSel.tag));
  }
  if(!pool.length){ toast('这个范围里没有已学的词'); return; }
  const shuffled = shuffle(pool.slice());
  const n = freeSel.count >= 9999 ? shuffled.length : Math.min(freeSel.count, shuffled.length);
  const ids = shuffled.slice(0,n).map(i=>i.id);
  exam = {mode:'free', qmode:freeSel.qmode, ids, ans:{}, ptr:0, date:today(), done:false,
          deferred:0, total:0, right:0, results:null};
  closeSheet();
  showScreen('review');
  renderExam();
}

/* ---------- 位置解析：练习册十一页5 → P11-5 ---------- */
function cnNum(s){
  s = String(s||'').trim();
  if(/^\d+$/.test(s)) return Number(s);
  const map = {零:0,一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
  let total = 0, cur = 0;
  for(const ch of s){
    if(ch==='十'){ total += (cur||1)*10; cur = 0; }
    else if(ch==='百'){ total += (cur||1)*100; cur = 0; }
    else if(map[ch] != null){ cur = map[ch]; }
  }
  return total + cur;
}
function parseLoc(text){
  const t = String(text||'');
  let page = 0, no = '', book = '';
  let m = t.match(/(\d{1,3})\s*[-–.．]\s*(\d{1,3})/);
  if(m && /[页Pp]/.test(t)){ page = Number(m[1]); no = m[2]; }
  if(!page){
    m = t.match(/(?:第)?([一二三四五六七八九十百零两\d]+)\s*页/);
    if(m) page = cnNum(m[1]);
  }
  if(!no){
    m = t.match(/页\s*(?:第)?([一二三四五六七八九十百零两\d]+)/);
    if(m) no = String(cnNum(m[1]));
  }
  if(!no){
    m = t.match(/第\s*([一二三四五六七八九十百零两\d]+)\s*题/);
    if(m) no = String(cnNum(m[1]));
  }
  if(!no && page){
    m = t.match(/页\s*(\d{1,3})/);
    if(m) no = m[1];
  }
  const bm = t.match(/^(.{1,14}?)(?:第?[一二三四五六七八九十百零两\d]+\s*页|第?[一二三四五六七八九十百零两\d]+\s*题)/);
  if(bm) book = bm[1].replace(/^今日错题/,'').replace(/^第+/,'').trim();
  return {page, no, book};
}
function locLabel(m){
  const book = String(m.book||'').replace(/^第/,'').trim();
  if(m.page) return (book?book+' ':'')+'P'+m.page+(m.no?'-'+m.no:'');
  if(m.no) return (book?book+' ':'')+'第'+m.no+'题';
  return String(m.text||'').slice(0,10);
}
function misSort(a,b){
  const sa = subjIdx(a.subject), sb = subjIdx(b.subject);
  if(sa!==sb) return sa-sb;
  const pa = a.page||9999, pb = b.page||9999;
  if(pa!==pb) return pa-pb;
  const na = Number(a.no)||9999, nb = Number(b.no)||9999;
  if(na!==nb) return na-nb;
  return (a.created||'').localeCompare(b.created||'');
}

function dueMistakes(){
  const t = today();
  return S.mistakes.filter(m=>!m.done && m.nextDate && m.nextDate<=t).sort(misSort);
}
function overdueDays(m){
  if(!m || m.done || !m.nextDate) return 0;
  const t = today();
  if(m.nextDate >= t) return 0;
  return Math.round((new Date(t) - new Date(m.nextDate)) / 86400000);
}
function overdueCount(){
  return S.mistakes.filter(m=>!m.done && overdueDays(m)>0).length;
}
function subjIdx(s){ const i = SUBJECTS.indexOf(s); return i<0?0:i; }

function makeMistake(subject, text, answer, tag, cause, img, book, topic, derived){
  const t = today();
  const loc = parseLoc(text);
  return {
    id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    subject, text, answer:answer||'', tag:tag||'', cause:cause||'', img:img||'',
    book: book || loc.book || '', page:loc.page, no:loc.no,
    topic: topic||'', derived: Array.isArray(derived)?derived:[],
    fav:false, failCount:0,
    created:t, stage:0, reviews:0,
    nextDate: addD(t, mistakeGaps()[0]), done:false, finishedAt:'',
    history:[], updatedAt:Date.now()
  };
}

function misMatch(m){
  const q = misFilter.q.trim().toLowerCase();
  if(misFilter.fav && !m.fav) return false;
  if(misFilter.subject && m.subject !== misFilter.subject) return false;
  if(misFilter.book && (m.book||'') !== misFilter.book) return false;
  if(misFilter.topic && (m.topic||'') !== misFilter.topic) return false;
  if(misFilter.cause && (m.cause||'') !== misFilter.cause) return false;
  if(q){
    const hay = [m.text, m.answer||'', m.tag||'', m.subject, m.topic||'', (m.derived||[]).join(' '), locLabel(m)].join(' ').toLowerCase();
    if(hay.indexOf(q) < 0) return false;
  }
  return true;
}
function filteredActive(){
  return S.mistakes.filter(m=>!m.done && misMatch(m)).sort(misSort);
}

function fmtD(d){
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function weeklyMistakeTrend(){
  const out = [];
  const now = new Date(today());
  for(let i=5;i>=0;i--){
    const end = new Date(now); end.setDate(now.getDate() - i*7);
    const start = new Date(end); start.setDate(end.getDate() - 6);
    const sd = fmtD(start), ed = fmtD(end);
    const add = S.mistakes.filter(m=>(m.created||'')>=sd && (m.created||'')<=ed).length;
    const done = S.mistakes.filter(m=>(m.finishedAt||'')>=sd && (m.finishedAt||'')<=ed).length;
    out.push({label: sd.slice(5)+'~'+ed.slice(5), add, done});
  }
  const max = Math.max(1, ...out.map(w=>w.add), ...out.map(w=>w.done));
  out.forEach(w=>{ w.addPct = Math.round(w.add/max*100); w.donePct = Math.round(w.done/max*100); });
  return out;
}

  setTimeout(()=>{ const b=$('#misBox'); if(b) b.focus(); },200);
}

function parseMistakeLine(line, defSub){
  let s = String(line).trim();
  if(!s) return null;
  const tags = [];
  let mm;
  while((mm = s.match(/(?:^|\s)#([^\s#]+)\s*$/))){ tags.unshift(mm[1]); s = s.slice(0,mm.index).trim(); }
  let sub = '', txt = s;
  const sm = s.match(/^(语文|数学|英语|物理|化学|地理)\s*[:：]\s*(.+)$/);
  if(sm){ sub = sm[1]; txt = sm[2].trim(); }
  let note = '';
  const parts = txt.split(/\s*(?:⇒|=>|→)\s*/);
  if(parts.length >= 2){ txt = parts[0].trim(); note = parts.slice(1).join(' ⇒ ').trim(); }
  if(!txt) return null;
  return {subject: sub || defSub, text: txt, answer: note, tag: tags[0]||''};
}

function splitDerived(s){
  return String(s||'').split(/[,，、;；\s]+/).map(x=>x.trim()).filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).slice(0,12);
}

function doAddMistake(){
  const box = $('#misBox');
  const raw = (box && box.value || '').trim();
  if(!raw){ toast('先输入错题'); return; }
  const defSub = S.settings.lastSubject || '物理';
  const book = (($('#addBook') && $('#addBook').value) || '').trim();
  const topic = normTopic(($('#addTopic') && $('#addTopic').value) || '');
  const derived = splitDerived(($('#addDerived') && $('#addDerived').value) || '');
  if(book){
    S.settings.lastBook = S.settings.lastBook || {};
    S.settings.lastBook[defSub] = book;
  }
  if(topic){
    S.settings.lastTopic = S.settings.lastTopic || {};
    S.settings.lastTopic[defSub] = topic;
  }
  const ok = [];
  let bad = 0;
  raw.split(/\r?\n/).filter(l=>l.trim()).forEach(line=>{
    const p = parseMistakeLine(line, defSub);
    if(!p || !p.subject || !p.text){ bad++; return; }
    ok.push(p);
  });
  let dupN = 0;
  const fresh = ok.filter(p=>{
    const loc = parseLoc(p.text);
    const useBook = book || loc.book || '';
    if(!loc.page) return true;
    const hit = S.mistakes.some(m=>!m.done && m.subject===p.subject && (m.book||'')===useBook
      && m.page===loc.page && String(m.no||'')===String(loc.no||''));
    if(hit){ dupN++; return false; }
    return true;
  });
  fresh.forEach((p,i)=>S.mistakes.push(makeMistake(p.subject, p.text, p.answer, p.tag, addCause, i===0?addImg:'', book, topic, derived)));
  save();
  closeSheet();
  renderAll();
  let msg = `已录入 ${fresh.length} 道`;
  if(dupN) msg += `，跳过重复 ${dupN}`;
  if(bad) msg += `，${bad} 行无法识别`;
  toast(msg);
}

/* ---------- 图片（IndexedDB，不占 localStorage 的 5MB） ---------- */
let _imgDB = null;
function imgDB(){
  if(_imgDB) return _imgDB;
  _imgDB = new Promise((res,rej)=>{
    try{
      const r = indexedDB.open('wengu_img',1);
      r.onupgradeneeded = ()=>{ const db=r.result; if(!db.objectStoreNames.contains('img')) db.createObjectStore('img'); };
      r.onsuccess = ()=>res(r.result);
      r.onerror = ()=>rej(r.error);
    }catch(e){ rej(e); }
  });
  return _imgDB;
}
function imgPut(key, data){
  return imgDB().then(db=>new Promise((res,rej)=>{
    const tx = db.transaction('img','readwrite');
    tx.objectStore('img').put(data, key);
    tx.oncomplete = ()=>res(key);
    tx.onerror = ()=>rej(tx.error);
  }));
}
function imgGet(key){
  return imgDB().then(db=>new Promise((res,rej)=>{
    const tx = db.transaction('img','readonly');
    const rq = tx.objectStore('img').get(key);
    rq.onsuccess = ()=>res(rq.result || '');
    rq.onerror = ()=>rej(rq.error);
  }));
}
function imgKeys(){
  return imgDB().then(db=>new Promise((res,rej)=>{
    const tx = db.transaction('img','readonly');
    const rq = tx.objectStore('img').getAllKeys();
    rq.onsuccess = ()=>res(rq.result || []);
    rq.onerror = ()=>rej(rq.error);
  }));
}
function imgDel(key){
  return imgDB().then(db=>new Promise((res,rej)=>{
    const tx = db.transaction('img','readwrite');
    tx.objectStore('img').delete(key);
    tx.oncomplete = ()=>res(true);
    tx.onerror = ()=>rej(tx.error);
  }));
}
/** 清掉没有被任何错题引用的图片 */
async function imgGc(){
  try{
    const used = new Set((S.mistakes||[]).map(m=>imgKeyOf(m.img)).filter(Boolean));
    const keys = await imgKeys();
    let n = 0;
    for(const k of keys){
      if(!used.has(k)){ await imgDel(k); n++; }
    }
    toast(n ? `已清理 ${n} 张无用图片` : '没有无用图片');
    return n;
  }catch(e){ toast('图片清理失败'); return 0; }
}
function imgKeyOf(v){ return v && String(v).indexOf('idb:')===0 ? String(v).slice(4) : ''; }
async function imgUrlOf(v){
  const k = imgKeyOf(v);
  if(!k) return String(v||'');
  try{ return await imgGet(k); }catch(e){ return ''; }
}
async function hydrateImgs(root){
  const nodes = (root||document).querySelectorAll('img[data-img]');
  for(const el of nodes){
    const src = await imgUrlOf('idb:'+el.dataset.img);
    if(src) el.src = src;
  }
}
/** 把旧的 base64 图片迁到 IndexedDB */
async function migrateImgs(){
  let changed = false;
  for(const m of S.mistakes){
    if(m.img && /^data:image\//.test(m.img)){
      const key = 'i'+m.id.replace(/^m/,'');
      try{ await imgPut(key, m.img); m.img = 'idb:'+key; changed = true; }
      catch(e){ break; }
    }
  }
  if(changed) save();
}

function pickImage(cb){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.setAttribute('capture','environment');
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0];
    if(!f) return;
    resizeImage(f, cb);
  };
  inp.click();
}
function resizeImage(file, cb){
  const r = new FileReader();
  r.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const max = 900;
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.width*k));
      cv.height = Math.max(1, Math.round(img.height*k));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', 0.62));
    };
    img.onerror = ()=>toast('图片读取失败');
    img.src = r.result;
  };
  r.onerror = ()=>toast('图片读取失败');
  r.readAsDataURL(file);
}

let mrev = null;
function startMrev(ids){
  const explicit = Array.isArray(ids) && ids.length > 0;
  let list;
  if(explicit){
    list = ids.map(id=>mrevById(id)).filter(Boolean).sort(misUrgentSort);
  }else{
    const mp = misPlanToday();
    const done = new Set(mp.done||[]);
    list = mp.ids.filter(id=>!done.has(id)).map(id=>mrevById(id)).filter(Boolean).sort(misUrgentSort);
    if(!list.length){
      // 必做清完了：允许再翻一批「等等」，但不影响今日完成
      const later = dueMistakes().filter(m=>mp.ids.indexOf(m.id)<0).sort(misUrgentSort);
      if(later.length){
        list = later.slice(0, misQuotaBase());
        toast(`今天必做已清，再翻 ${list.length} 道等等`);
      }
    }
  }
  if(!list.length){ toast('今天没有必做的错题'); return; }
  const single = explicit && ids.length === 1;
  const picked = single ? list.slice(0,1) : (explicit ? list : list.slice(0, misQuotaBase()));
  if(explicit && picked.length > misQuotaBase()) toast(`这次 ${picked.length} 道，算额外练习`);
  else if(!explicit && picked.length < list.length) toast(`今天必做 ${picked.length} 道，其余等等`);
  mrev = {ids:picked.map(m=>m.id), total:picked.length, counts:{ok:0,bad:0}, startedAt:Date.now(), plan:!explicit};
  $('#mrevTitle').textContent = explicit ? '错题复习' : '今日必做错题';
  showScreen('mrev');
  renderMrev();
}
function startMrevFiltered(){
  const ids = filteredActive().map(m=>m.id);
  if(!ids.length){ toast('没有符合条件的错题'); return; }
  startMrev(ids);
}

function markMrev(level, id){
  if(!mrev) return;
  const m = mrevById(id);
  if(!m) return;
  const i = mrev.ids.indexOf(id);
  if(i < 0) return;
  const t = today();
  m.reviews = (m.reviews||0)+1;
  m.history = (m.history||[]).slice(-30);
  m.history.push({d:t, ok: level==='ok', level});
  if(level==='ok'){
    mrev.counts.ok++;
    m.stage = (m.stage||0)+1;
    if(m.stage >= misRounds(m)){
      m.done = true; m.nextDate = ''; m.finishedAt = t;
    }else{
      m.nextDate = addD(t, mistakeGaps()[Math.min(m.stage, mistakeGaps().length-1)]);
    }
  }else{
    mrev.counts.bad++;
    const R = misRounds(m);
    m.failCount = (m.failCount||0)+1;
    // 最后一轮还不会：退一轮，不要第二天再点一次「做完了」就归档
    if((m.stage||0) >= R - 1) m.stage = Math.max(0, (m.stage||0)-1);
    m.nextDate = addD(t, 1);
  }
  m.updatedAt = Date.now();
  if(mrev.plan) markPlanDone(id);
  mrev.ids.splice(i,1);
  const dd = S.days[t] || {ans:0, right:0, items:0};
  dd.mis = (dd.mis||0) + 1;
  S.days[t] = dd;
  save();
  renderMrev();
}
function doneMrev(){
  mrev = null;
  goHome();
  renderAll();
}

let examSel = {subject:'', book:'', only:'all', rounds:'all', range:'all', topic:''};
function examListItems(sel){
  const s = sel || examSel;
  return S.mistakes.filter(m=>{
    if(m.done) return false;
    if(s.subject && m.subject !== s.subject) return false;
    if(s.book && (m.book||'') !== s.book) return false;
    if(s.topic && (m.topic||'') !== s.topic) return false;
    if(s.range && s.range !== 'all'){
      const days = Number(s.range) || 0;
      if(days && (m.created||'') < addD(today(), -(days-1))) return false;
    }
    if(s.only==='fav' && !m.fav) return false;
    if(s.only==='stuck' && (m.failCount||0) < 2) return false;
    if(s.only==='overdue' && !(overdueDays(m) > 0)) return false;
    if(s.only==='due' && !(m.nextDate && m.nextDate <= today())) return false;
    const round = Math.min((m.stage||0)+1, misRounds(m));
    if(s.rounds==='early' && round > 2) return false;
    if(s.rounds==='late' && round < 3) return false;
    return true;
  }).sort(misSort);
}
function countBy(list, getter){
  const cnt = {};
  list.forEach(m=>{
    const v = getter(m);
    if(!v) return;
    if(Array.isArray(v)) v.forEach(x=>{ if(x) cnt[x] = (cnt[x]||0)+1; });
    else cnt[v] = (cnt[v]||0)+1;
  });
  return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(k=>({k, n:cnt[k]}));
}
function locShort(m){
  if(m.page) return 'P'+m.page+(m.no?'-'+m.no:'');
  if(m.no) return '第'+m.no+'题';
  return String(m.text||'').slice(0,12);
}
function examListText(){
  const list = examListItems();
  if(!list.length) return '';
  const groups = {};
  list.forEach(m=>{
    const key = m.subject + (m.book ? ' · '+m.book : '');
    (groups[key] = groups[key] || []).push(m);
  });
  const lines = Object.keys(groups).map(k=>`【${k}】`+
    groups[k].map(m=>`${locShort(m)}（第${Math.min((m.stage||0)+1, misRounds(m))}/${misRounds(m)}遍）`).join('　')
  );
  const tSum = countBy(list, m=>m.topic||'');
  const dSum = countBy(list, m=>m.derived||[]);
  if(tSum.length) lines.push('', '— 知识点 —', tSum.map(x=>x.k+'（'+x.n+'）').join('、'));
  if(dSum.length) lines.push('', '— 衍生知识点 —', dSum.map(x=>x.k+'（'+x.n+'）').join('、'));
  return lines.join('\n');
}

function legacyCopy(txt){

    ta.value = txt;
    ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, txt.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){ return false; }
}
function copyText(txt){

  const manual = ()=>{

  };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(()=>{ legacyCopy(txt) ? done() : manual(); });
    }else{
      legacyCopy(txt) ? done() : manual();
    }
  }catch(e){ legacyCopy(txt) ? done() : manual(); }
}

  return lines.join('\n');
}

function saveMistake(id){
  const m = mrevById(id);
  if(!m) return;
  const text = ($('#epText').value||'').trim();
  if(!text){ toast('题目不能为空'); return; }
  const oldImg = imgKeyOf(m.img);
  m.subject = editM.subject;
  m.cause = editM.cause || '';
  m.img = editM.img || '';
  m.text = text;
  const loc = parseLoc(text);
  m.book = ($('#epBook').value||'').trim() || loc.book;
  m.topic = normTopic($('#epTopic').value);
  m.derived = splitDerived($('#epDerived').value);
  m.page = loc.page; m.no = loc.no;
  m.answer = ($('#epAnswer').value||'').trim();
  m.tag = ($('#epTag').value||'').trim().replace(/^#/,'');
  m.updatedAt = Date.now();
  const newImg = imgKeyOf(m.img);
  save();
  if(oldImg && oldImg !== newImg) imgDel(oldImg).catch(()=>{});
  closeSheet();
  renderAll();
  openMistakeDetail(id);
  toast('已保存');
}

function heatCells(){
  const letters = 'abcdefghijklmnopqrstuvwxyz'.split('');
  const heat = S.spellHeat || {};
  const max = Math.max(1, ...letters.map(l=>heat[l]||0));
  return letters.map(l=>{
    const n = heat[l]||0;
    if(!n) return `<i>${l}</i>`;
    const r = n/max;
    const a = 0.15 + 0.85*r;
    return `<i class="${r>0.45?'hot':''}" style="background:rgba(229,72,77,${a.toFixed(2)})">${l}</i>`;
  }).join('');
}

function restoreSnap(i){
  const s = snapshots()[Number(i)];
  if(!s) return;
  if(!confirm('用 '+s.d+' 的快照覆盖当前数据？当前进度会丢失')) return;
  try{
    const o = JSON.parse(s.data);

function backupDirs(){
  return [
    {directory:'DOCUMENTS', path:'温故'},
    {directory:'DATA', path:''}
  ];
}
async function listDocBackups(){
  const FS = capPlugin('Filesystem');
  if(!FS) return [];
  const out = [];
  for(const d of backupDirs()){
    try{
      const r = await FS.readdir({path:d.path, directory:d.directory});
      (r.files||[]).forEach(f=>{
        if(!/\.json$/i.test(f.name) || !/备份/.test(f.name)) return;
        out.push({name:f.name, path:(d.path?d.path+'/':'')+f.name,
                  directory:d.directory, mtime:f.mtime||0, size:f.size||0});
      });
    }catch(e){}
  }
  out.sort((a,b)=>(b.mtime||0)-(a.mtime||0));
  return out;
}
async function openDocRestore(){

async function restoreDoc(i, merge){
  const b = (window.__docList||[])[Number(i)];

  const FS = capPlugin('Filesystem');
  if(!FS) return;
  try{
    const r = await FS.readFile({path:b.path, directory:b.directory, encoding:'utf8'});
    const txt = typeof r.data==='string' ? r.data : '';
    const o = JSON.parse(txt);
    if(!validBackup(o)){ toast('备份内容不对'); return; }
    const auto = await preRestoreBackup();
    if(!confirm((auto?'已自动备份当前数据。':'未能自动备份当前数据。')+
      (merge?'把 '+b.name+' 合并到当前数据？':'用 '+b.name+' 覆盖当前数据？当前进度会丢失'))) return;
    if(merge){
      const m = await mergeBackupData(o);
      toast(`合并完成：词 +${m.add} / 合并 ${m.merge}，错题 +${m.mAdd}`);
      return;
    }
    const imgN = Object.keys(o.imgs||{}).length;
    await applyBackupObject(o);
    toast('已恢复 '+b.name+(imgN?`（含 ${imgN} 张图片）`:''));
  }catch(e){ toast('备份读取失败'); }
}

function fixSelfCheck(){
  const keep = new Map();
  const drop = new Set();
  S.items.forEach(it=>{
    const k = normEn(it.en);
    if(!k) return;
    if(keep.has(k)){
      const a = keep.get(k);
      a.totalAnswerCount = (a.totalAnswerCount||0) + (it.totalAnswerCount||0);
      a.errCount = Math.max(a.errCount||0, it.errCount||0);
      a.officialRightCount = (a.officialRightCount||0) + (it.officialRightCount||0);
      a.officialTestCount = (a.officialTestCount||0) + (it.officialTestCount||0);
      if(it.learned && !a.learned){
        a.learned = true; a.fsrs = it.fsrs || legacyFsrs(it); a.nextDate = it.nextDate;
      }
      drop.add(it.id);
      return;
    }
    keep.set(k, it);
    if(!String(it.zh||'').trim()) it.zh = dictSensesOf(it.en)[0] || '（待补释义）';
    if(it.learned && !it.fsrs) it.fsrs = legacyFsrs(it);
    if(it.learned && (!it.nextDate || !/^\d{4}-\d{2}-\d{2}$/.test(String(it.nextDate))))
      it.nextDate = it.fsrs ? it.fsrs.due : today();
  });
  S.items = S.items.filter(i=>!drop.has(i.id));
  S.mistakes.forEach(m=>{
    if(!m.done && !/^\d{4}-\d{2}-\d{2}$/.test(String(m.nextDate||''))) m.nextDate = today();
  });
  save(); closeSheet(); renderAll();
  toast('已修复'+(drop.size?`，合并重复 ${drop.size} 个`:''));
}

async function doAdd(){
  const box = $('#addBox');
  const raw = (box.value||'').trim();
  if(!raw){ toast('先输入内容'); return; }
  await loadDict();

  const lines = raw.split(/\r?\n/).filter(l=>l.trim());
  const ok=[], dup=[], bad=[];
  let autoZh = 0;

  for(const line of lines){
    const p = parseLine(line);
    if(!p){ bad.push(line.trim()); continue; }
    if(S.items.some(i=>normEn(i.en)===normEn(p.en)) || ok.some(x=>normEn(x.en)===normEn(p.en))){ dup.push(p.en); continue; }

    let zh = p.zh;
    if(!zh){
      const ds = dictSensesOf(p.en);
      if(ds.length){ zh = ds.slice(0,MAX_FILL_SENSES).join('；'); autoZh++; }
    }
    if(!zh){ bad.push(p.en); continue; }
    ok.push({en:p.en, zh, tags:p.tags});
  }

  ok.forEach(p=>{
    S.items.push(makeItem(p.en, p.zh, p.tags));
  });
  save();
  renderAll();

  let msg = `已导入 ${ok.length} 个`;
  if(autoZh) msg += `（自动翻译 ${autoZh} 个）`;
  if(dup.length) msg += `，跳过重复 ${dup.length}`;
  if(bad.length) msg += `，未识别 ${bad.length}（${bad.slice(0,3).join('、')}）`;
  toast(msg);
  if(ok.length) closeSheet();
}

function parseLine(line){
  let s = String(line).trim();
  if(!s) return null;
  const tags = [];
  let m;
  while((m = s.match(/(?:^|\s)#([^\s#]+)\s*$/))){ tags.unshift(m[1]); s = s.slice(0,m.index).trim(); }
  if(!s) return null;
  const toks = s.split(/\s+/);
  const i = toks.findIndex(t=>CJK.test(t));
  if(i>0) return {en:toks.slice(0,i).join(' '), zh:toks.slice(i).join(' '), tags};
  if(i===0) return null;
  if(!/^[A-Za-z][A-Za-z\s'\u2019.\-]*$/.test(s)) return null;
  return {en:s, zh:'', tags};
}

async function lookupFill(){
  const box = $('#addBox');
  if(!box) return;
  const lines = (box.value||'').split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length){ toast('先粘贴单词，一行一个'); return; }
  await loadDict();
  let filled=0, miss=0;
  const out = lines.map(line=>{
    const p = parseLine(line);
    if(!p) return line;
    let zh = p.zh;
    if(!zh){
      const ds = dictSensesOf(p.en);
      if(ds.length){ zh = ds.slice(0,MAX_FILL_SENSES).join('；'); filled++; }
      else miss++;
    }
    return p.en + (zh ? ' '+zh : '') + (p.tags.length ? ' '+p.tags.map(t=>'#'+t).join(' ') : '');
  });
  box.value = out.join('\n');
  toast(`翻译 ${filled} 个${miss?`，${miss} 个没查到`:''}`);
}

function download(name, text, mime){
  try{
    const b = new Blob([text],{type:mime||'application/json;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},100);
  }catch(e){ toast('导出失败'); }
}
async function doExport(){
  // 兼容 2.0 之前的 base64 图片：先尝试迁到 IndexedDB，失败也仍然留在 JSON 里
  try{ await migrateImgs(); }catch(e){}
  const out = JSON.parse(JSON.stringify(S)); out.exam = null; out.imgs = {};
  let n = 0, missing = 0;
  const tasks = [];
  for(const m of S.mistakes){
    const k = imgKeyOf(m.img);
    if(k){
      tasks.push(imgGet(k).then(d=>{
        if(d){ out.imgs[k] = d; n++; } else missing++;
      }).catch(()=>{ missing++; }));
    }else if(m.img && /^data:image\//.test(m.img)){
      n++;
    }else if(m.img){
      // blob:/file: 这类引用无法跨设备恢复，明确提示而不是静默算 0
      missing++;
    }
  }
  await Promise.all(tasks);
  download(`温故备份-${today()}.json`, JSON.stringify(out,null,2));
  toast('已导出，含 '+n+' 张图片'+(missing?`，${missing} 张读取失败`:''));
}

function mergeItemRecords(a,b){
  const aLast = (a.fsrs && a.fsrs.last) || 0;
  const bLast = (b.fsrs && b.fsrs.last) || 0;
  const src = bLast > aLast ? b : a;
  const out = JSON.parse(JSON.stringify(src));
  out.id = a.id || b.id;
  out.en = a.en || b.en;
  out.zh = a.zh || b.zh;
  out.tags = [...new Set([...(a.tags||[]), ...(b.tags||[])].filter(Boolean))];
  out.book = a.book || b.book;
  out.bookName = a.bookName || b.bookName;
  out.ex = a.ex || b.ex || null;
  out.fav = !!(a.fav || b.fav);
  out.learned = !!(a.learned || b.learned);
  out.totalAnswerCount = Math.max(a.totalAnswerCount||0, b.totalAnswerCount||0);
  out.officialTestCount = Math.max(a.officialTestCount||0, b.officialTestCount||0);
  out.officialRightCount = Math.max(a.officialRightCount||0, b.officialRightCount||0);
  out.errCount = Math.max(a.errCount||0, b.errCount||0);
  out.streak = Math.max(a.streak||0, b.streak||0);
  out.created = a.created || b.created;
  out.updatedAt = Math.max(a.updatedAt||0, b.updatedAt||0);
  out.history = ((a.history||[]).concat(b.history||[])).slice(-40);
  const f = a.fsrs || b.fsrs;
  out.fsrs = f ? JSON.parse(JSON.stringify(f)) : null;
  out.nextDate = out.fsrs ? out.fsrs.due : (a.nextDate || b.nextDate || '');
  return normalizeItem(out);
}
function mergeBackupObject(o){
  let add = 0, merge = 0, mAdd = 0, mMerge = 0;
  migrateItems(o.items||[]);
  (o.mistakes||[]).forEach(m=>{
    m.answer = m.answer || ''; m.cause = m.cause || ''; m.tag = m.tag || '';
    m.img = m.img || ''; m.book = m.book || ''; m.topic = normTopic(m.topic||'');
    m.derived = Array.isArray(m.derived) ? m.derived : [];
    m.fav = !!m.fav; m.failCount = m.failCount||0; m.finishedAt = m.finishedAt||'';
    if(!m.nextDate) m.nextDate = today();
  });
  const byEn = new Map(S.items.map(i=>[normEn(i.en), i]));
  (o.items||[]).forEach(x=>{
    if(!x || !x.en) return;
    const k = normEn(x.en);
    if(byEn.has(k)){
      const cur = byEn.get(k);
      const out = mergeItemRecords(cur, x);
      const idx = S.items.indexOf(cur);
      if(idx>=0) S.items[idx] = out;
      byEn.set(k, out);
      merge++;
    }else{
      S.items.push(x);
      byEn.set(k, x);
      add++;
    }
  });
  const byId = new Map(S.mistakes.map(m=>[m.id, m]));
  (o.mistakes||[]).forEach(m=>{
    if(!m || !m.id) return;
    if(byId.has(m.id)){
      const cur = byId.get(m.id);
      if((m.updatedAt||0) > (cur.updatedAt||0)) Object.assign(cur, m);
      mMerge++;
    }else{
      S.mistakes.push(m); byId.set(m.id, m); mAdd++;
    }
  });
  Object.keys(o.days||{}).forEach(d=>{
    const a = S.days[d] || {ans:0,right:0,items:0}, b = o.days[d] || {};
    S.days[d] = {ans:Math.max(a.ans||0,b.ans||0), right:Math.max(a.right||0,b.right||0), items:Math.max(a.items||0,b.items||0)};
  });
  Object.keys(o.spellHeat||{}).forEach(k=>{
    S.spellHeat[k] = Math.max(S.spellHeat[k]||0, o.spellHeat[k]||0);
  });
  Object.keys(o.settings||{}).forEach(k=>{
    if(S.settings[k] === undefined) S.settings[k] = o.settings[k];
  });
  S.exam = null;
  return {add, merge, mAdd, mMerge, imgs:o.imgs||{}};
}
async function mergeBackupData(o){
  const r = mergeBackupObject(o);
  for(const k of Object.keys(r.imgs)){
    try{ await imgPut(k, r.imgs[k]); }catch(e){}
  }
  save(); closeSheet(); applyTheme(); renderAll();
  return r;
}
async function mergeImport(){
  const raw = ($('#impBox').value||'').trim();
  if(!raw){ toast('没有内容'); return; }
  let o;
  try{ o = JSON.parse(raw); }catch(e){ toast('JSON 格式不对'); return; }
  if(!validBackup(o)){ toast('不是有效的备份，或词条数据异常'); return; }
  const auto = await preRestoreBackup();
  if(!confirm((auto?'已自动备份当前数据。':'未能自动备份当前数据。')+'把备份合并到当前数据？同名词保留进度较新的一方')) return;
  const r = await mergeBackupData(o);
  toast(`合并完成：词 +${r.add} / 合并 ${r.merge}，错题 +${r.mAdd}`);
}
function validBackup(o){
  if(!o || typeof o!=='object' || !Array.isArray(o.items)) return false;
  if(o.items.length > 50000) return false;
  const bad = o.items.filter(x=>!x || typeof x.en!=='string' || !x.en.trim()).length;
  return !bad || bad / o.items.length < 0.2;
}
async function applyBackupObject(o){
  const imgs = o.imgs || {};
  delete o.imgs;
  S = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), o);
  S.exam = null;
  S.items = (S.items||[]).filter(x=>x && typeof x.en==='string' && x.en.trim());
  S.mistakes = (S.mistakes||[]).filter(m=>m && m.id);
  migrateItems(S.items);
  for(const k of Object.keys(imgs)){
    try{ await imgPut(k, imgs[k]); }catch(e){}
  }
  save(); closeSheet(); applyTheme(); renderAll();
}
async function runImport(){

}

    case 'genExamList': {
      const txt = examListText();
      if(!txt){ toast('没有符合条件的错题'); break; }
      window.__examList = txt;
      const out = $('#examListOut');
      if(out) out.innerHTML = `
        <div style="background:var(--bg);border-radius:12px;padding:12px;font-size:13px;line-height:1.9;
          white-space:pre-wrap;margin-top:14px;max-height:38vh;overflow:auto">${esc(txt)}</div>
        <div style="display:flex;gap:10px;margin-top:12px">
          <button class="btn" data-act="copyList">复制</button>
          <button class="btn primary" data-act="saveList">下载 txt</button>
        </div>`;
      break;
    }
    case 'copyList': copyList(); break;
    case 'saveList': download(`温故考前清单-${today()}.txt`, window.__examList || examListText()); break;
    case 'favMistake': toggleFav(t.dataset.id); openMistakeDetail(t.dataset.id); break;
    case 'quitMrev': mrev=null; goHome(); break;
    case 'doneMrev': doneMrev(); break;
    case 'misMore': misPage++; renderMisList(); break;
    case 'misDoneMore': misDoneShown += 50; renderMisList(); break;
    case 'toggleDone': misShowDone = !misShowDone; if(misShowDone) misDoneShown = 50; renderMisList(); break;
    case 'editMistake': openEditMistake(t.dataset.id); break;
    case 'saveMistake': saveMistake(t.dataset.id); break;
    case 'memNow': closeSheet(); startMrev([t.dataset.id]); break;
    case 'pickImg': pickImage(data=>{
      const key = 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      // 先把 base64 放进待保存字段：即使 IDB 还没写完就点保存，图片也不会丢
      if(imgTarget==='add'){
        addImg = data;
        const box = $('#addImgBox');
        if(box) box.innerHTML = `<img src="${data}" style="max-width:100%;max-height:140px;border-radius:10px;margin:8px 0">`;
        const h = $('#addImgHint');
        if(h) h.textContent = '已选 1 张';
        imgPut(key, data).then(()=>{ if(addImg===data) addImg = 'idb:'+key; }).catch(()=>{});
      }else{
        editM.img = data;
        const box = $('#epImgBox');
        if(box) box.innerHTML = `<img src="${data}" style="max-width:100%;max-height:160px;border-radius:10px;margin:8px 0">`;
        imgPut(key, data).then(()=>{ if(editM.img===data) editM.img = 'idb:'+key; }).catch(()=>{});
      }
    }); break;
    case 'clearImg': editM.img=''; { const b=$('#epImgBox'); if(b) b.innerHTML=''; } break;
    case 'delMistake': {
      const id = t.dataset.id;
      if(!confirm('删除这道错题？')) break;
      const gone = S.mistakes.find(m=>m.id===id);
      const gk = gone ? imgKeyOf(gone.img) : '';
      S.mistakes = S.mistakes.filter(m=>m.id!==id);
      save();
      if(gk) imgDel(gk).catch(()=>{});
      closeSheet(); renderAll(); toast('已删除'); break;
    }
    case 'edit': openEdit(t.dataset.id); break;
    case 'saveEdit': saveEdit(t.dataset.id); break;
    case 'showPicks': {
      if(!exam) break;
      const it = byId(exam.ids[exam.ptr]); if(!it) break;
      examAnswer(it).revealed = true;
      renderExam(); break;
    }
    case 'studyReveal': studyReveal(); break;
    case 'undoGrade': undoGrade(); break;
    case 'studyHint': studyHint(); break;
    case 'studyPlay': studyPlay(); break;
    case 'againSession': againSession(); break;
    case 'showAnswer': {
      if(!exam) break;
      const it = byId(exam.ids[exam.ptr]); if(!it) break;
      examAnswer(it).hint = true;
      renderExam(); break;
    }
    case 'clock0': S.clockOffset=0; save(); renderAll(); toast('已恢复真实日期'); break;
    case 'selfcheck': openSelfCheck(); break;
    case 'fixSelfcheck': fixSelfCheck(); break;
    case 'imgGc': {
      if(!confirm('清理没有被任何错题引用的图片？旧备份里引用的图片可能也会失效')) break;
      imgGc();
      break;
    }
    case 'whatsnew': openWhatsNew(); break;
    case 'datasource': openDataSource(); break;
    case 'resumeLearn': resumeLearn(); break;
    case 'moreWords': wordShown += 60; renderWordList(); break;
    case 'quit': learn=null; exam=null; goHome(); break;
    case 'speak': speak(t.dataset.w); break;
    case 'speakS': speak(t.dataset.s); break;
    case 'meetNext': learnNext(); break;
    case 'learnKnown': if(learn) markKnown(learn.ids[learn.idx], true); break;
    case 'markKnown': markKnown(t.dataset.id, false); break;
    case 'batchOn': {
      wordBatch = new Set();
      const b = $('#batchBtn'); if(b) b.style.display = 'none';
      renderWordList();
      break;
    }
    case 'batchOff': wordBatch = null; renderWords(); break;
    case 'batchAll': {
      if(!wordBatch) break;
      const ids = [...document.querySelectorAll('#wordList [data-batch]')].map(e=>e.dataset.batch);
      const allSel = ids.length>0 && ids.every(id=>wordBatch.has(id));
      ids.forEach(id=>{ if(allSel) wordBatch.delete(id); else wordBatch.add(id); });
      renderWordList();
      break;
    }
    case 'batchDo': batchKnown(); break;
    case 'undoKnown': undoKnownAll(); break;
    case 'undoClear': undoKnown = []; renderHome(); break;
    case 'freeze': doFreeze(); break;
    case 'catchupOn': {
      S.meta.catchup = {gap:lastStudyDay(), start:today()};
      S.meta.catchupSnooze = '';
      save(); renderHome();
      toast('已开启返程模式：暂停新词，预算 '+dayBudget());
      break;
    }
    case 'catchupOff': {
      S.meta.catchup = null;
      S.meta.catchupSnooze = lastStudyDay();
      save(); renderHome();
      toast('已退出返程模式');
      break;
    }
    case 'catchupSnooze': {
      S.meta.catchupSnooze = lastStudyDay();
      save(); renderHome();
      break;
    }
    case 'throttleSnooze': {
      S.meta.throttleSnooze = addD(today(), 7);
      S.meta.throttle = null;
      save(); renderHome();
      toast('这 7 天按原计划走，不减新词');
      break;
    }
    case 'monthReview': openMonthReview(); break;
    case 'dropLearn': {
      if(!confirm('放弃这次未完成的学习？')) break;
      learn = null; S.learn = null; save(); renderHome();
      toast('已放弃这次学习'); break;
    }
    case 'reveal': if(learn){ learn.revealed=true; persistLearn(); renderLearn(); } break;
    case 'recallYes': learnNext(); break;
    case 'recallNo': if(learn){ learn.wrong[learn.ids[learn.idx]]=true; persistLearn(); learnNext(); } break;
    case 'pick': pickChoice(t); break;
    case 'prevQ': prevQ(); break;
    case 'nextQ': nextQ(); break;
    case 'grade': gradeExam(); break;
    case 'retryWrong': retryWrong(); break;
    case 'doneExam': doneExam(); break;
    case 'snapshots': openSnapshots(); break;
    case 'restoreSnap': restoreSnap(t.dataset.i); break;
    case 'clock+': S.clockOffset=(S.clockOffset||0)+1; save(); renderAll(); break;
    case 'clock-': S.clockOffset=(S.clockOffset||0)-1; save(); renderAll(); break;
    case 'add': openAdd(); break;
    case 'lookupFill': lookupFill(); break;
    case 'doAdd': doAdd(); break;
    case 'closeSheet': closeSheet(); break;
    case 'export': doExport(); break;
    case 'import': doImport(); break;
    case 'doImport': runImport(); break;
    case 'mergeImport': mergeImport(); break;
    case 'sheet': doSheet(); break;
    case 'wipe': {
      if(!confirm('清空全部数据？建议先导出备份')) break;
      if(!confirm('再次确认：不可恢复')) break;
      S = JSON.parse(JSON.stringify(DEFAULTS)); save(); applyTheme(); renderAll(); toast('已清空'); break;
    }
    case 'fav': {
      const it = byId(t.dataset.id); if(!it) break;
      it.fav=!it.fav; it.updatedAt=Date.now(); save(); openDetail(it.id); break;
    }
    case 'recall': {
      const it = byId(t.dataset.id); if(!it) break;
      it.status='active'; it.stage=0; it.maxStage=0; it.streak=0;
      it.fsrs = {d:fsrsD0(3), s:0.6, reps:1, lapses:0, state:1, last:Date.now(), due:addD(today(),1), ivl:1, lastGrade:3};
      it.nextDate=it.fsrs.due;
      it.updatedAt=Date.now(); save(); openDetail(it.id); toast('已召回，明天进入复习'); break;
    }
    case 'del': {
      const it = byId(t.dataset.id); if(!it) break;
      if(!confirm('删除 '+it.en+'？')) break;
      S.items = S.items.filter(x=>x.id!==it.id); save(); closeSheet(); renderAll(); break;
    }
  }
});

document.addEventListener('change', e=>{
  const tm = e.target.closest('[data-time]');
  if(tm){
    S.settings[tm.dataset.time] = tm.value || '20:00';
    save();
    if(S.settings.reminder) scheduleReminder();
    renderMe();
    return;
  }
  const n = e.target.closest('[data-num]');
  if(!n) return;
  const v = Number(n.value);
  if(!isNaN(v)) S.settings[n.dataset.num] = v;
  save();
});

$('#mask').addEventListener('click', closeSheet);

/* ============================================================
   19. 启动
   ============================================================ */
(async function init(){
  const hb = $('#homeBody');
  if(hb) hb.innerHTML = '<div class="empty">正在加载…</div>';
  // 先读 IndexedDB；首次升级会从 localStorage 迁移，校验通过才继续
  await idbBoot();
  await loadSnaps();
  // 必须等 S 与日期工具都初始化后再迁移（load 阶段不能引用 today/fmt）
  migrateItems(S.items);
  applyTheme();
  loadDict().then(()=>{ if($('#scr-me').classList.contains('on')) renderMe(); });
  loadBooks().then(()=>renderHome());
  loadRoots();
  renderAll();
  showScreen('home');
  save();   // 落盘一次，确保设置迁移/默认值写入
  migrateImgs();
  fetch('version.json').then(r=>r.json()).then(v=>{
    if(v && v.version && String(v.version)!==APP_VERSION){ APP_VERSION = String(v.version); renderMe(); }
  }).catch(()=>{});
  if(S.settings.autoBackup){
    setTimeout(()=>{ writeSnapshot(); capBackup(); }, 1200);
  }
  if(S.settings.reminder) setTimeout(scheduleReminder, 2000);
  if(!S.settings.seen270) setTimeout(openWhatsNew, 900);
})();
</script>
</body>
