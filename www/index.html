function saveEdit(id){
  const it = byId(id);
  if(!it) return;
  const en = ($('#edEn').value||'').trim();
  const zh = ($('#edZh').value||'').trim();
  if(!en || !zh){ toast('英文和释义不能为空'); return; }
  if(S.items.some(x=>x.id!==it.id && normEn(x.en)===normEn(en))){ toast('这个词已经在词库里了'); return; }
  it.en = en;
  it.zh = zh;
  const exEn = ($('#edEx').value||'').trim();
  const exZh = ($('#edExZh').value||'').trim();
  it.ex = exEn ? [exEn, exZh] : null;
  it.tags = ($('#edTags').value||'').split(/\s+/).map(s=>s.replace(/^#/,'')).filter(Boolean);
  it.updatedAt = Date.now();
  save();
  closeSheet();
  renderAll();
  openDetail(it.id);
  toast('已保存');
}

/* ============================================================
   17. 导出导入
   ============================================================ */
function download(name, text, mime){
  try{
    const b = new Blob([text],{type:mime||'application/json;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},100);
  }catch(e){ toast('导出失败'); }
}
function doExport(){
  const out = JSON.parse(JSON.stringify(S)); out.exam=null;
  download(`温故备份-${today()}.json`, JSON.stringify(out,null,2));
  toast('已导出');
}
function doImport(){
  $('#sheetTitle').textContent='导入备份';
  $('#sheetBody').innerHTML=`
    <textarea id="impBox" placeholder="粘贴备份 JSON"></textarea>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn" data-act="closeSheet">取消</button>
      <button class="btn primary" data-act="doImport">覆盖导入</button>
    </div>`;
  openSheet();
}
function runImport(){
  const raw = ($('#impBox').value||'').trim();
  if(!raw){ toast('没有内容'); return; }
  let o;
  try{ o = JSON.parse(raw); }catch(e){ toast('JSON 格式不对'); return; }
  if(!o || !Array.isArray(o.items)){ toast('不是有效的备份'); return; }
  if(!confirm('覆盖当前全部数据？')) return;
  S = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), o);
  S.exam = null;
  save(); closeSheet(); applyTheme(); renderAll();
  toast('导入完成');
}
function doSheet(){
  const list = S.items.filter(i=>i.learned&&i.status==='active');
  if(!list.length){ toast('没有可导出的词'); return; }
  let txt = `默写表 · ${today()}\n\n`;
  list.forEach((it,i)=>{ txt += `${String(i+1).padStart(2,' ')}. ${it.zh}\n     ${'.'.repeat(30)}\n`; });
  download(`默写表-${today()}.txt`, txt, 'text/plain;charset=utf-8');
  toast('已导出');
}

/* ============================================================
   18. 路由与事件
   ============================================================ */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  const el = $('#scr-'+name);
  if(el) el.classList.add('on');
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on', b.dataset.tab===name));
  $('#tabbar').style.display = (name==='learn'||name==='review'||name==='mrev') ? 'none' : 'flex';
  if(name!=='learn'&&name!=='review'&&name!=='mrev'){ $('#tabbar').style.display='flex'; }
}
function goHome(){ showScreen('home'); renderHome(); }

function renderAll(){
  renderHome();
  renderWords();
  renderHard();
  renderMistakes();
  renderMe();
}

function applyTheme(){
  document.body.classList.toggle('dark', S.settings.theme==='dark');
}

function pickChoice(btn){
  if(!learn) return;
  const it = byId(learn.ids[learn.idx]);
  if(!it) return;
  const q = learn.quiz || [];
  const chosen = q[Number(btn.dataset.k)];
  const right = splitSenses(it.zh)[0] || it.zh;
  if(chosen===right){
    btn.classList.add('right');
    setTimeout(learnNext, 240);
  }else{
    btn.classList.add('wrong');
    learn.wrong[it.id] = true;
    const all = document.querySelectorAll('#learnStage .opt');
    const idx = q.indexOf(right);
    if(all[idx]) all[idx].classList.add('right');
    setTimeout(learnNext, 820);
  }
}

document.addEventListener('click', e=>{
  const kb = e.target.closest('[data-kb]');
  if(kb){ kbInput(kb.dataset.kb); return; }

  const pk = e.target.closest('[data-pick]');
  if(pk){ togglePick(Number(pk.dataset.pick)); return; }

  const mf = e.target.closest('[data-misf]');
  if(mf){ misFilter[mf.dataset.misf] = mf.dataset.v; misPage = 1; renderMistakes(); return; }

  const asub = e.target.closest('[data-addsub]');
  if(asub){
    S.settings.lastSubject = asub.dataset.addsub;
    save();
    document.querySelectorAll('#addSubj .chip').forEach(b=>b.classList.toggle('on', b.dataset.addsub===S.settings.lastSubject));
    const bi = $('#addBook');
    if(bi) bi.value = (S.settings.lastBook||{})[S.settings.lastSubject] || '';
    const ti = $('#addTopic');
    if(ti) ti.value = (S.settings.lastTopic||{})[S.settings.lastSubject] || '';
    return;
  }

  const bk = e.target.closest('[data-bookfilter]');
  if(bk){ misFilter.book = bk.dataset.bookfilter || ''; misPage = 1; renderMistakes(); return; }

  const exs = e.target.closest('[data-exs]');
  if(exs){ examSel[exs.dataset.exs] = exs.dataset.v; renderExamSheet(); return; }

  const ep = e.target.closest('[data-ep]');
  if(ep){
    const k = ep.dataset.ep;
    editM[k] = ep.dataset.v;
    document.querySelectorAll('[data-ep="'+k+'"]').forEach(b=>b.classList.toggle('on', b.dataset.v===ep.dataset.v));
    return;
  }

  const fav = e.target.closest('[data-fav]');
  if(fav){ toggleFav(fav.dataset.fav); return; }

  const ff = e.target.closest('[data-favfilter]');
  if(ff){ misFilter.fav = !misFilter.fav; misPage = 1; renderMistakes(); return; }

  const tf = e.target.closest('[data-tagfilter]');
  if(tf){ tagFilter = tf.dataset.tagfilter || ''; renderWords(); return; }

  const md = e.target.closest('[data-misdetail]');
  if(md){ openMistakeDetail(md.dataset.misdetail); return; }

  const fs = e.target.closest('[data-fs]');
  if(fs){
    const k = fs.dataset.fs;
    freeSel[k] = k==='count' ? Number(fs.dataset.v) : fs.dataset.v;
    renderFreeSheet();
    return;
  }

  const t = e.target.closest('[data-act],[data-tab],[data-detail],[data-set],[data-num]');
  if(!t) return;

  if(t.dataset.tab){
    showScreen(t.dataset.tab);
    if(t.dataset.tab==='words') renderWords();
    if(t.dataset.tab==='me') renderMe();
    if(t.dataset.tab==='hard') renderHard();
    if(t.dataset.tab==='mistakes') renderMistakes();
    return;
  }

  if(t.dataset.detail){ openDetail(t.dataset.detail); return; }

  if(t.dataset.set){
    const k = t.dataset.set;
    if(k==='theme'){ S.settings.theme = S.settings.theme==='dark'?'light':'dark'; applyTheme(); }
    if(k==='onlineAudio'){ S.settings.onlineAudio = !S.settings.onlineAudio; }
    if(k==='autoSpeak'){ S.settings.autoSpeak = !S.settings.autoSpeak; if(S.settings.autoSpeak) speak('hello'); }
    if(k==='listenInExam'){ S.settings.listenInExam = !S.settings.listenInExam; }
    if(k==='recallFirst'){ S.settings.recallFirst = !S.settings.recallFirst; }
    if(k==='autoBackup'){
      S.settings.autoBackup = !S.settings.autoBackup;
      if(S.settings.autoBackup){ writeSnapshot(); capBackup(); toast('已开启自动备份'); }
    }
    if(k==='reminder'){ toggleReminder(); return; }
    save(); renderMe(); return;
  }

  const act = t.dataset.act;
  if(!act) return;

  switch(act){
    case 'theme': S.settings.theme = S.settings.theme==='dark'?'light':'dark'; applyTheme(); save(); renderMe(); break;
    case 'startLearn': startLearn(); break;
    case 'startReview': startReview(); break;
    case 'startDrill': startDrill(); break;
    case 'openFree': openFree(); break;
    case 'freeTag': openFree(t.dataset.tag); break;
    case 'startFree': startFree(); break;
    case 'session': setSession(t.dataset.min); break;
    case 'addMistake': openAddMistake(); break;
    case 'doAddMistake': doAddMistake(); break;
    case 'startMrev': startMrev(); break;
    case 'startMrevFiltered': startMrevFiltered(); break;
    case 'misGap': {
      S.settings.misGap = t.dataset.v;
      save(); renderMistakes();
      toast('错题间隔改为 '+mistakeGaps().join(' / ')+' 天');
      break;
    }
    case 'mrevOk': markMrev('ok', t.dataset.id); break;
    case 'mrevBad': markMrev('bad', t.dataset.id); break;
    case 'examList': openExamList(); break;
    case 'genExamList': {
      const txt = examListText();
      if(!txt){ toast('没有符合条件的错题'); break; }
      window.__examList = txt;
      const out = $('#examListOut');
      if(out) out.innerHTML = `
        <div style="background:var(--bg);border-radius:12px;padding:12px;font-size:13px;line-height:1.9;
          white-space:pre-wrap;margin-top:14px;max-height:38vh;overflow:auto">${esc(txt)}</div>
        <div style="display:flex;gap:10px;margin-top:12px">
          <button class="btn" data-act="copyList">复制</button>
          <button class="btn primary" data-act="saveList">下载 txt</button>
        </div>`;
      break;
    }
    case 'copyList': copyList(); break;
    case 'saveList': download(`温故考前清单-${today()}.txt`, window.__examList || examListText()); break;
    case 'favMistake': toggleFav(t.dataset.id); openMistakeDetail(t.dataset.id); break;
    case 'quitMrev': mrev=null; goHome(); break;
    case 'doneMrev': doneMrev(); break;
    case 'misMore': misPage++; renderMisList(); break;
    case 'toggleDone': misShowDone = !misShowDone; renderMisList(); break;
    case 'editMistake': openEditMistake(t.dataset.id); break;
    case 'saveMistake': saveMistake(t.dataset.id); break;
    case 'memNow': closeSheet(); startMrev([t.dataset.id]); break;
    case 'pickImg': pickImage(data=>{
      const used = (S.mistakes||[]).reduce((s,m)=>s+(m.img?m.img.length:0),0);
      if(used + data.length > 1500000){ toast('图片已占满存储（约 1.5MB），可先删除旧图'); return; }
      if(imgTarget==='add'){
        addImg = data;
        const box = $('#addImgBox');
        if(box) box.innerHTML = `<img src="${data}" style="max-width:100%;max-height:140px;border-radius:10px;margin:8px 0">`;
        const h = $('#addImgHint');
        if(h) h.textContent = '已选 1 张';
      }else{
        editM.img = data;
        const box = $('#epImgBox');
        if(box) box.innerHTML = `<img src="${data}" style="max-width:100%;max-height:160px;border-radius:10px;margin:8px 0">`;
      }
    }); break;
    case 'clearImg': editM.img=''; { const b=$('#epImgBox'); if(b) b.innerHTML=''; } break;
    case 'delMistake': {
      const id = t.dataset.id;
      if(!confirm('删除这道错题？')) break;
      S.mistakes = S.mistakes.filter(m=>m.id!==id);
      save(); closeSheet(); renderAll(); toast('已删除'); break;
    }
    case 'edit': openEdit(t.dataset.id); break;
    case 'saveEdit': saveEdit(t.dataset.id); break;
    case 'showPicks': {
      if(!exam) break;
      const it = byId(exam.ids[exam.ptr]); if(!it) break;
      examAnswer(it).revealed = true;
      renderExam(); break;
    }
    case 'quit': learn=null; exam=null; goHome(); break;
    case 'speak': speak(t.dataset.w); break;
    case 'speakS': speak(t.dataset.s); break;
    case 'meetNext': learnNext(); break;
    case 'reveal': if(learn){ learn.revealed=true; renderLearn(); } break;
    case 'recallYes': learnNext(); break;
    case 'recallNo': if(learn){ learn.wrong[learn.ids[learn.idx]]=true; learnNext(); } break;
    case 'pick': pickChoice(t); break;
    case 'prevQ': prevQ(); break;
    case 'nextQ': nextQ(); break;
    case 'grade': gradeExam(); break;
    case 'retryWrong': retryWrong(); break;
    case 'doneExam': doneExam(); break;
    case 'snapshots': openSnapshots(); break;
    case 'restoreSnap': restoreSnap(t.dataset.i); break;
    case 'clock+': S.clockOffset=(S.clockOffset||0)+1; save(); renderAll(); break;
    case 'clock-': S.clockOffset=(S.clockOffset||0)-1; save(); renderAll(); break;
    case 'add': openAdd(); break;
    case 'lookupFill': lookupFill(); break;
    case 'doAdd': doAdd(); break;
    case 'closeSheet': closeSheet(); break;
    case 'export': doExport(); break;
    case 'import': doImport(); break;
    case 'doImport': runImport(); break;
    case 'sheet': doSheet(); break;
    case 'wipe': {
      if(!confirm('清空全部数据？建议先导出备份')) break;
      if(!confirm('再次确认：不可恢复')) break;
      S = JSON.parse(JSON.stringify(DEFAULTS)); save(); applyTheme(); renderAll(); toast('已清空'); break;
    }
    case 'fav': {
      const it = byId(t.dataset.id); if(!it) break;
      it.fav=!it.fav; it.updatedAt=Date.now(); save(); openDetail(it.id); break;
    }
    case 'recall': {
      const it = byId(t.dataset.id); if(!it) break;
      it.status='active'; it.stage=0; it.maxStage=0; it.streak=0; it.nextDate=addD(today(),1);
      it.updatedAt=Date.now(); save(); openDetail(it.id); toast('已召回，明天进入第 1 阶'); break;
    }
    case 'del': {
      const it = byId(t.dataset.id); if(!it) break;
      if(!confirm('删除 '+it.en+'？')) break;
      S.items = S.items.filter(x=>x.id!==it.id); save(); closeSheet(); renderAll(); break;
    }
  }
});

document.addEventListener('change', e=>{
  const tm = e.target.closest('[data-time]');

    S.settings[tm.dataset.time] = tm.value || '20:00';

    if(S.settings.reminder) scheduleReminder();
    renderMe();

  if(!n) return;
  const v = Number(n.value);
  if(!isNaN(v)) S.settings[n.dataset.num] = v;
  save();
});

(function init(){
  applyTheme();
  loadDict();
  renderAll();
  showScreen('home');
  save();   // 落盘一次，确保设置迁移/默认值写入本地
  fetch('version.json').then(r=>r.json()).then(v=>{
    if(v && v.version && String(v.version)!==APP_VERSION){ APP_VERSION = String(v.version); renderMe(); }
  }).catch(()=>{});
  if(S.settings.autoBackup){
    setTimeout(()=>{ writeSnapshot(); capBackup(); }, 1200);
  }
  if(S.settings.reminder) setTimeout(scheduleReminder, 2000);
})();
