<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b6cf6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>生词</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#12151c; --ink2:#5b6472; --ink3:#9aa3b2;
  --line:#e8ebf1; --brand:#2b6cf6; --brand2:#1d55cc; --brandSoft:#eaf0ff;
  --ok:#0f9d58; --okSoft:#e6f6ee; --bad:#e5484d; --badSoft:#fdecec;
  --warn:#c47f0a; --warnSoft:#fdf4e3;
  --r:14px; --r2:20px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.05);
}
body.dark{
  --bg:#0f1116; --card:#181b22; --ink:#e9ecf1; --ink2:#a2abb8; --ink3:#6d7684;
  --line:#262b34; --brand:#5b8cff; --brand2:#7aa3ff; --brandSoft:#1a2440;
  --ok:#3ec27a; --okSoft:#13291e; --bad:#f2737a; --badSoft:#33191b;
  --warn:#e0a33c; --warnSoft:#2c2416;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 88px}
.pad{padding:0 16px}

/* ---------- 顶栏 ---------- */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px 16px 10px;
  padding-top:calc(14px + env(safe-area-inset-top));
}
.topbar h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.2px}
.topbar .sp{flex:1}
.iconbtn{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.iconbtn:active{transform:scale(.95)}

/* ---------- 首页 ---------- */
.hero{
  background:linear-gradient(135deg,var(--brand),#6f5cf5);color:#fff;border-radius:var(--r2);
  padding:22px 20px;margin:6px 0 14px;box-shadow:0 10px 24px rgba(43,108,246,.28);
}
.hero .d{font-size:12.5px;opacity:.85}
.hero .big{font-size:44px;font-weight:750;line-height:1.15;margin-top:6px;letter-spacing:-1px}
.hero .sub{font-size:13px;opacity:.9;margin-top:2px}
.hero .row{display:flex;gap:10px;margin-top:16px}
.hero button{flex:1;height:44px;border-radius:12px;background:#fff;color:var(--brand);
  font-weight:650;font-size:15px}
.hero button.ghost{background:rgba(255,255,255,.18);color:#fff;flex:0 0 42%}
.hero button:active{transform:scale(.98)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.mini .n{font-size:24px;font-weight:750;line-height:1.1}
.mini .k{font-size:12px;color:var(--ink3);margin-top:3px}
.sect{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.sect h3{font-size:14px;font-weight:650;margin:0;color:var(--ink2)}
.sect button{font-size:12.5px;color:var(--brand)}

/* ---------- 列表 ---------- */
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;box-shadow:var(--shadow)}
.item .m{flex:1;min-width:0}
.item .en{font-weight:650;font-size:15.5px;word-break:break-word}
.item .zh{font-size:12.5px;color:var(--ink2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mt{font-size:11px;color:var(--ink3);margin-top:3px}
.tag{display:inline-block;font-size:10.5px;color:var(--brand);background:var(--brandSoft);
  padding:1px 6px;border-radius:999px;margin-right:4px}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--warnSoft);color:var(--warn)}
.pill.ok{background:var(--okSoft);color:var(--ok)}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:48px 20px}
.empty b{display:block;font-size:15px;color:var(--ink2);margin-bottom:6px}

/* ---------- 学习 / 复习 卡 ---------- */
.stage{flex:1;display:flex;flex-direction:column;padding:0 16px}
.pbar{height:4px;background:var(--line);border-radius:999px;overflow:hidden;margin:4px 0 18px}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .3s}
.bigcard{flex:1;background:var(--card);border-radius:24px;border:1px solid var(--line);
  box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;
  align-items:center;padding:28px 22px;min-height:0;position:relative}
.bigcard.learning{justify-content:flex-start;align-items:stretch}
.word{font-size:40px;font-weight:750;letter-spacing:-.5px;text-align:center;word-break:break-word;line-height:1.2}
.word.small{font-size:28px}
.phon{color:var(--ink3);font-size:14px;margin-top:8px;text-align:center}
.speakbtn{width:44px;height:44px;border-radius:50%;background:var(--brandSoft);color:var(--brand);
  display:flex;align-items:center;justify-content:center;margin:14px auto 0}
.speakbtn:active{transform:scale(.92)}
.senses{margin-top:22px;width:100%}
.sense{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.sense:last-child{border-bottom:none}
.sense .no{color:var(--ink3);font-size:12.5px;padding-top:3px;min-width:14px}
.hintline{text-align:center;color:var(--ink3);font-size:13px;margin-top:18px}
.actions{flex:0 0 auto;display:flex;gap:10px;padding:14px 0 calc(16px + env(safe-area-inset-bottom))}
.btn{flex:1;height:50px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  font-weight:650;font-size:15.5px;color:var(--ink);display:flex;align-items:center;justify-content:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff;border-color:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.bad{background:var(--badSoft);color:var(--bad);border-color:transparent}
.btn:disabled{opacity:.45}

/* 选择题 */
.opt{width:100%;text-align:left;padding:15px 16px;border-radius:14px;background:var(--card);
  border:1.5px solid var(--line);margin-bottom:10px;font-size:15.5px;transition:all .15s}
.opt:active{transform:scale(.99)}
.opt.right{border-color:var(--ok);background:var(--okSoft);color:var(--ok);font-weight:650}
.opt.wrong{border-color:var(--bad);background:var(--badSoft);color:var(--bad)}

/* 默写输入 */
.answerbox{width:100%;margin-top:20px}
.answerbox input{width:100%;height:56px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card);padding:0 16px;font-size:18px;outline:none;text-align:center;letter-spacing:.3px}
.answerbox input:focus{border-color:var(--brand)}
.result{margin-top:16px;font-size:14px;text-align:center}
.result .r{font-size:17px;font-weight:700}
.result .r.ok{color:var(--ok)}
.result .r.bad{color:var(--bad)}
.result .fix{margin-top:6px;color:var(--ink2)}
.result .fix b{color:var(--bad);font-size:17px}
.result .miss{color:var(--warn);font-size:12.5px;margin-top:5px}

/* ---------- 底部导航 ---------- */
#tabbar{
  position:absolute;left:0;right:0;bottom:0;display:flex;z-index:20;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
body.dark #tabbar{background:rgba(24,27,34,.94)}
#tabbar button{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;color:var(--ink3);font-size:10.5px}
#tabbar button.on{color:var(--brand)}
#tabbar svg{width:22px;height:22px}

/* ---------- 弹层 ---------- */
#mask{position:fixed;inset:0;background:rgba(10,14,20,.4);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:40}
#mask.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;
  z-index:50;transform:translateY(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);
  max-height:88vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#sheet.on{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.sheet-head h3{margin:0;font-size:16px;font-weight:700}
.sheet-body{overflow-y:auto;padding:0 18px 18px}
.sheet-body textarea{width:100%;min-height:150px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--bg);padding:12px;font-size:14.5px;line-height:1.6;outline:none;resize:vertical}
.sheet-body textarea:focus{border-color:var(--brand)}
.tip{font-size:12.5px;color:var(--ink3);margin:8px 0 0;line-height:1.6}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .l{font-size:14.5px}
.row .s{font-size:12px;color:var(--ink3);margin-top:2px}
.switch{width:46px;height:27px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:0 0 auto}
.switch i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--brand)}
.switch.on i{left:22px}
.num-in{width:70px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);
  text-align:center;outline:none;font-size:14px}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,10px);background:rgba(20,24,32,.92);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;
  transition:.2s;z-index:90;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 空状态的大加号 */
.fab{position:absolute;right:16px;bottom:76px;width:54px;height:54px;border-radius:50%;
  background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(43,108,246,.4);z-index:15}
.fab:active{transform:scale(.94)}
#addMask{position:fixed;inset:0;background:rgba(10,14,20,.4);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:40}
#addMask.on{opacity:1;pointer-events:auto}

/* ---------- 例句 ---------- */
.exbox{margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);width:100%}
.ex-en{font-size:14px;line-height:1.55;color:var(--ink)}
.ex-zh{font-size:12.5px;color:var(--ink3);margin-top:4px}
.ex-spk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
  background:var(--brandSoft);color:var(--brand);margin-left:6px;vertical-align:middle}

/* ---------- 默写键盘 ---------- */
.kbdpan{flex:0 0 auto;padding:6px 0 calc(6px + env(safe-area-inset-bottom));user-select:none}
.kb-row{display:flex;gap:5px;justify-content:center;margin-bottom:6px}
.kb-key{flex:1;height:42px;border-radius:9px;background:var(--card);border:1px solid var(--line);
  font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 0 rgba(16,24,40,.05)}
.kb-key:active{background:var(--brandSoft);color:var(--brand);transform:translateY(1px)}
.kb-key.fn{flex:1.7;font-size:13px;color:var(--ink2);background:var(--line);border-color:transparent}
.kb-key.go{flex:2;background:var(--brand);color:#fff;border-color:transparent;font-size:14px}
.typebox{width:100%;min-height:58px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 14px;margin-top:18px;
  font-size:21px;font-weight:650;letter-spacing:.5px;word-break:break-word;text-align:center}
.typebox .ph{color:var(--ink3);font-weight:400;font-size:14px;letter-spacing:0}
.typebox .caret{display:inline-block;width:2px;height:20px;background:var(--brand);margin-left:2px;
  animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.zhprompt{font-size:21px;font-weight:650;text-align:center;margin-top:14px;line-height:1.45}
.reveal-word{margin-top:14px;text-align:center;font-size:13px;color:var(--warn)}
.reveal-word b{font-size:19px;letter-spacing:.5px}
.bigcard.kbd{justify-content:flex-start;align-items:stretch;overflow-y:auto;padding:18px 16px}

/* ---------- 释义多选 ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;width:100%}
.chip{padding:11px 13px;border-radius:11px;background:var(--card);border:1.5px solid var(--line);
  font-size:14px;line-height:1.35;text-align:left}
.chip.on{border-color:var(--brand);background:var(--brandSoft);color:var(--brand);font-weight:650}
.examtip{text-align:center;font-size:12px;color:var(--ink3);margin:-6px 0 10px}

/* ---------- 结果 ---------- */
.rlist{width:100%;margin-top:14px}
.ritem{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ritem:last-child{border-bottom:none}
.rstat{font-weight:750;width:16px;flex:0 0 auto}

/* ---------- 正确率柱状 ---------- */
.bars{display:flex;align-items:flex-end;gap:3px;height:64px;margin:4px 0 16px}
.bars i{flex:1;height:100%;background:var(--line);border-radius:3px;display:flex;align-items:flex-end}
.bars i b{display:block;width:100%;background:var(--brand);border-radius:3px}
</style>
</head>
<body>

<div id="app">
  <!-- 首页 -->
  <section class="screen on" id="scr-home">
    <div class="topbar">
      <h1>我的生词</h1><div class="sp"></div>
      <button class="iconbtn" data-act="theme" aria-label="夜间模式">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/>
        </svg>
      </button>
    </div>
    <div class="scroll" id="homeBody"></div>
  </section>

  <!-- 学习 -->
  <section class="screen" id="scr-learn">
    <div class="topbar">
      <button class="iconbtn" data-act="quit" aria-label="退出">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M15 5 8 12l7 7"/>
        </svg>
      </button>
      <h1 style="font-size:16px" id="learnTitle">学习新词</h1>
      <div class="sp"></div>
      <span style="font-size:12.5px;color:var(--ink3)" id="learnCount"></span>
    </div>
    <div class="stage" id="learnStage"></div>
  </section>

  <!-- 复习 -->
  <section class="screen" id="scr-review">
    <div class="topbar">
      <button class="iconbtn" data-act="quit" aria-label="退出">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M15 5 8 12l7 7"/>
        </svg>
      </button>
      <h1 style="font-size:16px" id="reviewTitle">默写复习</h1>
      <div class="sp"></div>
      <span style="font-size:12.5px;color:var(--ink3)" id="reviewCount"></span>
    </div>
    <div class="stage" id="reviewStage"></div>
  </section>

  <!-- 词库 -->
  <section class="screen" id="scr-words">
    <div class="topbar">
      <h1>词库</h1><div class="sp"></div>
      <span style="font-size:12.5px;color:var(--ink3)" id="wordsCount"></span>
    </div>
    <div class="scroll" id="wordsBody"></div>
    <button class="fab" data-act="add" aria-label="添加">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
  </section>

  <!-- 我的 -->
  <section class="screen" id="scr-me">
    <div class="topbar"><h1>我的</h1></div>
    <div class="scroll" id="meBody"></div>
  </section>

  <!-- 难词本 -->
  <section class="screen" id="scr-hard">
    <div class="topbar"><h1>难词本</h1><div class="sp"></div>
      <span style="font-size:12.5px;color:var(--ink3)" id="hardCount"></span>
    </div>
    <div class="scroll" id="hardBody"></div>
  </section>

  <nav id="tabbar">
    <button class="on" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>
      <span>首页</span>
    </button>
    <button data-tab="words">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
      <span>词库</span>
    </button>
    <button data-tab="hard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 14.9 9.4l6.1.9-4.4 4.3 1 6.1-5.6-3-5.6 3 1-6.1L3 10.3l6.1-.9z"/></svg>
      <span>难词</span>
    </button>
    <button data-tab="me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.2-3.6 4-5.4 7.5-5.4s6.3 1.8 7.5 5.4"/></svg>
      <span>我的</span>
    </button>
  </nav>
</div>

<div id="addMask"></div>
<div id="mask"></div>
<div id="sheet">
  <div class="sheet-head"><h3 id="sheetTitle">添加生词</h3>
    <button class="iconbtn" data-act="closeSheet">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div id="toast"></div>

<script>
/* ============================================================
   0. 常量
   ============================================================ */
const KEY = 'wordapp_v1';
const GAPS = [1,1,2,3,4,4,6,9,15,15];
const TOTAL_STAGE = 10;
const MAX_FILL_SENSES = 2;      // 词典自动补全最多取几条释义

const DEFAULTS = {
  v: 1,
  settings: {
    theme:'light', onlineAudio:false, autoSpeak:true, autoBackup:true,
    reminder:false, remindTime:'20:00',
    newPerDay:30, paperCap:40, answerCap:60
  },
  clockOffset: 0,
  items: [],
  days: {},
  meta: { deferStreak:0, deferDate:'' },
  exam: null
};

/* ============================================================
   1. 存储
   ============================================================ */
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULTS));
    const d = JSON.parse(raw);
    const base = JSON.parse(JSON.stringify(DEFAULTS));
    d.settings = Object.assign(base.settings, d.settings||{});
    d.meta = Object.assign(base.meta, d.meta||{});
    d.items = Array.isArray(d.items)? d.items : [];
    d.days = d.days || {};
    return d;
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULTS)); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('存储空间不足，请先导出备份'); }
  scheduleBackup();
}

/* ---- 自动备份：本地快照（最近 3 份） + 手机文档目录（每天 1 份） ---- */
const SNAP_KEY = 'wordapp_snap_v1';
let bkTimer = null, capBackupDay = '';
function scheduleBackup(){
  if(!S.settings || !S.settings.autoBackup) return;
  clearTimeout(bkTimer);
  bkTimer = setTimeout(()=>{ writeSnapshot(); capBackup(); }, 2500);
}
function snapshots(){
  try{ return JSON.parse(localStorage.getItem(SNAP_KEY) || '[]'); }catch(e){ return []; }
}
function backupPayload(){
  return JSON.stringify({
    v:1, saved:today(), items:S.items, days:S.days, settings:S.settings,
    clockOffset:S.clockOffset, meta:S.meta
  });

const p2 = n => (n<10?'0':'')+n;
const fmt = d => d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
function parseD(s){ const a=String(s).split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function today(){
  const d = new Date();
  if(S.clockOffset) d.setDate(d.getDate()+Number(S.clockOffset));
  return fmt(new Date(d.getFullYear(),d.getMonth(),d.getDate()));
}
function addD(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return fmt(d); }
function diffD(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }

   ============================================================ */
function splitSenses(zh){
  return String(zh==null?'':zh).split(/[；;\/|\n]+/).map(s=>s.trim()).filter(Boolean);
}
function normEn(s){
  return String(s==null?'':s)
    .replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/\u3000/g,' ').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"')
    .replace(/\s+/g,' ').trim().toLowerCase()
    .replace(/[\s.,;:!?"']+$/,'').trim();
}
function normZh(s){
  return String(s==null?'':s)
    .replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[（(][^）)]*[）)]/g,'')
    .replace(/[\s，,。.、；;：:！!？?"'“”‘’·…\-—_\/\\]+/g,'')
    .trim().toLowerCase();
}
function judgeEn(raw, item){
  const a=normEn(raw), b=normEn(item.en);
  if(!a) return {r:'empty'};
  if(a===b) return {r:'right'};
  return {r:'wrong'};
}

/* ============================================================
   8. 组卷
   ============================================================ */
function buildPaper(){
  const t = today();
  const cands = dueItems();
  if(!cands.length) return {ids:[],deferred:0,total:0};
  const scored = cands.map(it=>{
    const od = Math.max(0, diffD(it.nextDate,t));
    const age = Math.max(0, diffD(it.created,t));
    let sc = it.errCount*1000 + od*10 + it.stage - age*0.001;
    if(od>7) sc += 1e6;
    return {it, od, sc};
  });
  const forced = scored.filter(x=>x.od>7).sort((a,b)=>b.sc-a.sc);
  const other  = scored.filter(x=>x.od>0&&x.od<=7).sort((a,b)=>b.sc-a.sc);
  const normal = scored.filter(x=>x.od===0).sort((a,b)=>b.sc-a.sc);
  const CAP = Math.max(5, Number(S.settings.paperCap)||40);
  const picked=[], used=new Set();
  const take=(arr,n)=>{ for(const x of arr){ if(n<=0||picked.length>=CAP) break;
    if(used.has(x.it.id)) continue; used.add(x.it.id); picked.push(x.it); n--; } };
  take(forced, Math.min(20,CAP));
  take(other, Math.max(0,10-picked.length));
  take(other, CAP-picked.length);
  take(normal, CAP-picked.length);
  return {ids:picked.map(i=>i.id), deferred:cands.length-picked.length, total:cands.length};
}

function makeChoices(it){
  const right = splitSenses(it.zh)[0] || it.zh;
  const used = new Set([normZh(right)]);
  const picks = [];
  const pool = [];
  S.items.forEach(x=>{
    if(x.id===it.id) return;
    splitSenses(x.zh).forEach(s=>pool.push(s));
  });
  shuffle(pool);
  for(const p of pool){
    if(picks.length>=2) break;
    const n = normZh(p);
    if(!n || used.has(n)) continue;
    used.add(n); picks.push(p);
  }
  if(picks.length<2 && DICT){
    const keys = Object.keys(DICT);
    for(let i=0;i<200 && picks.length<2;i++){
      const s = dictSensesOf(keys[Math.floor(Math.random()*keys.length)])[0];
      if(!s || s.length>16) continue;
      const n = normZh(s);
      if(!n || used.has(n)) continue;
      used.add(n); picks.push(s);
    }
  }
  while(picks.length<2) picks.push('……');
  return shuffle([right, ...picks].slice(0,3));
}

function learnNext(){
  if(!learn) return;
  const it = byId(learn.ids[learn.idx]);
  const pi = LEARN_PHASES.indexOf(learn.phase);
  learn.revealed = false;
  learn.quiz = null;
  learn.text = '';
  if(pi < LEARN_PHASES.length-1){
    learn.phase = LEARN_PHASES[pi+1];
  }else{
    if(learn.copy && it) it.errCount = (it.errCount||0)+1;
    learn.copy = false;
    learn.idx++;
    learn.phase = 'meet';
  }
  renderLearn();
}

function spellCheck(){
  if(!learn) return;
  const it = byId(learn.ids[learn.idx]);
  if(!it) return;
  if(!String(learn.text||'').trim()){ toast('先用键盘拼出单词'); return; }
  if(normEn(learn.text) === normEn(it.en)){
    learn.text = '';
    learn.copy = false;
    learnNext();
    return;
  }
  learn.tries[it.id] = (learn.tries[it.id]||0) + 1;
  learn.text = '';
  if(learn.tries[it.id] >= 3){
    learn.copy = true;
    renderLearn();
    toast('连错 3 次，照着正确拼写再打一遍');
  }else{
    renderLearn();
    toast(learn.copy ? '再仔细看一遍正确拼写' : '不对哦，还有 '+(3-learn.tries[it.id])+' 次机会');
  }
}

/* ============================================================
   11. 复习考试（批量作答，交卷统一批改）
   ============================================================ */
let exam = null;

function examAnswer(it){
  if(!exam.ans) exam.ans = {};
  let a = exam.ans[it.id];
  if(!a){
    const idx = Math.max(0, exam.ids.indexOf(it.id));
    a = exam.ans[it.id] = {dir: idx % 2 === 0 ? 'zh2en' : 'en2zh', text:'', picks:[]};
  }
  if(!Array.isArray(a.picks)) a.picks = [];
  if(a.dir==='en2zh' && !a.cands) a.cands = zhCands(it);
  return a;
}

function zhCands(it){
  const right = splitSenses(it.zh);
  const used = new Set(right.map(normZh));
  const picks = [];
  const pool = [];
  S.items.forEach(x=>{
    if(x.id===it.id) return;
    splitSenses(x.zh).forEach(s=>pool.push(s));
  });
  shuffle(pool);
  for(const p of pool){
    if(picks.length>=3) break;
    const n = normZh(p);
    if(!n || used.has(n)) continue;
    used.add(n); picks.push(p);
  }
  if(picks.length<3 && DICT){
    const keys = Object.keys(DICT);
    for(let i=0;i<300 && picks.length<3;i++){
      const s = dictSensesOf(keys[Math.floor(Math.random()*keys.length)])[0];
      if(!s || s.length>16) continue;
      const n = normZh(s);
      if(!n || used.has(n)) continue;
      used.add(n); picks.push(s);
    }
  }
  return shuffle(right.concat(picks));
}

function judgePicks(picks, it){
  const wantRaw = splitSenses(it.zh);
  const want = wantRaw.map(normZh);
  const got = (picks||[]).map(normZh).filter(Boolean);
  if(!got.length) return {r:'empty'};
  const missIdx = [];
  want.forEach((w,i)=>{ if(got.indexOf(w)<0) missIdx.push(i); });
  const extra = got.filter(g=>want.indexOf(g)<0);
  if(!missIdx.length && !extra.length) return {r:'right'};
  return {r:'wrong', missing:missIdx.map(i=>wantRaw[i]), extra};
}

      <div class="zhprompt">${splitSenses(it.zh).map(esc).join('；')}</div>
      <div class="typebox" id="typeBox"></div>
    </div>
    ${keyboardHTML(exam.ptr+1>=total ? '交卷' : '下一题')}`;
  }else{
    card = `<div class="bigcard learning">
      <div style="text-align:center">
        <div class="word small">${esc(it.en)}</div>
        ${phonOf(it.en)?`<div class="phon">/${esc(phonOf(it.en))}/</div>`:''}
        <button class="speakbtn" data-act="speak" data-w="${esc(it.en)}">${IC_SPK}</button>
      </div>
      <div class="hintline" style="margin-top:12px">选出全部正确的中文释义${splitSenses(it.zh).length>1?'（共 '+splitSenses(it.zh).length+' 个）':''}</div>
      <div class="chips">${(a.cands||[]).map((c,k)=>
        `<button class="chip ${a.picks.indexOf(c)>=0?'on':''}" data-pick="${k}">${esc(c)}</button>`).join('')}</div>
    </div>`;
  }

  box.innerHTML = `<div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="examtip">已作答 ${doneN} / ${total}</div>
    ${card}
    <div class="actions" style="padding-bottom:calc(12px + env(safe-area-inset-bottom))">
      <button class="btn" data-act="prevQ" ${exam.ptr===0?'disabled':''} style="flex:0 0 32%">上一题</button>
      ${exam.ptr+1>=total
        ? `<button class="btn ok" data-act="grade">交卷</button>`
        : `<button class="btn primary" data-act="nextQ">下一题</button>`}
    </div>`;

  if(dir==='zh2en') paintTyped($('#typeBox'), a.text, '用下面的键盘输入');
  if(dir==='en2zh' && S.settings.autoSpeak && exam.spokenFor !== it.id){
    exam.spokenFor = it.id;
    setTimeout(()=>speak(it.en), 260);
  }
}

function togglePick(k){
  if(!exam) return;
  const it = byId(exam.ids[exam.ptr]);
  if(!it) return;
  const a = examAnswer(it);
  const c = (a.cands||[])[k];
  if(c==null) return;
  const i = a.picks.indexOf(c);
  if(i>=0) a.picks.splice(i,1); else a.picks.push(c);
  if(exam.mode==='exam') S.exam = exam;
  save();
  renderExam();
}

function prevQ(){
  if(!exam || exam.ptr<=0) return;
  exam.ptr--;
  if(exam.mode==='exam') S.exam = exam;
  save();
  renderExam();
}
function nextQ(){
  if(!exam) return;
  if(exam.ptr+1 >= exam.ids.length){ gradeExam(); return; }
  exam.ptr++;
  if(exam.mode==='exam') S.exam = exam;
  save();
  renderExam();
}

function applyReview(it,res){
  const t = today();
  if(res.r==='right'){
    it.streak++;
    it.officialTestCount++;
    it.officialRightCount++;
    it.stage = Math.min(it.stage+1, TOTAL_STAGE);
    if(it.streak>=2 && it.stage<it.maxStage) it.stage = it.maxStage;
    it.maxStage = Math.max(it.maxStage, it.stage);
    if(it.stage>=TOTAL_STAGE && it.officialRightCount>=8 && it.streak>=2){
      it.status='graduated'; it.nextDate='';
    }else{
      it.nextDate = addD(t, GAPS[Math.min(it.stage,GAPS.length-1)]);
    }
  }else if(res.r!=='empty'){
    it.errCount++; it.streak=0; it.stage=0;
    it.officialTestCount++;
    it.nextDate = addD(t,1);
  }
}

function gradeExam(){
  if(!exam) return;
  const blank = exam.ids.filter(id=>{
    const a = exam.ans[id];
    if(!a) return true;
    return a.dir==='en2zh' ? !(a.picks||[]).length : !String(a.text||'').trim();
  });
  if(blank.length && !confirm('还有 '+blank.length+' 题没作答，确定交卷？')) return;

  const rows = [];
  let right = 0;
  exam.ids.forEach(id=>{
    const it = byId(id);
    if(!it) return;
    const a = exam.ans[id] || {dir: (exam.ids.indexOf(id)%2 ? 'en2zh':'zh2en'), text:'', picks:[]};
    const res = a.dir==='en2zh' ? judgePicks(a.picks, it) : judgeEn(a.text, it);
    if(res.r==='right') right++;

    if(exam.mode==='drill'){
      it.drillCount = (it.drillCount||0)+1;
      if(res.r==='right') it.drillRight = (it.drillRight||0)+1;
    }else{
      applyReview(it, res);
    }
    it.totalAnswerCount = (it.totalAnswerCount||0)+1;
    pushHist(it, {d:today(), s:it.stage, r:res.r, mode:exam.mode, dir:a.dir,
      a:String(a.text || (a.picks||[]).join('、') || '').slice(0,40)});
    it.updatedAt = Date.now();

    rows.push({id, dir:a.dir, r:res.r, text:a.text||'', picks:a.picks||[], missing:res.missing||[]});
  });

  exam.total = rows.length;
  exam.right = right;
  exam.results = rows;
  exam.done = true;

  if(exam.mode==='exam'){
    const t = exam.date || today();
    const prev = S.days[t] || {};
    S.days[t] = {
      ans: (prev.ans||0) + rows.length,
      right: (prev.right||0) + right,
      items: Math.max(prev.items||0, new Set(exam.ids).size)
    };
  }
  S.exam = null;
  save();
  renderResults();
}

function renderResults(){
  const rows = (exam && exam.results) || [];
  const total = rows.length;
  const right = rows.filter(r=>r.r==='right').length;
  const acc = total ? Math.round(right/total*100) : 100;
  const wrong = rows.filter(r=>r.r!=='right');
  const color = acc>=80 ? 'var(--ok)' : acc>=60 ? 'var(--brand)' : 'var(--bad)';
  $('#reviewTitle').textContent = '交卷结果';
  $('#reviewCount').textContent = right+' / '+total;

  const list = rows.map(r=>{
    const it = byId(r.id);
    if(!it) return '';
    const ok = r.r==='right';
    let detail = '';
    if(!ok){
      if(r.dir==='zh2en'){
        detail = `<div style="color:var(--bad);font-size:12.5px;margin-top:2px">你的答案：${r.text?esc(r.text):'（空）'}　正确：<b>${esc(it.en)}</b></div>`;
      }else{
        detail = `<div style="color:var(--bad);font-size:12.5px;margin-top:2px">${r.r==='empty'?'未作答':'漏选：'+r.missing.map(esc).join('、')}　正确：${esc(it.zh)}</div>`;
      }
    }
    return `<div class="ritem">
      <span class="rstat" style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?'✓':'✗'}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:650">${esc(it.en)} <span style="font-size:12px;font-weight:400;color:var(--ink3)">${esc(it.zh)}</span></div>
        ${detail}
      </div></div>`;
  }).join('');

  $('#reviewStage').innerHTML = `
    <div class="pbar"><i style="width:100%"></i></div>
    <div style="flex:1;overflow-y:auto;min-height:0">
      <div style="text-align:center;padding:14px 0 6px">
        <div style="font-size:46px;font-weight:750;color:${color};letter-spacing:-1px">${acc}%</div>
        <div class="phon" style="margin-top:0">正确率　${right} / ${total}</div>
      </div>
      ${wrong.length
        ? `<div class="examtip" style="color:var(--warn);margin-top:8px">有 ${wrong.length} 个词没过，明天还会出现</div>`
        : `<div class="examtip" style="color:var(--ok);margin-top:8px">全部正确，继续保持</div>`}
      <div class="rlist">${list}</div>
    </div>
    <div class="actions" style="padding-bottom:calc(12px + env(safe-area-inset-bottom))">
      ${wrong.length && exam.mode!=='retry'
        ? `<button class="btn" data-act="retryWrong" style="flex:0 0 44%">重做错题 ${wrong.length}</button>` : ''}
      <button class="btn primary" data-act="doneExam">完成</button>
    </div>`;
}

function retryWrong(){
  if(!exam) return;
  const ids = (exam.results||[]).filter(r=>r.r!=='right').map(r=>r.id);
  if(!ids.length){ toast('没有错题'); return; }
  exam = {mode:'retry', ids, ans:{}, ptr:0, date:today(), done:false, deferred:0, total:0, right:0, results:null};
  renderExam();
}

function doneExam(){
  exam = null;
  S.exam = null;
  save();
  goHome();
}

    <div style="text-align:center;color:var(--ink3);font-size:11.5px;padding:10px 0 20px">

}

function openSnapshots(){
  const list = snapshots();
  $('#sheetTitle').textContent = '恢复快照';
  if(!list.length){
    $('#sheetBody').innerHTML = `<div class="empty">还没有本地快照，开启自动备份后会每天生成</div>`;
    openSheet();
    return;
  }
  $('#sheetBody').innerHTML = list.map((s,i)=>`
    <div class="row">
      <div><div class="l">${s.d}</div><div class="s">${s.n} 个词 · ${new Date(s.ts).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}</div></div>
      <button class="btn" style="height:34px;flex:0 0 auto;padding:0 16px;font-size:13px" data-act="restoreSnap" data-i="${i}">恢复</button>
    </div>`).join('') + `<p class="tip" style="margin-top:12px">快照只保存在本机，换机请用「导出备份」。</p>`;
  openSheet();
}
function restoreSnap(i){
  const s = snapshots()[Number(i)];
  if(!s) return;
  if(!confirm('用 '+s.d+' 的快照覆盖当前数据？当前进度会丢失')) return;
  try{
    const o = JSON.parse(s.data);
    S.items = Array.isArray(o.items) ? o.items : [];
    S.days = o.days || {};
    S.settings = Object.assign(S.settings, o.settings || {});
    S.clockOffset = o.clockOffset || 0;
    S.meta = Object.assign(S.meta, o.meta || {});
    S.exam = null;
    save(); applyTheme(); closeSheet(); renderAll();
    toast('已恢复到 '+s.d);
  }catch(e){ toast('快照已损坏'); }
}

async function toggleReminder(){
  if(!S.settings.reminder){
    S.settings.reminder = true;
    save();
    const ok = await scheduleReminder();
    if(!ok) toast('网页版不支持本地通知，装机后可用');
  }else{
    S.settings.reminder = false;
    save();
    const LN = capPlugin('LocalNotifications');
    if(LN){ try{ await LN.cancel({notifications:[{id:1}]}); }catch(e){} }
    toast('已关闭提醒');
  }
  renderMe();
}
async function scheduleReminder(){
  const LN = capPlugin('LocalNotifications');
  if(!LN) return false;
  try{
    let p = await LN.checkPermissions();
    if(!p || p.display!=='granted') p = await LN.requestPermissions();
    if(!p || p.display!=='granted'){ S.settings.reminder=false; save(); toast('没有通知权限'); return false; }
    const hm = String(S.settings.remindTime||'20:00').split(':').map(Number);
    try{ await LN.cancel({notifications:[{id:1}]}); }catch(e){}
    await LN.schedule({notifications:[{
      id:1, title:'生词', body:'今天的单词还没背完，来复习一下吧',
      schedule:{on:{hour:hm[0]||20, minute:hm[1]||0}, repeats:true, allowWhileIdle:true}
    }]});
    return true;
  }catch(e){ return false; }
}

function streak(){
  let t = today();
  if(!S.days[t]) t = addD(t,-1);
  let n = 0;
  while(S.days[t]){ n++; t = addD(t,-1); }
  return n;
}

/* ============================================================
   15. 添加生词
   ============================================================ */
function openAdd(){
  $('#sheetTitle').textContent = '添加生词';
  $('#sheetBody').innerHTML = `
    <textarea id="addBox" placeholder="每行一个，格式：英文 中文&#10;&#10;apple&#10;apple 苹果&#10;book 书；预订&#10;look after 照顾 #短语"></textarea>
    <p class="tip">· 只写英文时，会自动从词典带出中文释义<br>
      · 一个词有多个释义时用「；」分隔，词典认为有多个释义的词必须写全<br>
      · 末尾可加 #标签</p>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn" data-act="lookupFill" style="flex:0 0 40%">查词典</button>
      <button class="btn primary" data-act="doAdd">添加</button>
    </div>`;
  openSheet();
  setTimeout(()=>{ const b=$('#addBox'); if(b) b.focus(); },200);
}

async function doAdd(){
  const box = $('#addBox');
  const raw = (box.value||'').trim();
  if(!raw){ toast('先输入内容'); return; }
  await loadDict();

  const lines = raw.split(/\r?\n/).filter(l=>l.trim());
  const ok=[], blocked=[], dup=[], bad=[];
  const usedToday = S.items.filter(i=>i.created===today()).length;
  let quota = Math.max(0,(Number(S.settings.newPerDay)||30)-usedToday);

  for(const line of lines){
    const p = parseLine(line);
    if(!p){ bad.push(line.trim()); continue; }
    if(S.items.some(i=>normEn(i.en)===normEn(p.en))){ dup.push(p.en); continue; }

    let zh = p.zh;
    const ds = dictSensesOf(p.en);
    if(!zh && ds.length){ zh = ds.slice(0,MAX_FILL_SENSES).join('；'); }
    if(ds.length>=2 && splitSenses(zh).length < 2){
      blocked.push({en:p.en, tags:p.tags, dict:ds});
      continue;
    }
    if(!zh && !ds.length){ bad.push(p.en); continue; }
    if(quota<=0){ bad.push(p.en+'（超出今日上限）'); continue; }
    quota--;
    ok.push({en:p.en, zh, tags:p.tags});
  }

  ok.forEach(p=>{
    const it = makeItem(p.en,p.zh,p.tags);
    S.items.push(it);
  });
  save();

  let msg = `已添加 ${ok.length} 个`;
  if(dup.length) msg += `，跳过重复 ${dup.length} 个`;
  if(bad.length) msg += `，无法识别 ${bad.length} 行`;
  toast(msg);

  if(blocked.length){
    const b = blocked[0];
    $('#sheetTitle').textContent = '释义没写全';
    $('#sheetBody').innerHTML = `
      <p class="tip" style="color:var(--warn);font-size:13.5px">词典显示这些词有多个常见释义，必须都写上：</p>
      <div style="margin-top:10px">
        ${blocked.map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)">
          <div style="font-weight:650">${esc(x.en)}</div>
          <div style="font-size:12.5px;color:var(--ink2);margin-top:3px">应有 ${x.dict.length} 个：${x.dict.slice(0,4).map(esc).join('；')}</div>
        </div>`).join('')}
      </div>
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn" data-act="closeSheet">返回修改</button>
        <button class="btn primary" data-act="fillBlocked">按词典补全</button>
      </div>`;
    window.__blocked = blocked;
    return;
  }
  closeSheet();
  renderAll();
  if(ok.length) toast(`已添加 ${ok.length} 个，回首页可以开始学习`);
}

function parseLine(line){
  let s = String(line).trim();
  if(!s) return null;
  const tags = [];
  let m;
  while((m = s.match(/(?:^|\s)#([^\s#]+)\s*$/))){ tags.unshift(m[1]); s = s.slice(0,m.index).trim(); }
  if(!s) return null;
  const toks = s.split(/\s+/);
  const i = toks.findIndex(t=>CJK.test(t));
  if(i>0) return {en:toks.slice(0,i).join(' '), zh:toks.slice(i).join(' '), tags};
  if(i===0) return null;
  if(!/^[A-Za-z][A-Za-z\s'\u2019.\-]*$/.test(s)) return null;
  return {en:s, zh:'', tags};
}

function fillBlocked(){
  const list = window.__blocked||[];
  list.forEach(x=>{
    if(S.items.some(i=>normEn(i.en)===normEn(x.en))) return;
    const it = makeItem(x.en, x.dict.slice(0,MAX_FILL_SENSES).join('；'), x.tags);
    S.items.push(it);
  });
  window.__blocked = null;
  save(); closeSheet(); renderAll();
  toast('已按词典补全并添加');
}

async function lookupFill(){
  const box = $('#addBox');
  const txt = (box.value||'').trim().split(/\r?\n/)[0];
  if(!txt){ toast('先输入一个英文单词'); return; }
  const p = parseLine(txt);
  const w = p ? p.en : txt;
  await loadDict();
  const ds = dictSensesOf(w);
  if(!ds.length){ toast('词典里没找到 '+w); return; }
  const zh = ds.slice(0,MAX_FILL_SENSES).join('；');
  box.value = w + ' ' + zh + (p&&p.tags.length?' '+p.tags.map(t=>'#'+t).join(' '):'');
  toast('已填入词典释义');
}

        <span style="font-size:12.5px;color:${h.r==='right'?'var(--ok)':h.r==='empty'?'var(--ink3)':'var(--bad)'}">
          ${h.r==='right'?'正确':h.r==='empty'?'空':'未通过'}</span>

/* ============================================================
   17. 导出导入
   ============================================================ */
function download(name, text, mime){
  try{
    const b = new Blob([text],{type:mime||'application/json;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},100);
  }catch(e){ toast('导出失败'); }
}
function doExport(){
  const out = JSON.parse(JSON.stringify(S)); out.exam=null;
  download(`生词备份-${today()}.json`, JSON.stringify(out,null,2));
  toast('已导出');
}
function doImport(){
  $('#sheetTitle').textContent='导入备份';
  $('#sheetBody').innerHTML=`
    <textarea id="impBox" placeholder="粘贴备份 JSON"></textarea>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn" data-act="closeSheet">取消</button>
      <button class="btn primary" data-act="doImport">覆盖导入</button>
    </div>`;
  openSheet();
}
function runImport(){
  const raw = ($('#impBox').value||'').trim();
  if(!raw){ toast('没有内容'); return; }
  let o;
  try{ o = JSON.parse(raw); }catch(e){ toast('JSON 格式不对'); return; }
  if(!o || !Array.isArray(o.items)){ toast('不是有效的备份'); return; }
  if(!confirm('覆盖当前全部数据？')) return;
  S = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), o);
  S.exam = null;
  save(); closeSheet(); applyTheme(); renderAll();
  toast('导入完成');
}
function doSheet(){
  const list = S.items.filter(i=>i.learned&&i.status==='active');
  if(!list.length){ toast('没有可导出的词'); return; }
  let txt = `默写表 · ${today()}\n\n`;
  list.forEach((it,i)=>{ txt += `${String(i+1).padStart(2,' ')}. ${it.zh}\n     ${'.'.repeat(30)}\n`; });
  download(`默写表-${today()}.txt`, txt, 'text/plain;charset=utf-8');
  toast('已导出');
}

/* ============================================================
   18. 路由与事件
   ============================================================ */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  const el = $('#scr-'+name);
  if(el) el.classList.add('on');
  document.querySelectorAll('#tabbar button').forEach(b=>b.classList.toggle('on', b.dataset.tab===name));
  $('#tabbar').style.display = (name==='learn'||name==='review') ? 'none' : 'flex';
  if(name!=='learn'&&name!=='review'){ $('#tabbar').style.display='flex'; }
}
function goHome(){ showScreen('home'); renderHome(); }

function renderAll(){
  renderHome();
  renderWords();
  renderHard();
  renderMe();
}

function applyTheme(){
  document.body.classList.toggle('dark', S.settings.theme==='dark');
}

function pickChoice(btn){
  if(!learn) return;
  const it = byId(learn.ids[learn.idx]);
  if(!it) return;
  const q = learn.quiz || [];
  const chosen = q[Number(btn.dataset.k)];
  const right = splitSenses(it.zh)[0] || it.zh;
  if(chosen===right){
    btn.classList.add('right');
    setTimeout(learnNext, 240);
  }else{
    btn.classList.add('wrong');
    learn.wrong[it.id] = true;
    const all = document.querySelectorAll('#learnStage .opt');
    const idx = q.indexOf(right);
    if(all[idx]) all[idx].classList.add('right');
    setTimeout(learnNext, 820);
  }
}

document.addEventListener('click', e=>{
  const kb = e.target.closest('[data-kb]');
  if(kb){ kbInput(kb.dataset.kb); return; }

  const pk = e.target.closest('[data-pick]');
  if(pk){ togglePick(Number(pk.dataset.pick)); return; }

  const t = e.target.closest('[data-act],[data-tab],[data-detail],[data-set],[data-num]');
  if(!t) return;

  if(t.dataset.tab){
    showScreen(t.dataset.tab);
    if(t.dataset.tab==='words') renderWords();
    if(t.dataset.tab==='me') renderMe();
    if(t.dataset.tab==='hard') renderHard();
    return;
  }

  if(t.dataset.detail){ openDetail(t.dataset.detail); return; }

  if(t.dataset.set){
    const k = t.dataset.set;
    if(k==='theme'){ S.settings.theme = S.settings.theme==='dark'?'light':'dark'; applyTheme(); }
    if(k==='onlineAudio'){ S.settings.onlineAudio = !S.settings.onlineAudio; }
    if(k==='autoSpeak'){ S.settings.autoSpeak = !S.settings.autoSpeak; if(S.settings.autoSpeak) speak('hello'); }
    if(k==='autoBackup'){
      S.settings.autoBackup = !S.settings.autoBackup;
      if(S.settings.autoBackup){ writeSnapshot(); capBackup(); toast('已开启自动备份'); }
    }
    if(k==='reminder'){ toggleReminder(); return; }
    save(); renderMe(); return;
  }

  const act = t.dataset.act;
  if(!act) return;

  switch(act){
    case 'theme': S.settings.theme = S.settings.theme==='dark'?'light':'dark'; applyTheme(); save(); renderMe(); break;
    case 'startLearn': startLearn(); break;
    case 'startReview': startReview(); break;
    case 'startDrill': startDrill(); break;
    case 'quit': learn=null; exam=null; goHome(); break;
    case 'speak': speak(t.dataset.w); break;
    case 'speakS': speak(t.dataset.s); break;
    case 'meetNext': learnNext(); break;
    case 'reveal': if(learn){ learn.revealed=true; renderLearn(); } break;
    case 'recallYes': learnNext(); break;
    case 'recallNo': if(learn){ learn.wrong[learn.ids[learn.idx]]=true; learnNext(); } break;
    case 'pick': pickChoice(t); break;
    case 'prevQ': prevQ(); break;
    case 'nextQ': nextQ(); break;
    case 'grade': gradeExam(); break;
    case 'retryWrong': retryWrong(); break;
    case 'doneExam': doneExam(); break;
    case 'snapshots': openSnapshots(); break;
    case 'restoreSnap': restoreSnap(t.dataset.i); break;
    case 'clock+': S.clockOffset=(S.clockOffset||0)+1; save(); renderAll(); break;
    case 'clock-': S.clockOffset=(S.clockOffset||0)-1; save(); renderAll(); break;
    case 'add': openAdd(); break;
    case 'lookupFill': lookupFill(); break;
    case 'doAdd': doAdd(); break;
    case 'fillBlocked': fillBlocked(); break;
    case 'closeSheet': closeSheet(); break;
    case 'export': doExport(); break;
    case 'import': doImport(); break;
    case 'doImport': runImport(); break;
    case 'sheet': doSheet(); break;
    case 'wipe': {
      if(!confirm('清空全部数据？建议先导出备份')) break;
      if(!confirm('再次确认：不可恢复')) break;
      S = JSON.parse(JSON.stringify(DEFAULTS)); save(); applyTheme(); renderAll(); toast('已清空'); break;
    }
    case 'fav': {
      const it = byId(t.dataset.id); if(!it) break;
      it.fav=!it.fav; it.updatedAt=Date.now(); save(); openDetail(it.id); break;
    }
    case 'recall': {
      const it = byId(t.dataset.id); if(!it) break;
      it.status='active'; it.stage=0; it.maxStage=0; it.streak=0; it.nextDate=addD(today(),1);
      it.updatedAt=Date.now(); save(); openDetail(it.id); toast('已召回，明天进入第 1 阶'); break;
    }
    case 'del': {
      const it = byId(t.dataset.id); if(!it) break;
      if(!confirm('删除 '+it.en+'？')) break;
      S.items = S.items.filter(x=>x.id!==it.id); save(); closeSheet(); renderAll(); break;
    }
  }
});

document.addEventListener('change', e=>{
  const tm = e.target.closest('[data-time]');
  if(tm){
    S.settings[tm.dataset.time] = tm.value || '20:00';
    save();
    if(S.settings.reminder) scheduleReminder();
    renderMe();
    return;
  }
  const n = e.target.closest('[data-num]');
  if(!n) return;
  const v = Number(n.value);
  if(!isNaN(v)) S.settings[n.dataset.num] = v;
  save();
});

$('#mask').addEventListener('click', closeSheet);

/* ============================================================
   19. 启动
   ============================================================ */
(function init(){
  applyTheme();
  loadDict();
  renderAll();
  showScreen('home');
  if(S.settings.autoBackup){
    setTimeout(()=>{ writeSnapshot(); capBackup(); }, 1200);
  }
  if(S.settings.reminder) setTimeout(scheduleReminder, 2000);
})();
</script>
