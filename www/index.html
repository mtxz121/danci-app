<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b6cf6">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>温故</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#12151c; --ink2:#5b6472; --ink3:#9aa3b2;
  --line:#e8ebf1; --brand:#2b6cf6; --brand2:#1d55cc; --brandSoft:#eaf0ff;
  --ok:#0f9d58; --okSoft:#e6f6ee; --bad:#e5484d; --badSoft:#fdecec;
  --warn:#c47f0a; --warnSoft:#fdf4e3;
  --r:14px; --r2:20px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.05);
}
body.dark{
  --bg:#0f1116; --card:#181b22; --ink:#e9ecf1; --ink2:#a2abb8; --ink3:#6d7684;
  --line:#262b34; --brand:#5b8cff; --brand2:#7aa3ff; --brandSoft:#1a2440;
  --ok:#3ec27a; --okSoft:#13291e; --bad:#f2737a; --badSoft:#33191b;
  --warn:#e0a33c; --warnSoft:#2c2416;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 88px}
.pad{padding:0 16px}

/* ---------- 顶栏 ---------- */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px 16px 10px;
  padding-top:calc(14px + env(safe-area-inset-top));
}
.topbar h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.2px}
.topbar .sp{flex:1}
.iconbtn{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.iconbtn:active{transform:scale(.95)}

/* ---------- 首页 ---------- */
.hero{
  background:linear-gradient(135deg,var(--brand),#6f5cf5);color:#fff;border-radius:var(--r2);
  padding:22px 20px;margin:6px 0 14px;box-shadow:0 10px 24px rgba(43,108,246,.28);
}
.hero .d{font-size:12.5px;opacity:.85}
.hero .big{font-size:44px;font-weight:750;line-height:1.15;margin-top:6px;letter-spacing:-1px}
.hero .sub{font-size:13px;opacity:.9;margin-top:2px}
.hero .row{display:flex;gap:10px;margin-top:16px}
.hero button{flex:1;height:44px;border-radius:12px;background:#fff;color:var(--brand);
  font-weight:650;font-size:15px}
.hero button.ghost{background:rgba(255,255,255,.18);color:#fff;flex:0 0 42%}
.hero button:active{transform:scale(.98)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.mini .n{font-size:24px;font-weight:750;line-height:1.1}
.mini .k{font-size:12px;color:var(--ink3);margin-top:3px}
.sect{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.sect h3{font-size:14px;font-weight:650;margin:0;color:var(--ink2)}
.sect button{font-size:12.5px;color:var(--brand)}

/* ---------- 列表 ---------- */
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;box-shadow:var(--shadow)}
.item .m{flex:1;min-width:0}
.item .en{font-weight:650;font-size:15.5px;word-break:break-word}
.item .zh{font-size:12.5px;color:var(--ink2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mt{font-size:11px;color:var(--ink3);margin-top:3px}
.tag{display:inline-block;font-size:10.5px;color:var(--brand);background:var(--brandSoft);
  padding:1px 6px;border-radius:999px;margin-right:4px}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--warnSoft);color:var(--warn)}
.pill.ok{background:var(--okSoft);color:var(--ok)}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:48px 20px}
.empty b{display:block;font-size:15px;color:var(--ink2);margin-bottom:6px}

/* ---------- 学习 / 复习 卡 ---------- */
.stage{flex:1;display:flex;flex-direction:column;padding:0 16px}
.pbar{height:4px;background:var(--line);border-radius:999px;overflow:hidden;margin:4px 0 18px}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .3s}
.bigcard{flex:1;background:var(--card);border-radius:24px;border:1px solid var(--line);
  box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;
  align-items:center;padding:28px 22px;min-height:0;position:relative}
.bigcard.learning{justify-content:flex-start;align-items:stretch}
.word{font-size:40px;font-weight:750;letter-spacing:-.5px;text-align:center;word-break:break-word;line-height:1.2}
.word.small{font-size:28px}
.phon{color:var(--ink3);font-size:14px;margin-top:8px;text-align:center}
.speakbtn{width:44px;height:44px;border-radius:50%;background:var(--brandSoft);color:var(--brand);
  display:flex;align-items:center;justify-content:center;margin:14px auto 0}
.speakbtn:active{transform:scale(.92)}
.senses{margin-top:22px;width:100%}
.sense{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.sense:last-child{border-bottom:none}
.sense .no{color:var(--ink3);font-size:12.5px;padding-top:3px;min-width:14px}
.hintline{text-align:center;color:var(--ink3);font-size:13px;margin-top:18px}
.actions{flex:0 0 auto;display:flex;gap:10px;padding:14px 0 calc(16px + env(safe-area-inset-bottom))}
.btn{flex:1;height:50px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  font-weight:650;font-size:15.5px;color:var(--ink);display:flex;align-items:center;justify-content:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff;border-color:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.bad{background:var(--badSoft);color:var(--bad);border-color:transparent}
.btn:disabled{opacity:.45}

/* 选择题 */
.opt{width:100%;text-align:left;padding:15px 16px;border-radius:14px;background:var(--card);
  border:1.5px solid var(--line);margin-bottom:10px;font-size:15.5px;transition:all .15s}
.opt:active{transform:scale(.99)}
.opt.right{border-color:var(--ok);background:var(--okSoft);color:var(--ok);font-weight:650}
.opt.wrong{border-color:var(--bad);background:var(--badSoft);color:var(--bad)}

/* 默写输入 */
.answerbox{width:100%;margin-top:20px}
.answerbox input{width:100%;height:56px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card);padding:0 16px;font-size:18px;outline:none;text-align:center;letter-spacing:.3px}
.answerbox input:focus{border-color:var(--brand)}
.result{margin-top:16px;font-size:14px;text-align:center}
.result .r{font-size:17px;font-weight:700}
.result .r.ok{color:var(--ok)}
.result .r.bad{color:var(--bad)}
.result .fix{margin-top:6px;color:var(--ink2)}
.result .fix b{color:var(--bad);font-size:17px}
.result .miss{color:var(--warn);font-size:12.5px;margin-top:5px}

/* ---------- 底部导航 ---------- */
#tabbar{
  position:absolute;left:0;right:0;bottom:0;display:flex;z-index:20;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
body.dark #tabbar{background:rgba(24,27,34,.94)}
#tabbar button{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;color:var(--ink3);font-size:10.5px}
#tabbar button.on{color:var(--brand)}
#tabbar svg{width:22px;height:22px}

/* ---------- 弹层 ---------- */
#mask{position:fixed;inset:0;background:rgba(10,14,20,.4);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:40}
#mask.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;
  z-index:50;transform:translateY(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);
  max-height:88vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#sheet.on{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.sheet-head h3{margin:0;font-size:16px;font-weight:700}
.sheet-body{overflow-y:auto;padding:0 18px 18px}
.sheet-body textarea{width:100%;min-height:150px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--bg);padding:12px;font-size:14.5px;line-height:1.6;outline:none;resize:vertical}
.sheet-body textarea:focus{border-color:var(--brand)}
.tip{font-size:12.5px;color:var(--ink3);margin:8px 0 0;line-height:1.6}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .l{font-size:14.5px}
.row .s{font-size:12px;color:var(--ink3);margin-top:2px}
.switch{width:46px;height:27px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:0 0 auto}
.switch i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--brand)}
.switch.on i{left:22px}
.num-in{width:70px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);
  text-align:center;outline:none;font-size:14px}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,10px);background:rgba(20,24,32,.92);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;
  transition:.2s;z-index:90;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 空状态的大加号 */
.fab{position:absolute;right:16px;bottom:76px;width:54px;height:54px;border-radius:50%;
  background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(43,108,246,.4);z-index:15}
.fab:active{transform:scale(.94)}
#addMask{position:fixed;inset:0;background:rgba(10,14,20,.4);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:40}
#addMask.on{opacity:1;pointer-events:auto}

/* ---------- 例句 ---------- */
.exbox{margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);width:100%}
.ex-en{font-size:14px;line-height:1.55;color:var(--ink)}
.ex-zh{font-size:12.5px;color:var(--ink3);margin-top:4px}
.ex-spk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
  background:var(--brandSoft);color:var(--brand);margin-left:6px;vertical-align:middle}

/* ---------- 默写键盘 ---------- */
.kbdpan{flex:0 0 auto;padding:6px 0 calc(6px + env(safe-area-inset-bottom));user-select:none}
.kb-row{display:flex;gap:5px;justify-content:center;margin-bottom:6px}
.kb-key{flex:1;height:42px;border-radius:9px;background:var(--card);border:1px solid var(--line);
  font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 0 rgba(16,24,40,.05)}
.kb-key:active{background:var(--brandSoft);color:var(--brand);transform:translateY(1px)}
.kb-key.fn{flex:1.7;font-size:13px;color:var(--ink2);background:var(--line);border-color:transparent}
.kb-key.go{flex:2;background:var(--brand);color:#fff;border-color:transparent;font-size:14px}
.typebox{width:100%;min-height:58px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 14px;margin-top:18px;
  font-size:21px;font-weight:650;letter-spacing:.5px;word-break:break-word;text-align:center}
.typebox .ph{color:var(--ink3);font-weight:400;font-size:14px;letter-spacing:0}
.typebox .caret{display:inline-block;width:2px;height:20px;background:var(--brand);margin-left:2px;
  animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.zhprompt{font-size:21px;font-weight:650;text-align:center;margin-top:14px;line-height:1.45}
.reveal-word{margin-top:14px;text-align:center;font-size:13px;color:var(--warn)}
.reveal-word b{font-size:19px;letter-spacing:.5px}
.bigcard.kbd{justify-content:flex-start;align-items:stretch;overflow-y:auto;padding:18px 16px}

/* ---------- 释义多选 ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;width:100%}
.chip{padding:11px 13px;border-radius:11px;background:var(--card);border:1.5px solid var(--line);
  font-size:14px;line-height:1.35;text-align:left}
.chip.on{border-color:var(--brand);background:var(--brandSoft);color:var(--brand);font-weight:650}
.examtip{text-align:center;font-size:12px;color:var(--ink3);margin:-6px 0 10px}

/* ---------- 结果 ---------- */
.rlist{width:100%;margin-top:14px}
.ritem{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ritem:last-child{border-bottom:none}
.rstat{font-weight:750;width:16px;flex:0 0 auto}

/* ---------- 正确率柱状 ---------- */
.bars{display:flex;align-items:flex-end;gap:3px;height:64px;margin:4px 0 16px}
.bars i{flex:1;height:100%;background:var(--line);border-radius:3px;display:flex;align-items:flex-end}
.bars i b{display:block;width:100%;background:var(--brand);border-radius:3px}

/* ---------- 标签 / 科目 ---------- */
.chip.sm{padding:7px 11px;font-size:13px;border-radius:999px}
.subj{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
  background:var(--brandSoft);color:var(--brand);margin-right:6px;flex:0 0 auto}
.s0{background:#e8f0ff;color:#2b6cf6}.s1{background:#e9f7ef;color:#0f9d58}
.s2{background:#fdf0e6;color:#c47f0a}.s3{background:#f3ecff;color:#7a4ddb}
.s4{background:#fdecec;color:#e5484d}.s5{background:#e6f6f6;color:#0f8b8b}
body.dark .s0{background:#1a2440;color:#7aa3ff}body.dark .s1{background:#13291e;color:#3ec27a}
body.dark .s2{background:#2c2416;color:#e0a33c}body.dark .s3{background:#241c36;color:#b299ff}
body.dark .s4{background:#33191b;color:#f2737a}body.dark .s5{background:#0f2a2a;color:#4fd1c5}

/* ---------- 拼写热力图 ---------- */
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:6px 0 16px}
.heat i{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:650;font-style:normal;background:var(--line);color:var(--ink3)}
.heat i.hot{color:#fff}

/* ---------- 编辑表单 ---------- */
.fl{display:block;font-size:12.5px;color:var(--ink3);margin-bottom:12px}
.fl input,.fl textarea{display:block;width:100%;margin-top:6px;background:var(--bg);color:var(--ink);
  border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14.5px;outline:none}
.fl input:focus,.fl textarea:focus{border-color:var(--brand)}
.fl textarea{min-height:74px;resize:vertical}

/* ---------- 错题 ---------- */
.mcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center}
.mtext{font-size:18px;line-height:1.6;font-weight:600;word-break:break-word}
</style>
</head>
<body>

<div id="app">
  <!-- 首页 -->
  <section class="screen on" id="scr-home">
    <div class="topbar">
      <h1>温故</h1><div class="sp"></div>
      <button class="iconbtn" data-act="theme" aria-label="夜间模式">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/>
        </svg>
      </button>
    </div>
    <div class="scroll" id="homeBody"></div>
  </section>

  <!-- 学习 -->
  <section class="screen" id="scr-learn">
    <div class="topbar">
      <button class="iconbtn" data-act="quit" aria-label="退出">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M15 5 8 12l7 7"/>
        </svg>
      </button>
      <h1 style="font-size:16px" id="learnTitle">学习新词</h1>
      <div class="sp"></div>
      <span style="font-size:12.5px;color:var(--ink3)" id="learnCount"></span>
    </div>
    <div class="stage" id="learnStage"></div>
  </section>

  <!-- 复习 -->
  <section class="screen" id="scr-review">
    <div class="topbar">
      <button class="iconbtn" data-act="quit" aria-label="退出">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M15 5 8 12l7 7"/>
        </svg>
      </button>
      <h1 style="font-size:16px" id="reviewTitle">默写复习</h1>
      <div class="sp"></div>
      <span style="font-size:12.5px;color:var(--ink3)" id="reviewCount"></span>
    </div>
    <div class="stage" id="reviewStage"></div>
  </section>

  <!-- 词库 -->
  <section class="screen" id="scr-words">
    <div class="topbar">
      <h1>词库</h1><div class="sp"></div>
      <span style="font-size:12.5px;color:var(--ink3)" id="wordsCount"></span>
    </div>
    <div class="scroll" id="wordsBody"></div>
    <button class="fab" data-act="add" aria-label="添加">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
  </section>

  <!-- 我的 -->
  <section class="screen" id="scr-me">
    <div class="topbar"><h1>我的</h1></div>
    <div class="scroll" id="meBody"></div>
  </section>

  <!-- 难词本 -->
  <section class="screen" id="scr-hard">
    <div class="topbar"><h1>难词本</h1><div class="sp"></div>
      <span style="font-size:12.5px;color:var(--ink3)" id="hardCount"></span>
    </div>
    <div class="scroll" id="hardBody"></div>
  </section>

  <!-- 错题本 -->
  <section class="screen" id="scr-mistakes">
    <div class="topbar"><h1>错题本</h1><div class="sp"></div>
      <span style="font-size:12.5px;color:var(--ink3)" id="misCount"></span>
      <button class="iconbtn" data-act="addMistake" aria-label="添加错题">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div class="scroll" id="misBody"></div>
  </section>

  <!-- 错题复习 -->
  <section class="screen" id="scr-mrev">
    <div class="topbar">
      <button class="iconbtn" data-act="quitMrev" aria-label="退出">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 5 8 12l7 7"/></svg>
      </button>
      <h1 style="font-size:16px" id="mrevTitle">错题复习</h1>
      <div class="sp"></div>
      <span style="font-size:12.5px;color:var(--ink3)" id="mrevCount"></span>
    </div>
    <div class="stage" id="mrevStage"></div>
  </section>

  <nav id="tabbar">
    <button class="on" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>
      <span>首页</span>
    </button>

<script>
/* ============================================================
   0. 常量
   ============================================================ */
const KEY = 'wordapp_v1';
let APP_VERSION = '1.7';        // 每次发版递增，同时改 www/version.json
const GAPS = [1,1,2,3,4,4,6,9,15,15];
const TOTAL_STAGE = 10;
const MAX_FILL_SENSES = 2;      // 词典自动补全最多取几条释义

const DEFAULTS = {
  v: 1,
  settings: {
    theme:'light', onlineAudio:true, autoSpeak:true, autoBackup:true,
    reminder:false, remindTime:'20:00', sessionMin:0, listenInExam:false, recallFirst:true, misGap:'xlong',
    lastSubject:'物理', lastBook:{}, lastTopic:{},
    newPerDay:30, paperCap:40, answerCap:60
  },
  clockOffset: 0,
  items: [],
  days: {},
  meta: { deferStreak:0, deferDate:'' },
  exam: null,
  mistakes: [],
  spellHeat: {}
};

/** 时长档：一键设定每天学多少新词 / 复习多少 */
const SESSION_PRESETS = {
  5:  {newPerDay:5,  paperCap:10},
  10: {newPerDay:10, paperCap:18},
  20: {newPerDay:18, paperCap:30},
  30: {newPerDay:25, paperCap:40}
};
/** 错题本：语数英物化地，按间隔档复习 4 遍 */
const SUBJECTS = ['语文','数学','英语','物理','化学','地理'];
/** 错题本间隔档：按天数递进，最后一遍之后归档 */
const MISTAKE_PRESETS = {
  std:   [1,2,4,7],
  long:  [1,3,7,15],
  xlong: [1,7,15,30]
};
function mistakeGaps(){
  return MISTAKE_PRESETS[S.settings.misGap] || MISTAKE_PRESETS.long;
}

/* ============================================================
   1. 存储
   ============================================================ */
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULTS));
    const d = JSON.parse(raw);
    const base = JSON.parse(JSON.stringify(DEFAULTS));
    d.settings = Object.assign(base.settings, d.settings||{});
    // 安卓 WebView 没有 speechSynthesis，老用户一次性切到联网发音
    if(!d.settings.onlineAudioFixed){
      d.settings.onlineAudio = true;
      d.settings.onlineAudioFixed = true;
    }
    d.meta = Object.assign(base.meta, d.meta||{});
    d.items = Array.isArray(d.items)? d.items : [];
    d.days = d.days || {};
    d.mistakes = Array.isArray(d.mistakes) ? d.mistakes : [];
    if(!d.settings.lastBook) d.settings.lastBook = {};
    d.mistakes.forEach(m=>{
      if(m.answer == null) m.answer = '';
      if(m.cause == null) m.cause = '';
      if(m.tag == null) m.tag = '';
      if(m.img == null) m.img = '';
      if(m.finishedAt == null) m.finishedAt = '';
      if(m.failCount == null) m.failCount = 0;
      if(m.fav == null) m.fav = false;
      if(m.book == null) m.book = '';
      if(/^第+$/.test(m.book)) m.book = '';
      if(m.topic == null) m.topic = '';
      if(!Array.isArray(m.derived)) m.derived = [];
      if(m.page == null){
        const loc = parseLoc(m.text||'');
        if(!m.book) m.book = loc.book;
        m.page = loc.page; m.no = loc.no;
      }
    });
    d.spellHeat = d.spellHeat || {};
    return d;
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULTS)); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('存储空间不足，请先导出备份'); }
  scheduleBackup();
}

/* ---- 自动备份：本地快照（最近 3 份） + 手机文档目录（每天 1 份） ---- */
const SNAP_KEY = 'wordapp_snap_v1';
let bkTimer = null, capBackupDay = '';
function scheduleBackup(){
  if(!S.settings || !S.settings.autoBackup) return;
  clearTimeout(bkTimer);
  bkTimer = setTimeout(()=>{ writeSnapshot(); capBackup(); }, 2500);
}
function snapshots(){
  try{ return JSON.parse(localStorage.getItem(SNAP_KEY) || '[]'); }catch(e){ return []; }
}
function backupPayload(){
  return JSON.stringify({
    v:1, saved:today(), items:S.items, days:S.days, settings:S.settings,
    clockOffset:S.clockOffset, meta:S.meta, mistakes:S.mistakes, spellHeat:S.spellHeat
  });
}
function writeSnapshot(){
  try{
    const data = backupPayload();
    if(data.length > 600000) return;
    const arr = snapshots();
    const d = today();
    const rec = {d, ts:Date.now(), n:S.items.length, data};
    const i = arr.findIndex(x=>x.d===d);
    if(i>=0) arr[i] = rec; else arr.unshift(rec);
    localStorage.setItem(SNAP_KEY, JSON.stringify(arr.slice(0,3)));
  }catch(e){}
}
function capPlugin(name){
  const C = window.Capacitor;
  return (C && C.Plugins && C.Plugins[name]) || null;
}
async function capBackup(){
  if(!S.settings || !S.settings.autoBackup) return;
  const FS = capPlugin('Filesystem');
  if(!FS) return;
  if(capBackupDay === today()) return;
  const data = backupPayload();
  const name = '温故/备份-' + today() + '.json';
  try{
    await FS.writeFile({path:name, data, directory:'DOCUMENTS', encoding:'utf8', recursive:true});
    capBackupDay = today();
  }catch(e){
    // 没有存储权限时退回应用私有目录，至少不会丢
    try{
      await FS.writeFile({path:'备份-'+today()+'.json', data, directory:'DATA', encoding:'utf8'});
      capBackupDay = today();
    }catch(_){}
  }
}

/* ============================================================
   2. 日期
   ============================================================ */
const p2 = n => (n<10?'0':'')+n;
const fmt = d => d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
function parseD(s){ const a=String(s).split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function today(){
  const d = new Date();
  if(S.clockOffset) d.setDate(d.getDate()+Number(S.clockOffset));
  return fmt(new Date(d.getFullYear(),d.getMonth(),d.getDate()));
}
function addD(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return fmt(d); }
function diffD(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }

/* ============================================================
   3. 通用工具
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CJK = /[\u3400-\u9FFF]/;
let toastT = null;
function toast(m){
  const t=$('#toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2000);
}
function byId(id){ return S.items.find(i=>i.id===id)||null; }

/* ============================================================
   4. 分词与判分
   ============================================================ */
function splitSenses(zh){
  return String(zh==null?'':zh).split(/[；;\/|\n]+/).map(s=>s.trim()).filter(Boolean);
}
function normEn(s){
  return String(s==null?'':s)
    .replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/\u3000/g,' ').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"')
    .replace(/\s+/g,' ').trim().toLowerCase()
    .replace(/[\s.,;:!?"']+$/,'').trim();
}
function normZh(s){
  return String(s==null?'':s)
    .replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[（(][^）)]*[）)]/g,'')
    .replace(/[\s，,。.、；;：:！!？?"'“”‘’·…\-—_\/\\]+/g,'')
    .trim().toLowerCase();
}
function judgeEn(raw, item){
  const a=normEn(raw), b=normEn(item.en);
  if(!a) return {r:'empty'};
  if(a===b) return {r:'right'};
  return {r:'wrong'};
}

/* ============================================================
   5. 词典（按需加载）
   ============================================================ */
let DICT = null, dictLoading = null;
function loadDict(){
  if(DICT) return Promise.resolve(DICT);
  if(!dictLoading){
    dictLoading = fetch('dict.json').then(r=>r.json())
      .then(d=>{ DICT=d; return d; })
      .catch(()=>{ DICT={}; return DICT; });
  }
  return dictLoading;
}
function dictLookup(word){
  if(!DICT) return null;
  return DICT[normEn(word)] || null;
}

/* ============================================================
   6. 发音（安卓 WebView 没有 speechSynthesis，走联网音频）
   单词 → 有道真人音；整句 → 百度 TTS
   ============================================================ */
let lastAudio = null;
function speak(text, silent){
  const s = String(text==null?'':text).trim();
  if(!s) return;
  if(S.settings.onlineAudio){ onlineSpeak(s, silent); return; }
  if('speechSynthesis' in window){ tts(s); return; }
  onlineSpeak(s, silent);
}
function onlineSpeak(text, silent){
  const n = text.split(/\s+/).filter(Boolean).length;
  const url = n >= 3
    ? 'https://fanyi.baidu.com/gettts?lan=en&spd=3&source=web&text='+encodeURIComponent(text)
    : 'https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(text)+'&type=2';
  try{
    if(lastAudio){ try{ lastAudio.pause(); }catch(e){} lastAudio = null; }
    const a = new Audio(url);
    a.preload = 'auto';
    lastAudio = a;
    const p = a.play();
    if(p && p.catch) p.catch(()=>{
      if('speechSynthesis' in window) tts(text);
      else if(!silent) toast('发音加载失败，请检查网络');
    });
  }catch(e){
    if('speechSynthesis' in window) tts(text);
    else if(!silent) toast('发音失败');
  }
}
function tts(text){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.92; u.pitch=1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ============================================================
   7. 词条
   ============================================================ */
function makeItem(en, zh, tags){
  const t = today();
  return {
    id:'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    en, zh, tags:tags||[],
    created:t,
    learned:false, learnRounds:0,
    stage:0, maxStage:0, nextDate:t,
    officialTestCount:0, officialRightCount:0,
    streak:0, errCount:0, totalAnswerCount:0,
    firstTestDone:false, status:'active',
    fav:false, favTestCount:0, favRightCount:0,
    drillCount:0, drillRight:0, ex:null,
    history:[], updatedAt:Date.now()
  };
}
function pushHist(it, rec){
  it.history.push(rec);
  if(it.history.length>40) it.history = it.history.slice(-40);
}
function newItems(){ return S.items.filter(i=>!i.learned && i.status==='active'); }
function dueItems(){
  const t=today();
  return S.items.filter(i=>i.learned && i.status==='active' && i.nextDate && i.nextDate<=t);
}

/* ============================================================
   8. 组卷
   ============================================================ */
function buildPaper(){
  const t = today();
  const cands = dueItems();
  if(!cands.length) return {ids:[],deferred:0,total:0};
  const scored = cands.map(it=>{
    const od = Math.max(0, diffD(it.nextDate,t));
    const age = Math.max(0, diffD(it.created,t));
    let sc = it.errCount*1000 + od*10 + it.stage - age*0.001;
    if(od>7) sc += 1e6;
    return {it, od, sc};
  });
  const forced = scored.filter(x=>x.od>7).sort((a,b)=>b.sc-a.sc);
  const other  = scored.filter(x=>x.od>0&&x.od<=7).sort((a,b)=>b.sc-a.sc);
  const normal = scored.filter(x=>x.od===0).sort((a,b)=>b.sc-a.sc);
  const CAP = Math.max(5, Number(S.settings.paperCap)||40);
  const picked=[], used=new Set();
  const take=(arr,n)=>{ for(const x of arr){ if(n<=0||picked.length>=CAP) break;
    if(used.has(x.it.id)) continue; used.add(x.it.id); picked.push(x.it); n--; } };
  take(forced, Math.min(20,CAP));
  take(other, Math.max(0,10-picked.length));
  take(other, CAP-picked.length);
  take(normal, CAP-picked.length);
  return {ids:picked.map(i=>i.id), deferred:cands.length-picked.length, total:cands.length};
}

/* ============================================================
   9. 学习流程（认识 → 回忆 → 选择 → 默写）
   ============================================================ */
let learn = null;

function dictSensesOf(word){
  const d = dictLookup(word);
  if(!d) return [];
  const arr = Array.isArray(d.s) ? d.s : (Array.isArray(d) ? d : []);
  return arr.map(cleanDictSense).filter(Boolean);
}
/** 词典里有「zebras 或 zebra 〈动〉斑马」「-rr- 厌恶」这类脏数据，取释义时清掉前缀 */
function cleanDictSense(s){
  let t = String(s==null?'':s).trim();
  if(!/^[A-Za-z\-]/.test(t)) return t;
  const out = t
    .replace(/^.*[〈<][^〉>]{1,6}[〉>]\s*/, '')
    .replace(/^[A-Za-z0-9'’\-\.,\s\/]+?(?=[\u3400-\u9FFF])/, '')
    .trim();
  return out || t;
}
function phonOf(word){
  const d = dictLookup(word);
  return (d && d.p) ? d.p : '';
}
function exOf(word){
  const d = dictLookup(word);
  return (d && d.e && d.e.length === 2) ? d.e : null;
}
/** 词条自带的例句优先，否则用词典的 */
function itemEx(it){
  if(it && Array.isArray(it.ex) && it.ex.length === 2 && it.ex[0]) return it.ex;
  return exOf(it ? it.en : '');
}
function autoSpeak(word){
  if(S.settings.autoSpeak) speak(word);
}

const IC_SPK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
const IC_SPK_SM = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>';
const IC_SPK_BIG = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8 8 0 0 1 0 12"/></svg>';
const LEARN_PHASES = ['meet','recall','quiz','spell'];
const PHASE_NAME = {meet:'认识新词', recall:'回想一下', quiz:'选出释义', spell:'默写一遍'};

function startLearn(){
  const list = newItems().slice(0, Number(S.settings.newPerDay)||30);
  if(!list.length){ toast('没有待学的新词'); return; }
  learn = {
    ids: list.map(i=>i.id),
    idx: 0,
    phase: 'meet',
    revealed: false,
    quiz: null,
    wrong: {},
    tries: {},
    requeued: {},
    spokenFor: '',
    copy: false,
    text: ''
  };
  showScreen('learn');
  renderLearn();
}

function renderLearn(){
  const box = $('#learnStage');
  if(!learn){ goHome(); return; }
  const total = learn.ids.length;
  if(learn.idx >= total){ finishLearn(); return; }
  const it = byId(learn.ids[learn.idx]);
  if(!it){ learn.idx++; return renderLearn(); }

  const pi = LEARN_PHASES.indexOf(learn.phase);
  const pct = Math.round((learn.idx + pi/LEARN_PHASES.length) / total * 100);
  $('#learnTitle').textContent = PHASE_NAME[learn.phase] || '学习';
  $('#learnCount').textContent = (learn.idx+1)+' / '+total;

  const phon = phonOf(it.en);
  const ex = itemEx(it);
  const senses = splitSenses(it.zh);

  let html = `<div class="pbar"><i style="width:${pct}%"></i></div>`;

  if(learn.phase==='meet'){
    html += `<div class="bigcard learning">
      <div style="text-align:center;margin-top:4px">
        <div class="word">${esc(it.en)}</div>
        ${phon?`<div class="phon">/${esc(phon)}/</div>`:''}
        <button class="speakbtn" data-act="speak" data-w="${esc(it.en)}">${IC_SPK}</button>
      </div>
      <div class="senses">${senses.map((z,i)=>
        `<div class="sense"><span class="no">${i+1}</span><span>${esc(z)}</span></div>`).join('')}</div>
      ${ex?`<div class="exbox">
        <div class="ex-en">${esc(ex[0])}<button class="ex-spk" data-act="speakS" data-s="${esc(ex[0])}">${IC_SPK_SM}</button></div>
        <div class="ex-zh">${esc(ex[1])}</div>
      </div>`:''}
    </div>
    <div class="actions"><button class="btn primary" data-act="meetNext">记住了，下一步</button></div>`;
  }
  else if(learn.phase==='recall'){
    html += `<div class="bigcard">
      <div class="word">${esc(it.en)}</div>
      ${phon?`<div class="phon">/${esc(phon)}/</div>`:''}
      <button class="speakbtn" data-act="speak" data-w="${esc(it.en)}">${IC_SPK}</button>
      ${learn.revealed
        ? `<div class="senses">${senses.map((z,i)=>
            `<div class="sense"><span class="no">${i+1}</span><span>${esc(z)}</span></div>`).join('')}</div>`
        : `<div class="hintline">先在心里过一遍它的意思，再翻开</div>`}
    </div>
    <div class="actions">
      ${learn.revealed
        ? `<button class="btn bad" data-act="recallNo">没记住</button>
           <button class="btn ok" data-act="recallYes">记住了</button>`
        : `<button class="btn primary" data-act="reveal">显示释义</button>`}
    </div>`;
  }
  else if(learn.phase==='quiz'){
    const q = learn.quiz || makeChoices(it);
    learn.quiz = q;
    html += `<div class="bigcard">
      <div class="word small">${esc(it.en)}</div>
      <div class="hintline" style="margin-top:8px">哪个是它的意思？</div>
      <div style="width:100%;margin-top:22px">
        ${q.map((c,k)=>`<button class="opt" data-act="pick" data-k="${k}">${esc(c)}</button>`).join('')}
      </div>
    </div>
    <div class="actions"><div style="flex:1"></div></div>`;
  }
  else{
    html += `<div class="bigcard learning">
      <div class="hintline" style="margin-top:2px">看释义，拼出英文</div>
      <div class="zhprompt">${senses.map(esc).join('；')}</div>
      ${learn.copy?`<div class="reveal-word">正确拼写：<b>${esc(it.en)}</b>　照着打一遍</div>`:''}
      <div class="typebox" id="typeBox"></div>
    </div>
    ${keyboardHTML('确认')}`;
  }

  box.innerHTML = html;

  if(learn.phase==='spell'){
    paintTyped($('#typeBox'), learn.text, '用下面的键盘拼写');
  }
  if(learn.phase==='meet' && S.settings.autoSpeak && learn.spokenFor !== it.id){
    learn.spokenFor = it.id;
    setTimeout(()=>speak(it.en, true), 260);
  }
}

function makeChoices(it){
  const right = splitSenses(it.zh)[0] || it.zh;
  const used = new Set([normZh(right)]);
  const picks = [];
  const pool = [];
  S.items.forEach(x=>{
    if(x.id===it.id) return;
    splitSenses(x.zh).forEach(s=>pool.push(s));
  });
  shuffle(pool);
  for(const p of pool){
    if(picks.length>=2) break;
    const n = normZh(p);
    if(!n || used.has(n)) continue;
    used.add(n); picks.push(p);
  }
  if(picks.length<2 && DICT){
    const keys = Object.keys(DICT);
    for(let i=0;i<200 && picks.length<2;i++){
      const s = dictSensesOf(keys[Math.floor(Math.random()*keys.length)])[0];
      if(!s || s.length>16) continue;
      const n = normZh(s);
      if(!n || used.has(n)) continue;
      used.add(n); picks.push(s);
    }
  }
  while(picks.length<2) picks.push('……');
  return shuffle([right, ...picks].slice(0,3));
}

function learnNext(){
  if(!learn) return;
  const it = byId(learn.ids[learn.idx]);
  const pi = LEARN_PHASES.indexOf(learn.phase);
  learn.revealed = false;
  learn.quiz = null;
  learn.text = '';
  if(pi < LEARN_PHASES.length-1){
    learn.phase = LEARN_PHASES[pi+1];
  }else{
    if(learn.copy && it){
      it.errCount = (it.errCount||0)+1;
      // 错词重排：拼写吃力的词排到队尾再来一遍
      learn.requeued = learn.requeued || {};
      if(!learn.requeued[it.id]){
        learn.requeued[it.id] = true;
        learn.ids.push(it.id);
      }
    }
    learn.copy = false;
    learn.idx++;
    learn.phase = 'meet';
  }
  renderLearn();
}

/** 记录拼错位置的字母，累计成热力图 */
function bumpHeat(correct, typed){
  const t = normEn(typed);
  if(!t) return;
  if(!S.spellHeat) S.spellHeat = {};
  const c = normEn(correct);
  for(let i=0;i<c.length;i++){
    const ch = c[i];
    if(ch<'a' || ch>'z') continue;
    if(t[i] !== ch) S.spellHeat[ch] = (S.spellHeat[ch]||0)+1;
  }
}

function spellCheck(){
  if(!learn) return;
  const it = byId(learn.ids[learn.idx]);
  if(!it) return;
  if(!String(learn.text||'').trim()){ toast('先用键盘拼出单词'); return; }
  if(normEn(learn.text) === normEn(it.en)){
    learn.text = '';
    learn.copy = false;
    learnNext();
    return;
  }
  bumpHeat(it.en, learn.text);
  learn.tries[it.id] = (learn.tries[it.id]||0) + 1;
  learn.text = '';
  if(learn.tries[it.id] >= 3){
    learn.copy = true;
    renderLearn();
    toast('连错 3 次，照着正确拼写再打一遍');
  }else{
    renderLearn();
    toast(learn.copy ? '再仔细看一遍正确拼写' : '不对哦，还有 '+(3-learn.tries[it.id])+' 次机会');
  }
}

function finishLearn(){
  const ids = learn ? learn.ids.slice() : [];
  learn = null;
  const t = today();
  let n = 0;
  ids.forEach(id=>{
    const it = byId(id);
    if(!it) return;
    it.learned = true;
    it.stage = 0; it.maxStage = 0;
    it.nextDate = addD(t,1);
    it.updatedAt = Date.now();
    n++;
  });
  if(n){
    const d = S.days[t] || {ans:0, right:0, items:0};
    S.days[t] = {ans:d.ans||0, right:d.right||0, items:d.items||0};
  }
  save();
  goHome();
  if(n) toast('今天学了 '+n+' 个新词，明天开始复习');
}

/* ============================================================
   10. 默写键盘（应用内自绘，不唤起系统输入法）
   ============================================================ */
function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function keyboardHTML(okLabel){
  const rows = ['qwertyuiop','asdfghjkl','zxcvbnm'];
  let h = '<div class="kbdpan">';
  rows.forEach((row,ri)=>{
    h += '<div class="kb-row">';
    for(const c of row) h += `<button class="kb-key" data-kb="${c}">${c}</button>`;
    if(ri===2) h += '<button class="kb-key fn" data-kb="del">⌫</button>';
    h += '</div>';
  });
  h += `<div class="kb-row">
    <button class="kb-key fn" data-kb="'">'</button>
    <button class="kb-key fn" data-kb="-">-</button>
    <button class="kb-key fn" data-kb=".">.</button>
    <button class="kb-key fn" data-kb="space" style="flex:2.6">空格</button>
    <button class="kb-key go" data-kb="ok" style="flex:2.2">${okLabel||'确认'}</button>
  </div></div>`;
  return h;
}
function paintTyped(el, text, ph){
  if(!el) return;
  el.innerHTML = (text ? esc(text) : '<span class="ph">'+esc(ph||'')+'</span>')
    + '<span class="caret"></span>';
}
let kbSaveT = null;
function kbInput(k){
  let st = null;
  if(exam){
    const it = byId(exam.ids[exam.ptr]);
    if(!it) return;
    st = examAnswer(it);
  }else if(learn){
    st = learn;
  }else return;

  if(k==='ok'){ if(exam) nextQ(); else spellCheck(); return; }

  let txt = st.text || '';
  if(k==='del') txt = txt.slice(0,-1);
  else if(k==='space') txt = txt + ' ';
  else txt = txt + k;
  if(txt.length > 48) return;
  st.text = txt;
  paintTyped($('#typeBox'), st.text, '用下面的键盘输入');
  if(exam){
    clearTimeout(kbSaveT);
    kbSaveT = setTimeout(()=>{ S.exam = exam; save(); }, 800);
  }
}

/* ============================================================
   11. 复习考试（批量作答，交卷统一批改）
   ============================================================ */
let exam = null;

function examDirAt(i){
  const q = exam.qmode || 'alternate';
  if(q==='listen') return 'listen';
  if(q==='zh2en') return 'zh2en';
  if(q==='mix'){
    const r = i % 3;
    return r===0 ? 'zh2en' : (r===1 ? 'listen' : 'en2zh');
  }
  return i % 2 === 0 ? 'zh2en' : 'en2zh';
}

function examAnswer(it){
  if(!exam.ans) exam.ans = {};
  let a = exam.ans[it.id];
  if(!a){
    const idx = Math.max(0, exam.ids.indexOf(it.id));
    a = exam.ans[it.id] = {dir: examDirAt(idx), text:'', picks:[], revealed:false, ms:0, t0:0, played:false};
  }
  if(!Array.isArray(a.picks)) a.picks = [];
  if(a.dir==='en2zh' && !a.cands) a.cands = zhCands(it);
  if(!a.t0) a.t0 = Date.now();
  return a;
}

/** 离开当前题时结算用时 */
function stampAnswer(){
  if(!exam) return;
  const it = byId(exam.ids[exam.ptr]);
  if(!it || !exam.ans) return;
  const a = exam.ans[it.id];
  if(a && a.t0){ a.ms = (a.ms||0) + (Date.now()-a.t0); a.t0 = 0; }
}

function zhCands(it){
  const right = splitSenses(it.zh);
  const used = new Set(right.map(normZh));
  const picks = [];
  const pool = [];
  S.items.forEach(x=>{
    if(x.id===it.id) return;
    splitSenses(x.zh).forEach(s=>pool.push(s));
  });
  shuffle(pool);
  for(const p of pool){
    if(picks.length>=3) break;
    const n = normZh(p);
    if(!n || used.has(n)) continue;
    used.add(n); picks.push(p);
  }
  if(picks.length<3 && DICT){
    const keys = Object.keys(DICT);
    for(let i=0;i<300 && picks.length<3;i++){
      const s = dictSensesOf(keys[Math.floor(Math.random()*keys.length)])[0];
      if(!s || s.length>16) continue;
      const n = normZh(s);
      if(!n || used.has(n)) continue;
      used.add(n); picks.push(s);
    }
  }
  return shuffle(right.concat(picks));
}

function judgePicks(picks, it){
  const wantRaw = splitSenses(it.zh);
  const want = wantRaw.map(normZh);
  const got = (picks||[]).map(normZh).filter(Boolean);
  if(!got.length) return {r:'empty'};
  const missIdx = [];
  want.forEach((w,i)=>{ if(got.indexOf(w)<0) missIdx.push(i); });
  const extra = got.filter(g=>want.indexOf(g)<0);
  if(!missIdx.length && !extra.length) return {r:'right'};
  return {r:'wrong', missing:missIdx.map(i=>wantRaw[i]), extra};
}

function startReview(){
  if(S.exam && S.exam.date===today() && !S.exam.done && Array.isArray(S.exam.ids) && S.exam.ids.length){
    exam = S.exam;
    exam.ans = exam.ans || {};
    exam.ptr = exam.ptr || 0;
  }else{
    const paper = buildPaper();
    if(!paper.ids.length){ toast('今天没有要复习的词'); return; }
    if(S.meta.deferDate!==today()){
      S.meta.deferStreak = paper.deferred>0 ? (S.meta.deferStreak||0)+1 : 0;
      S.meta.deferDate = today();
    }
    exam = { mode:'exam', qmode: S.settings.listenInExam?'mix':'alternate', ids:paper.ids, ans:{}, ptr:0, date:today(), done:false,
             deferred:paper.deferred, total:0, right:0, results:null };
    S.exam = exam; save();
  }
  showScreen('review');
  renderExam();
}

function renderExam(){
  const box = $('#reviewStage');
  if(!exam){ goHome(); return; }
  if(exam.ptr < 0) exam.ptr = 0;
  if(exam.ptr >= exam.ids.length){ renderResults(); return; }
  const it = byId(exam.ids[exam.ptr]);
  if(!it){ exam.ptr++; return renderExam(); }

  const a = examAnswer(it);
  const dir = a.dir;
  const total = exam.ids.length;
  $('#reviewTitle').textContent = exam.mode==='drill' ? '难词专项'
    : exam.mode==='retry' ? '错题重做'
    : exam.mode==='free' ? '自由复习' : '默写复习';
  $('#reviewCount').textContent = (exam.ptr+1)+' / '+total;
  const pct = Math.round(exam.ptr/total*100);
  const doneN = exam.ids.filter(id=>{
    const x = exam.ans[id];
    if(!x) return false;
    return x.dir==='en2zh' ? (x.picks||[]).length>0 : !!String(x.text||'').trim();
  }).length;

  let card = '';
  if(dir==='zh2en'){
    card = `<div class="bigcard kbd">
      <div class="hintline" style="margin-top:0">看释义，写出对应的英文</div>
      <div class="zhprompt">${splitSenses(it.zh).map(esc).join('；')}</div>
      <div class="typebox" id="typeBox"></div>
    </div>
    ${keyboardHTML(exam.ptr+1>=total ? '交卷' : '下一题')}`;
  }
  else if(dir==='listen'){
    card = `<div class="bigcard kbd">
      <div style="text-align:center;padding-top:8px">
        <button class="speakbtn" style="width:68px;height:68px;margin:0 auto" data-act="speak" data-w="${esc(it.en)}">${IC_SPK_BIG}</button>
        <div class="hintline">听发音，拼出这个单词</div>
      </div>
      <div class="typebox" id="typeBox"></div>
    </div>
    ${keyboardHTML(exam.ptr+1>=total ? '交卷' : '下一题')}`;
  }
  else{
    const hideChips = S.settings.recallFirst && !a.revealed;
    card = `<div class="bigcard learning">
      <div style="text-align:center">
        <div class="word small">${esc(it.en)}</div>
        ${phonOf(it.en)?`<div class="phon">/${esc(phonOf(it.en))}/</div>`:''}
        <button class="speakbtn" data-act="speak" data-w="${esc(it.en)}">${IC_SPK}</button>
      </div>
      ${hideChips
        ? `<div class="hintline" style="margin-top:16px">先在心里回想它的释义</div>
           <button class="btn primary" style="margin-top:18px;width:100%" data-act="showPicks">想好了，看选项</button>`
        : `<div class="hintline" style="margin-top:12px">选出全部正确的中文释义${splitSenses(it.zh).length>1?'（共 '+splitSenses(it.zh).length+' 个）':''}</div>
           <div class="chips">${(a.cands||[]).map((c,k)=>
             `<button class="chip ${a.picks.indexOf(c)>=0?'on':''}" data-pick="${k}">${esc(c)}</button>`).join('')}</div>`}
    </div>`;
  }

  box.innerHTML = `<div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="examtip">已作答 ${doneN} / ${total}</div>
    ${card}
    <div class="actions" style="padding-bottom:calc(12px + env(safe-area-inset-bottom))">
      <button class="btn" data-act="prevQ" ${exam.ptr===0?'disabled':''} style="flex:0 0 32%">上一题</button>
      ${exam.ptr+1>=total
        ? `<button class="btn ok" data-act="grade">交卷</button>`
        : `<button class="btn primary" data-act="nextQ">下一题</button>`}
    </div>`;

  if(dir==='zh2en' || dir==='listen') paintTyped($('#typeBox'), a.text, dir==='listen'?'凭听音拼写':'用下面的键盘输入');
  if(dir==='listen' && !a.played){
    a.played = true;
    setTimeout(()=>speak(it.en), 220);
  }
  if(dir==='en2zh' && S.settings.autoSpeak && exam.spokenFor !== it.id){
    exam.spokenFor = it.id;
    setTimeout(()=>speak(it.en, true), 260);
  }
}

function togglePick(k){
  if(!exam) return;
  const it = byId(exam.ids[exam.ptr]);
  if(!it) return;
  const a = examAnswer(it);
  const c = (a.cands||[])[k];
  if(c==null) return;
  const i = a.picks.indexOf(c);
  if(i>=0) a.picks.splice(i,1); else a.picks.push(c);
  if(exam.mode==='exam') S.exam = exam;
  save();
  renderExam();
}

function prevQ(){
  if(!exam || exam.ptr<=0) return;
  stampAnswer();
  exam.ptr--;
  if(exam.mode==='exam') S.exam = exam;
  save();
  renderExam();
}
function nextQ(){
  if(!exam) return;
  if(exam.ptr+1 >= exam.ids.length){ gradeExam(); return; }
  stampAnswer();
  exam.ptr++;
  if(exam.mode==='exam') S.exam = exam;
  save();
  renderExam();
}

function applyReview(it,res){
  const t = today();
  if(res.r==='right'){
    it.streak++;
    it.officialTestCount++;
    it.officialRightCount++;
    it.stage = Math.min(it.stage+1, TOTAL_STAGE);
    if(it.streak>=2 && it.stage<it.maxStage) it.stage = it.maxStage;
    it.maxStage = Math.max(it.maxStage, it.stage);
    if(it.stage>=TOTAL_STAGE && it.officialRightCount>=8 && it.streak>=2){
      it.status='graduated'; it.nextDate='';
    }else{
      it.nextDate = addD(t, GAPS[Math.min(it.stage,GAPS.length-1)]);
    }
  }else if(res.r!=='empty'){
    it.errCount++; it.streak=0; it.stage=0;
    it.officialTestCount++;
    it.nextDate = addD(t,1);
  }
}

function gradeExam(){
  if(!exam) return;
  stampAnswer();
  const blank = exam.ids.filter(id=>{
    const a = exam.ans[id];
    if(!a) return true;
    return a.dir==='en2zh' ? !(a.picks||[]).length : !String(a.text||'').trim();
  });
  if(blank.length && !confirm('还有 '+blank.length+' 题没作答，确定交卷？')) return;

  const rows = [];
  let right = 0;
  exam.ids.forEach(id=>{
    const it = byId(id);
    if(!it) return;
    const idx = Math.max(0, exam.ids.indexOf(id));
    const a = exam.ans[id] || {dir: examDirAt(idx), text:'', picks:[]};
    const res = a.dir==='en2zh' ? judgePicks(a.picks, it) : judgeEn(a.text, it);
    if(res.r==='right') right++;
    if(res.r!=='right' && (a.dir==='zh2en' || a.dir==='listen')) bumpHeat(it.en, a.text);

    if(exam.mode==='drill'){
      it.drillCount = (it.drillCount||0)+1;
      if(res.r==='right') it.drillRight = (it.drillRight||0)+1;
    }else if(exam.mode==='free'){
      it.freeCount = (it.freeCount||0)+1;
    }else{
      applyReview(it, res);
    }
    it.totalAnswerCount = (it.totalAnswerCount||0)+1;
    pushHist(it, {d:today(), s:it.stage, r:res.r, mode:exam.mode, dir:a.dir,
      a:String(a.text || (a.picks||[]).join('、') || '').slice(0,40)});
    it.updatedAt = Date.now();

    rows.push({id, dir:a.dir, r:res.r, text:a.text||'', picks:a.picks||[], missing:res.missing||[], ms:a.ms||0});
  });

  exam.total = rows.length;
  exam.right = right;
  exam.results = rows;
  exam.done = true;

  if(exam.mode==='exam'){
    const t = exam.date || today();
    const prev = S.days[t] || {};
    S.days[t] = {
      ans: (prev.ans||0) + rows.length,
      right: (prev.right||0) + right,
      items: Math.max(prev.items||0, new Set(exam.ids).size)
    };
  }
  S.exam = null;
  save();
  renderResults();
}

function renderResults(){
  const rows = (exam && exam.results) || [];
  const total = rows.length;
  const right = rows.filter(r=>r.r==='right').length;
  const acc = total ? Math.round(right/total*100) : 100;
  const wrong = rows.filter(r=>r.r!=='right');
  const color = acc>=80 ? 'var(--ok)' : acc>=60 ? 'var(--brand)' : 'var(--bad)';
  $('#reviewTitle').textContent = '交卷结果';
  $('#reviewCount').textContent = right+' / '+total;

  const list = rows.map(r=>{
    const it = byId(r.id);
    if(!it) return '';
    const ok = r.r==='right';
    let detail = '';
    if(!ok){
      if(r.dir==='zh2en' || r.dir==='listen'){
        detail = `<div style="color:var(--bad);font-size:12.5px;margin-top:2px">你的答案：${r.text?esc(r.text):'（空）'}　正确：<b>${esc(it.en)}</b></div>`;
      }else{
        detail = `<div style="color:var(--bad);font-size:12.5px;margin-top:2px">${r.r==='empty'?'未作答':'漏选：'+r.missing.map(esc).join('、')}　正确：${esc(it.zh)}</div>`;
      }
    }
    return `<div class="ritem">
      <span class="rstat" style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?'✓':'✗'}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:650">${esc(it.en)} <span style="font-size:12px;font-weight:400;color:var(--ink3)">${esc(it.zh)}</span></div>
        ${detail}
      </div></div>`;
  }).join('');

  const totalMs = rows.reduce((s,r)=>s+(r.ms||0),0);
  const avgS = total ? Math.round(totalMs/total/1000) : 0;
  const mm = Math.floor(totalMs/60000), ss = Math.round((totalMs%60000)/1000);

  $('#reviewStage').innerHTML = `
    <div class="pbar"><i style="width:100%"></i></div>
    <div style="flex:1;overflow-y:auto;min-height:0">
      <div style="text-align:center;padding:14px 0 4px">
        <div style="font-size:46px;font-weight:750;color:${color};letter-spacing:-1px">${acc}%</div>
        <div class="phon" style="margin-top:0">正确率　${right} / ${total}</div>
        <div style="font-size:12px;color:var(--ink3);margin-top:5px">用时 ${mm} 分 ${ss} 秒 · 平均 ${avgS} 秒/题</div>
      </div>
      ${wrong.length
        ? `<div class="examtip" style="color:var(--warn);margin-top:6px">有 ${wrong.length} 个没过${exam.mode==='free'?'，可以重做错题再练一遍':'，明天还会出现'}</div>`
        : `<div class="examtip" style="color:var(--ok);margin-top:6px">全部正确，继续保持</div>`}
      <div class="rlist">${list}</div>
    </div>
    <div class="actions" style="padding-bottom:calc(12px + env(safe-area-inset-bottom))">
      ${wrong.length && exam.mode!=='retry'
        ? `<button class="btn" data-act="retryWrong" style="flex:0 0 44%">重做错题 ${wrong.length}</button>` : ''}
      <button class="btn primary" data-act="doneExam">完成</button>
    </div>`;
}

function retryWrong(){
  if(!exam) return;
  const ids = (exam.results||[]).filter(r=>r.r!=='right').map(r=>r.id);
  if(!ids.length){ toast('没有错题'); return; }
  exam = {mode:'retry', qmode:'alternate', ids, ans:{}, ptr:0, date:today(), done:false, deferred:0, total:0, right:0, results:null};
  renderExam();
}

function doneExam(){
  exam = null;
  S.exam = null;
  save();
  goHome();
}

const CAUSES = ['概念不清','计算错','审题错','粗心','完全不会'];

/* ---------- 位置解析：练习册十一页5 → P11-5 ---------- */
function cnNum(s){
  s = String(s||'').trim();
  if(/^\d+$/.test(s)) return Number(s);
  const map = {零:0,一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
  let total = 0, cur = 0;
  for(const ch of s){
    if(ch==='十'){ total += (cur||1)*10; cur = 0; }
    else if(ch==='百'){ total += (cur||1)*100; cur = 0; }
    else if(map[ch] != null){ cur = map[ch]; }
  }
  return total + cur;
}
function parseLoc(text){
  const t = String(text||'');
  let page = 0, no = '', book = '';
  let m = t.match(/(\d{1,3})\s*[-–.．]\s*(\d{1,3})/);
  if(m && /[页Pp]/.test(t)){ page = Number(m[1]); no = m[2]; }
  if(!page){
    m = t.match(/(?:第)?([一二三四五六七八九十百零两\d]+)\s*页/);
    if(m) page = cnNum(m[1]);
  }
  if(!no){
    m = t.match(/页\s*(?:第)?([一二三四五六七八九十百零两\d]+)/);
    if(m) no = String(cnNum(m[1]));
  }
  if(!no){
    m = t.match(/第\s*([一二三四五六七八九十百零两\d]+)\s*题/);
    if(m) no = String(cnNum(m[1]));
  }
  if(!no && page){
    m = t.match(/页\s*(\d{1,3})/);
    if(m) no = m[1];
  }
  const bm = t.match(/^(.{1,14}?)(?:第?[一二三四五六七八九十百零两\d]+\s*页|第?[一二三四五六七八九十百零两\d]+\s*题)/);
  if(bm) book = bm[1].replace(/^今日错题/,'').replace(/^第+/,'').trim();
  return {page, no, book};
}
function locLabel(m){
  const book = String(m.book||'').replace(/^第/,'').trim();
  if(m.page) return (book?book+' ':'')+'P'+m.page+(m.no?'-'+m.no:'');
  if(m.no) return (book?book+' ':'')+'第'+m.no+'题';
  return String(m.text||'').slice(0,10);
}
function misSort(a,b){
  const sa = subjIdx(a.subject), sb = subjIdx(b.subject);
  if(sa!==sb) return sa-sb;
  const pa = a.page||9999, pb = b.page||9999;
  if(pa!==pb) return pa-pb;
  const na = Number(a.no)||9999, nb = Number(b.no)||9999;
  if(na!==nb) return na-nb;
  return (a.created||'').localeCompare(b.created||'');
}

function dueMistakes(){
  const t = today();
  return S.mistakes.filter(m=>!m.done && m.nextDate && m.nextDate<=t).sort(misSort);
}
function overdueDays(m){
  if(!m || m.done || !m.nextDate) return 0;
  const t = today();
  if(m.nextDate >= t) return 0;
  return Math.round((new Date(t) - new Date(m.nextDate)) / 86400000);
}
function overdueCount(){
  return S.mistakes.filter(m=>!m.done && overdueDays(m)>0).length;
}
function subjIdx(s){ const i = SUBJECTS.indexOf(s); return i<0?0:i; }

function makeMistake(subject, text, answer, tag, cause, img, book, topic, derived){
  const t = today();
  const loc = parseLoc(text);
  return {
    id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    subject, text, answer:answer||'', tag:tag||'', cause:cause||'', img:img||'',
    book: book || loc.book || '', page:loc.page, no:loc.no,
    topic: topic||'', derived: Array.isArray(derived)?derived:[],
    fav:false, failCount:0,
    created:t, stage:0, reviews:0,
    nextDate: addD(t, mistakeGaps()[0]), done:false, finishedAt:'',
    history:[], updatedAt:Date.now()
  };
}

function misMatch(m){
  const q = misFilter.q.trim().toLowerCase();
  if(misFilter.fav && !m.fav) return false;
  if(misFilter.subject && m.subject !== misFilter.subject) return false;
  if(misFilter.book && (m.book||'') !== misFilter.book) return false;
  if(misFilter.topic && (m.topic||'') !== misFilter.topic) return false;
  if(misFilter.cause && (m.cause||'') !== misFilter.cause) return false;
  if(q){
    const hay = [m.text, m.answer||'', m.tag||'', m.subject, m.topic||'', (m.derived||[]).join(' '), locLabel(m)].join(' ').toLowerCase();
    if(hay.indexOf(q) < 0) return false;
  }
  return true;
}
function filteredActive(){
  return S.mistakes.filter(m=>!m.done && misMatch(m)).sort(misSort);
}

function fmtD(d){
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function weeklyMistakeTrend(){
  const out = [];
  const now = new Date(today());
  for(let i=5;i>=0;i--){
    const end = new Date(now); end.setDate(now.getDate() - i*7);
    const start = new Date(end); start.setDate(end.getDate() - 6);
    const sd = fmtD(start), ed = fmtD(end);
    const add = S.mistakes.filter(m=>(m.created||'')>=sd && (m.created||'')<=ed).length;
    const done = S.mistakes.filter(m=>(m.finishedAt||'')>=sd && (m.finishedAt||'')<=ed).length;
    out.push({label: sd.slice(5)+'~'+ed.slice(5), add, done});
  }
  const max = Math.max(1, ...out.map(w=>w.add), ...out.map(w=>w.done));
  out.forEach(w=>{ w.addPct = Math.round(w.add/max*100); w.donePct = Math.round(w.done/max*100); });
  return out;
}

function parseMistakeLine(line, defSub){
  let s = String(line).trim();
  if(!s) return null;
  const tags = [];
  let mm;
  while((mm = s.match(/(?:^|\s)#([^\s#]+)\s*$/))){ tags.unshift(mm[1]); s = s.slice(0,mm.index).trim(); }
  let sub = '', txt = s;
  const sm = s.match(/^(语文|数学|英语|物理|化学|地理)\s*[:：]\s*(.+)$/);
  if(sm){ sub = sm[1]; txt = sm[2].trim(); }
  let note = '';
  const parts = txt.split(/\s*(?:⇒|=>|→)\s*/);
  if(parts.length >= 2){ txt = parts[0].trim(); note = parts.slice(1).join(' ⇒ ').trim(); }
  if(!txt) return null;
  return {subject: sub || defSub, text: txt, answer: note, tag: tags[0]||''};
}

function splitDerived(s){
  return String(s||'').split(/[,，、;；\s]+/).map(x=>x.trim()).filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).slice(0,12);
}

function doAddMistake(){
  const box = $('#misBox');
  const raw = (box && box.value || '').trim();
  if(!raw){ toast('先输入错题'); return; }
  const defSub = S.settings.lastSubject || '物理';
  const book = (($('#addBook') && $('#addBook').value) || '').trim();
  const topic = (($('#addTopic') && $('#addTopic').value) || '').trim();
  const derived = splitDerived(($('#addDerived') && $('#addDerived').value) || '');
  if(book){
    S.settings.lastBook = S.settings.lastBook || {};
    S.settings.lastBook[defSub] = book;
  }
  if(topic){
    S.settings.lastTopic = S.settings.lastTopic || {};
    S.settings.lastTopic[defSub] = topic;
  }
  const ok = [];
  let bad = 0;
  raw.split(/\r?\n/).filter(l=>l.trim()).forEach(line=>{
    const p = parseMistakeLine(line, defSub);
    if(!p || !p.subject || !p.text){ bad++; return; }
    ok.push(p);
  });
  let dupN = 0;
  const fresh = ok.filter(p=>{
    const loc = parseLoc(p.text);
    const useBook = book || loc.book || '';
    if(!loc.page) return true;
    const hit = S.mistakes.some(m=>!m.done && m.subject===p.subject && (m.book||'')===useBook
      && m.page===loc.page && String(m.no||'')===String(loc.no||''));
    if(hit){ dupN++; return false; }
    return true;
  });
  fresh.forEach((p,i)=>S.mistakes.push(makeMistake(p.subject, p.text, p.answer, p.tag, '', i===0?addImg:'', book, topic, derived)));
  save();
  closeSheet();
  renderAll();
  let msg = `已录入 ${fresh.length} 道`;
  if(dupN) msg += `，跳过重复 ${dupN}`;
  if(bad) msg += `，${bad} 行无法识别`;
  toast(msg);
}

function pickImage(cb){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.setAttribute('capture','environment');
  inp.onchange = ()=>{
    const f = inp.files && inp.files[0];
    if(!f) return;
    resizeImage(f, cb);
  };
  inp.click();
}
function resizeImage(file, cb){
  const r = new FileReader();
  r.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const max = 900;
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.width*k));
      cv.height = Math.max(1, Math.round(img.height*k));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', 0.62));
    };
    img.onerror = ()=>toast('图片读取失败');
    img.src = r.result;
  };
  r.onerror = ()=>toast('图片读取失败');
  r.readAsDataURL(file);
}

  if(!mrev) return;

  const t = today();
  m.reviews = (m.reviews||0)+1;
  m.history = (m.history||[]).slice(-30);
  m.history.push({d:t, ok: level==='ok', level});
  if(level==='ok'){
    mrev.counts.ok++;
    m.stage = (m.stage||0)+1;
    if(m.stage >= mistakeGaps().length){
      m.done = true; m.nextDate = ''; m.finishedAt = t;
    }else{
      m.nextDate = addD(t, mistakeGaps()[m.stage]);

}

let examSel = {subject:'', book:'', only:'all', rounds:'all', range:'all', topic:''};
function examListItems(sel){
  const s = sel || examSel;
  return S.mistakes.filter(m=>{
    if(m.done) return false;
    if(s.subject && m.subject !== s.subject) return false;
    if(s.book && (m.book||'') !== s.book) return false;
    if(s.topic && (m.topic||'') !== s.topic) return false;
    if(s.range && s.range !== 'all'){
      const days = Number(s.range) || 0;
      if(days && (m.created||'') < addD(today(), -(days-1))) return false;
    }
    if(s.only==='fav' && !m.fav) return false;
    if(s.only==='stuck' && (m.failCount||0) < 2) return false;
    if(s.only==='overdue' && !(overdueDays(m) > 0)) return false;
    if(s.only==='due' && !(m.nextDate && m.nextDate <= today())) return false;
    const round = Math.min((m.stage||0)+1, mistakeGaps().length);
    if(s.rounds==='early' && round > 2) return false;
    if(s.rounds==='late' && round < 3) return false;
    return true;
  }).sort(misSort);
}
function countBy(list, getter){
  const cnt = {};
  list.forEach(m=>{
    const v = getter(m);
    if(!v) return;
    if(Array.isArray(v)) v.forEach(x=>{ if(x) cnt[x] = (cnt[x]||0)+1; });
    else cnt[v] = (cnt[v]||0)+1;
  });
  return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).map(k=>({k, n:cnt[k]}));
}
function locShort(m){
  if(m.page) return 'P'+m.page+(m.no?'-'+m.no:'');
  if(m.no) return '第'+m.no+'题';
  return String(m.text||'').slice(0,12);
}
function examListText(){
  const list = examListItems();
  if(!list.length) return '';
  const groups = {};
  list.forEach(m=>{
    const key = m.subject + (m.book ? ' · '+m.book : '');
    (groups[key] = groups[key] || []).push(m);
  });
  const lines = Object.keys(groups).map(k=>`【${k}】`+
    groups[k].map(m=>`${locShort(m)}（第${Math.min((m.stage||0)+1, mistakeGaps().length)}/${mistakeGaps().length}遍）`).join('　')
  );
  const tSum = countBy(list, m=>m.topic||'');
  const dSum = countBy(list, m=>m.derived||[]);
  if(tSum.length) lines.push('', '— 知识点 —', tSum.map(x=>x.k+'（'+x.n+'）').join('、'));
  if(dSum.length) lines.push('', '— 衍生知识点 —', dSum.map(x=>x.k+'（'+x.n+'）').join('、'));
  return lines.join('\n');
}

function heatCells(){
  const letters = 'abcdefghijklmnopqrstuvwxyz'.split('');
  const heat = S.spellHeat || {};
  const max = Math.max(1, ...letters.map(l=>heat[l]||0));
  return letters.map(l=>{
    const n = heat[l]||0;
    if(!n) return `<i>${l}</i>`;
    const r = n/max;
    const a = 0.15 + 0.85*r;
    return `<i class="${r>0.45?'hot':''}" style="background:rgba(229,72,77,${a.toFixed(2)})">${l}</i>`;
  }).join('');
}

function restoreSnap(i){
  const s = snapshots()[Number(i)];
  if(!s) return;
  if(!confirm('用 '+s.d+' 的快照覆盖当前数据？当前进度会丢失')) return;
  try{
    const o = JSON.parse(s.data);
    S.items = Array.isArray(o.items) ? o.items : [];
    S.days = o.days || {};
    S.settings = Object.assign(S.settings, o.settings || {});
    S.clockOffset = o.clockOffset || 0;
    S.meta = Object.assign(S.meta, o.meta || {});
    S.mistakes = Array.isArray(o.mistakes) ? o.mistakes : [];
    S.spellHeat = o.spellHeat || {};
    S.exam = null;
    save(); applyTheme(); closeSheet(); renderAll();
    toast('已恢复到 '+s.d);
  }catch(e){ toast('快照已损坏'); }

async function toggleReminder(){
  if(!S.settings.reminder){
    S.settings.reminder = true;
    save();
    const ok = await scheduleReminder();
    if(!ok) toast('网页版不支持本地通知，装机后可用');
  }else{
    S.settings.reminder = false;
    save();
    const LN = capPlugin('LocalNotifications');
    if(LN){ try{ await LN.cancel({notifications:[{id:1}]}); }catch(e){} }
    toast('已关闭提醒');
  }
  renderMe();
}
async function scheduleReminder(){
  const LN = capPlugin('LocalNotifications');
  if(!LN) return false;
  try{
    let p = await LN.checkPermissions();
    if(!p || p.display!=='granted') p = await LN.requestPermissions();
    if(!p || p.display!=='granted'){ S.settings.reminder=false; save(); toast('没有通知权限'); return false; }
    const hm = String(S.settings.remindTime||'20:00').split(':').map(Number);
    try{ await LN.cancel({notifications:[{id:1}]}); }catch(e){}
    await LN.schedule({notifications:[{
      id:1, title:'温故', body:'今天还有单词和错题要复习，来温故一下吧',
      schedule:{on:{hour:hm[0]||20, minute:hm[1]||0}, repeats:true, allowWhileIdle:true}
    }]});
    return true;
  }catch(e){ return false; }
}

function streak(){
  let t = today();
  if(!S.days[t]) t = addD(t,-1);
  let n = 0;
  while(S.days[t]){ n++; t = addD(t,-1); }
  return n;
}

async function doAdd(){
  const box = $('#addBox');
  const raw = (box.value||'').trim();
  if(!raw){ toast('先输入内容'); return; }
  await loadDict();

  const lines = raw.split(/\r?\n/).filter(l=>l.trim());
  const ok=[], dup=[], bad=[];
  let autoZh = 0;

  for(const line of lines){
    const p = parseLine(line);
    if(!p){ bad.push(line.trim()); continue; }
    if(S.items.some(i=>normEn(i.en)===normEn(p.en)) || ok.some(x=>normEn(x.en)===normEn(p.en))){ dup.push(p.en); continue; }

    let zh = p.zh;
    if(!zh){
      const ds = dictSensesOf(p.en);
      if(ds.length){ zh = ds.slice(0,MAX_FILL_SENSES).join('；'); autoZh++; }
    }
    if(!zh){ bad.push(p.en); continue; }
    ok.push({en:p.en, zh, tags:p.tags});
  }

  ok.forEach(p=>{
    S.items.push(makeItem(p.en, p.zh, p.tags));
  });
  save();
  renderAll();

  let msg = `已导入 ${ok.length} 个`;
  if(autoZh) msg += `（自动翻译 ${autoZh} 个）`;
  if(dup.length) msg += `，跳过重复 ${dup.length}`;
  if(bad.length) msg += `，未识别 ${bad.length}（${bad.slice(0,3).join('、')}）`;
  toast(msg);
  if(ok.length) closeSheet();
}

function parseLine(line){
  let s = String(line).trim();
  if(!s) return null;
  const tags = [];
  let m;
  while((m = s.match(/(?:^|\s)#([^\s#]+)\s*$/))){ tags.unshift(m[1]); s = s.slice(0,m.index).trim(); }
  if(!s) return null;
  const toks = s.split(/\s+/);
  const i = toks.findIndex(t=>CJK.test(t));
  if(i>0) return {en:toks.slice(0,i).join(' '), zh:toks.slice(i).join(' '), tags};
  if(i===0) return null;
  if(!/^[A-Za-z][A-Za-z\s'\u2019.\-]*$/.test(s)) return null;
  return {en:s, zh:'', tags};
}

async function lookupFill(){
  const box = $('#addBox');
  if(!box) return;
  const lines = (box.value||'').split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length){ toast('先粘贴单词，一行一个'); return; }
  await loadDict();
  let filled=0, miss=0;
  const out = lines.map(line=>{
    const p = parseLine(line);
    if(!p) return line;
    let zh = p.zh;
    if(!zh){
      const ds = dictSensesOf(p.en);
      if(ds.length){ zh = ds.slice(0,MAX_FILL_SENSES).join('；'); filled++; }
      else miss++;
    }
    return p.en + (zh ? ' '+zh : '') + (p.tags.length ? ' '+p.tags.map(t=>'#'+t).join(' ') : '');
  });
  box.value = out.join('\n');
  toast(`翻译 ${filled} 个${miss?`，${miss} 个没查到`:''}`);
}
