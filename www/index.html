<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2b6cf6">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>温故</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#12151c; --ink2:#5b6472; --ink3:#9aa3b2;
  --line:#e8ebf1; --brand:#2b6cf6; --brand2:#1d55cc; --brandSoft:#eaf0ff;
  --ok:#0f9d58; --okSoft:#e6f6ee; --bad:#e5484d; --badSoft:#fdecec;
  --warn:#c47f0a; --warnSoft:#fdf4e3;
  --r:14px; --r2:20px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.05);
}
body.dark{
  --bg:#0f1116; --card:#181b22; --ink:#e9ecf1; --ink2:#a2abb8; --ink3:#6d7684;
  --line:#262b34; --brand:#5b8cff; --brand2:#7aa3ff; --brandSoft:#1a2440;
  --ok:#3ec27a; --okSoft:#13291e; --bad:#f2737a; --badSoft:#33191b;
  --warn:#e0a33c; --warnSoft:#2c2416;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 88px}
.pad{padding:0 16px}

/* ---------- 顶栏 ---------- */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px 16px 10px;
  padding-top:calc(14px + env(safe-area-inset-top));
}
.topbar h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.2px}
.topbar .sp{flex:1}
.iconbtn{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.iconbtn:active{transform:scale(.95)}

/* ---------- 首页 ---------- */
.hero{
  background:linear-gradient(135deg,var(--brand),#6f5cf5);color:#fff;border-radius:var(--r2);
  padding:22px 20px;margin:6px 0 14px;box-shadow:0 10px 24px rgba(43,108,246,.28);
}
.hero .d{font-size:12.5px;opacity:.85}
.hero .big{font-size:44px;font-weight:750;line-height:1.15;margin-top:6px;letter-spacing:-1px}
.hero .sub{font-size:13px;opacity:.9;margin-top:2px}
.hero .row{display:flex;gap:10px;margin-top:16px}
.hero button{flex:1;height:44px;border-radius:12px;background:#fff;color:var(--brand);
  font-weight:650;font-size:15px}
.hero button.ghost{background:rgba(255,255,255,.18);color:#fff;flex:0 0 42%}
.hero button:active{transform:scale(.98)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.mini .n{font-size:24px;font-weight:750;line-height:1.1}
.mini .k{font-size:12px;color:var(--ink3);margin-top:3px}
.sect{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.sect h3{font-size:14px;font-weight:650;margin:0;color:var(--ink2)}
.sect button{font-size:12.5px;color:var(--brand);white-space:nowrap;flex:0 0 auto}

/* ---------- 列表 ---------- */
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;box-shadow:var(--shadow)}
.item .m{flex:1;min-width:0}
.item .en{font-weight:650;font-size:15.5px;word-break:break-word}
.item .zh{font-size:12.5px;color:var(--ink2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mt{font-size:11px;color:var(--ink3);margin-top:3px}
.tag{display:inline-block;font-size:10.5px;color:var(--brand);background:var(--brandSoft);
  padding:1px 6px;border-radius:999px;margin-right:4px}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--warnSoft);color:var(--warn)}
.pill.ok{background:var(--okSoft);color:var(--ok)}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:48px 20px}
.empty b{display:block;font-size:15px;color:var(--ink2);margin-bottom:6px}

/* ---------- 学习 / 复习 卡 ---------- */
.stage{flex:1;display:flex;flex-direction:column;padding:0 16px}
.pbar{height:4px;background:var(--line);border-radius:999px;overflow:hidden;margin:4px 0 18px}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .3s}
.bigcard{flex:1;background:var(--card);border-radius:24px;border:1px solid var(--line);
  box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;
  align-items:center;padding:28px 22px;min-height:0;position:relative}
.bigcard.learning{justify-content:flex-start;align-items:stretch;overflow-y:auto}
.word{font-size:40px;font-weight:750;letter-spacing:-.5px;text-align:center;word-break:break-word;line-height:1.2}
.word.small{font-size:28px}
.phon{color:var(--ink3);font-size:14px;margin-top:8px;text-align:center}
.speakbtn{width:44px;height:44px;border-radius:50%;background:var(--brandSoft);color:var(--brand);
  display:flex;align-items:center;justify-content:center;margin:14px auto 0}
.speakbtn:active{transform:scale(.92)}
.senses{margin-top:22px;width:100%}
.sense{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.sense:last-child{border-bottom:none}
.sense .no{color:var(--ink3);font-size:12.5px;padding-top:3px;min-width:14px}
.hintline{text-align:center;color:var(--ink3);font-size:13px;margin-top:18px}
.actions{flex:0 0 auto;display:flex;gap:10px;padding:14px 0 calc(16px + env(safe-area-inset-bottom))}
.btn{flex:1;height:50px;border-radius:14px;background:var(--card);border:1px solid var(--line);
  font-weight:650;font-size:15.5px;color:var(--ink);display:flex;align-items:center;justify-content:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff;border-color:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.bad{background:var(--badSoft);color:var(--bad);border-color:transparent}
.btn:disabled{opacity:.45}

/* 选择题 */
.opt{width:100%;text-align:left;padding:15px 16px;border-radius:14px;background:var(--card);
  border:1.5px solid var(--line);margin-bottom:10px;font-size:15.5px;transition:all .15s}
.opt:active{transform:scale(.99)}
.opt.right{border-color:var(--ok);background:var(--okSoft);color:var(--ok);font-weight:650}
.opt.wrong{border-color:var(--bad);background:var(--badSoft);color:var(--bad)}

/* 默写输入 */
.answerbox{width:100%;margin-top:20px}
.answerbox input{width:100%;height:56px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--card);padding:0 16px;font-size:18px;outline:none;text-align:center;letter-spacing:.3px}
.answerbox input:focus{border-color:var(--brand)}
.result{margin-top:16px;font-size:14px;text-align:center}
.result .r{font-size:17px;font-weight:700}
.result .r.ok{color:var(--ok)}
.result .r.bad{color:var(--bad)}
.result .fix{margin-top:6px;color:var(--ink2)}
.result .fix b{color:var(--bad);font-size:17px}
.result .miss{color:var(--warn);font-size:12.5px;margin-top:5px}

/* ---------- 底部导航 ---------- */
#tabbar{
  position:absolute;left:0;right:0;bottom:0;display:flex;z-index:20;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
body.dark #tabbar{background:rgba(24,27,34,.94)}
#tabbar button{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;color:var(--ink3);font-size:10.5px}
#tabbar button.on{color:var(--brand)}
#tabbar svg{width:22px;height:22px}

/* ---------- 弹层 ---------- */
#mask{position:fixed;inset:0;background:rgba(10,14,20,.4);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:40}
#mask.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;
  z-index:50;transform:translateY(102%);transition:transform .24s cubic-bezier(.2,.8,.2,1);
  max-height:88vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#sheet.on{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.sheet-head h3{margin:0;font-size:16px;font-weight:700}
.sheet-body{overflow-y:auto;padding:0 18px 18px}
.sheet-body textarea{width:100%;min-height:150px;border-radius:14px;border:1.5px solid var(--line);
  background:var(--bg);padding:12px;font-size:14.5px;line-height:1.6;outline:none;resize:vertical}
.sheet-body textarea:focus{border-color:var(--brand)}
.tip{font-size:12.5px;color:var(--ink3);margin:8px 0 0;line-height:1.6}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .l{font-size:14.5px}
.row .s{font-size:12px;color:var(--ink3);margin-top:2px}
.switch{width:46px;height:27px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:0 0 auto}
.switch i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--brand)}
.switch.on i{left:22px}
.num-in{width:70px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);
  text-align:center;outline:none;font-size:14px}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;bottom:110px;transform:translate(-50%,10px);background:rgba(20,24,32,.92);
  color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;
  transition:.2s;z-index:90;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* 空状态的大加号 */
.fab{position:absolute;right:16px;bottom:76px;width:54px;height:54px;border-radius:50%;
  background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(43,108,246,.4);z-index:15}
.fab:active{transform:scale(.94)}
#addMask{position:fixed;inset:0;background:rgba(10,14,20,.4);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:40}
#addMask.on{opacity:1;pointer-events:auto}

/* ---------- 例句 ---------- */
.exbox{margin-top:18px;padding:12px 14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);width:100%}
.ex-en{font-size:14px;line-height:1.55;color:var(--ink)}
.ex-zh{font-size:12.5px;color:var(--ink3);margin-top:4px}
.ex-spk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
  background:var(--brandSoft);color:var(--brand);margin-left:6px;vertical-align:middle}

/* ---------- 默写键盘 ---------- */
.kbdpan{flex:0 0 auto;padding:6px 0 calc(6px + env(safe-area-inset-bottom));user-select:none}
.kb-row{display:flex;gap:5px;justify-content:center;margin-bottom:6px}
.kb-key{flex:1;height:42px;border-radius:9px;background:var(--card);border:1px solid var(--line);
  font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 0 rgba(16,24,40,.05)}
.kb-key:active{background:var(--brandSoft);color:var(--brand);transform:translateY(1px)}
.kb-key.fn{flex:1.7;font-size:13px;color:var(--ink2);background:var(--line);border-color:transparent}
.kb-key.go{flex:2;background:var(--brand);color:#fff;border-color:transparent;font-size:14px}
.typebox{width:100%;min-height:58px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 14px;margin-top:18px;
  font-size:21px;font-weight:650;letter-spacing:.5px;word-break:break-word;text-align:center}
.typebox .ph{color:var(--ink3);font-weight:400;font-size:14px;letter-spacing:0}
.typebox .caret{display:inline-block;width:2px;height:20px;background:var(--brand);margin-left:2px;
  animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.zhprompt{font-size:21px;font-weight:650;text-align:center;margin-top:14px;line-height:1.45}
.reveal-word{margin-top:14px;text-align:center;font-size:13px;color:var(--warn)}
.reveal-word b{font-size:19px;letter-spacing:.5px}
.bigcard.kbd{justify-content:flex-start;align-items:stretch;overflow-y:auto;padding:18px 16px}

/* ---------- 释义多选 ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;width:100%}
.chip{padding:11px 13px;border-radius:11px;background:var(--card);border:1.5px solid var(--line);
  font-size:14px;line-height:1.35;text-align:left}
.chip.on{border-color:var(--brand);background:var(--brandSoft);color:var(--brand);font-weight:650}
.examtip{text-align:center;font-size:12px;color:var(--ink3);margin:-6px 0 10px}

/* ---------- 结果 ---------- */
.rlist{width:100%;margin-top:14px}
.ritem{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ritem:last-child{border-bottom:none}
.rstat{font-weight:750;width:16px;flex:0 0 auto}

/* ---------- 正确率柱状 ---------- */
.bars{display:flex;align-items:flex-end;gap:3px;height:64px;margin:4px 0 16px}
.bars i{flex:1;height:100%;background:var(--line);border-radius:3px;display:flex;align-items:flex-end}
.bars i b{display:block;width:100%;background:var(--brand);border-radius:3px}

/* ---------- 标签 / 科目 ---------- */
.chip.sm{padding:7px 11px;font-size:13px;border-radius:999px;white-space:nowrap}
.subj{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
  background:var(--brandSoft);color:var(--brand);margin-right:6px;flex:0 0 auto}
.s0{background:#e8f0ff;color:#2b6cf6}.s1{background:#e9f7ef;color:#0f9d58}
.s2{background:#fdf0e6;color:#c47f0a}.s3{background:#f3ecff;color:#7a4ddb}
.s4{background:#fdecec;color:#e5484d}.s5{background:#e6f6f6;color:#0f8b8b}
body.dark .s0{background:#1a2440;color:#7aa3ff}body.dark .s1{background:#13291e;color:#3ec27a}
body.dark .s2{background:#2c2416;color:#e0a33c}body.dark .s3{background:#241c36;color:#b299ff}
body.dark .s4{background:#33191b;color:#f2737a}body.dark .s5{background:#0f2a2a;color:#4fd1c5}

/* ---------- 拼写热力图 ---------- */
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:6px 0 16px}
.heat i{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:650;font-style:normal;background:var(--line);color:var(--ink3)}
.heat i.hot{color:#fff}

/* ---------- 编辑表单 ---------- */
.fl{display:block;font-size:12.5px;color:var(--ink3);margin-bottom:12px}
.fl input,.fl textarea{display:block;width:100%;margin-top:6px;background:var(--bg);color:var(--ink);
  border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;font-size:14.5px;outline:none}
.fl input:focus,.fl textarea:focus{border-color:var(--brand)}
.fl textarea{min-height:74px;resize:vertical}

/* ---------- 错题 ---------- */
.mcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center}
.mtext{font-size:18px;line-height:1.6;font-weight:600;word-break:break-word}

/* ---------- 2.0 复习评分 ---------- */
.gradebar{display:flex;gap:8px;margin-top:14px;width:100%}
.gbtn{flex:1;border-radius:14px;padding:11px 4px;background:var(--card);border:1.5px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
.gbtn:active{transform:scale(.97)}
.gbtn b{font-size:15px}
.gbtn span{font-size:10.5px;color:var(--ink3);font-weight:400}
.gbtn.bad{border-color:rgba(229,72,77,.32);color:var(--bad)}
.gbtn.warn{border-color:rgba(196,127,10,.32);color:var(--warn)}
.gbtn.ok{border-color:rgba(15,157,88,.32);color:var(--ok)}
.gbtn.rec{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandSoft)}
.kbdtop{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
  color:var(--ink3);padding:0 2px 8px;min-height:20px}
.kbdtop button{font-size:12.5px;color:var(--brand)}
.studyans{margin-top:12px;font-size:14px;text-align:center;line-height:1.8}
.studyans b{font-size:19px;letter-spacing:.3px}
.banner{background:var(--warnSoft);color:var(--warn);border-radius:12px;padding:10px 13px;
  font-size:12.5px;margin-bottom:12px;display:flex;gap:8px;align-items:center;line-height:1.5}
.banner button{margin-left:auto;font-size:12.5px;font-weight:650;color:var(--warn);flex:0 0 auto}
.newtag{display:inline-block;font-size:9.5px;font-weight:700;color:#fff;background:var(--bad);
  border-radius:999px;padding:0 5px;margin-left:4px;vertical-align:1px;letter-spacing:.2px}
.switch{position:relative;cursor:pointer;touch-action:manipulation}
.switch::after{content:'';position:absolute;inset:-10px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;
  border-bottom:1px solid var(--line);cursor:pointer}
.srow:last-child{border-bottom:none}
.bookcover{width:38px;height:38px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--brand),#6f5cf5);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:750;font-size:16px}
.rootline{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;width:100%}
.rootline .tag{font-size:11px;padding:3px 8px;white-space:normal;line-height:1.5}
</style>
</head>
<body>

<div id="app">
  <!-- 首页 -->
  <section class="screen on" id="scr-home">
    <div class="topbar">
      <h1>温故</h1><div class="sp"></div>
      <button class="iconbtn" data-act="theme" aria-label="夜间模式">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8Z"/>
        </svg>
      </button>
    </div>
    <div class="scroll" id="homeBody"></div>
  </section>

  <!-- 学习 -->
  <section class="screen" id="scr-learn">
    <div class="topbar">
      <button class="iconbtn" data-act="quit" aria-label="退出">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M15 5 8 12l7 7"/>
        </svg>
      </button>
      <h1 style="font-size:16px" id="learnTitle">学习新词</h1>
      <div class="sp"></div>
      <button class="btn" data-act="learnKnown" style="height:30px;padding:0 10px;font-size:12.5px;flex:0 0 auto;color:var(--brand);background:var(--brandSoft);border-color:transparent">直接学会</button>
      <span style="font-size:12.5px;color:var(--ink3)" id="learnCount"></span>
    </div>
    <div class="stage" id="learnStage"></div>
  </section>

  <!-- 复习 -->
  <section class="screen" id="scr-review">
    <div class="topbar">
      <button class="iconbtn" data-act="quit" aria-label="退出">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M15 5 8 12l7 7"/>
        </svg>
      </button>
      <h1 style="font-size:16px" id="reviewTitle">默写复习</h1>
      <div class="sp"></div>

<script>
/* ============================================================
   0. 常量
   ============================================================ */
const KEY = 'wordapp_v1';
const META_KEY = 'wordapp_meta_v2';
const DB_NAME = 'wengu_db', DB_VER = 1, DB_STORE = 'kv';
let APP_VERSION = '2.7.0';      // 每次发版递增，同时改 www/version.json
const GAPS = [1,1,2,3,4,4,6,9,15,15];
const TOTAL_STAGE = 10;
const MAX_FILL_SENSES = 2;      // 词典自动补全最多取几条释义

/* ---- FSRS-6 默认权重（21 个参数，来自开源记忆模型） ---- */
const FSRS_W = [0.212,1.2931,2.3065,8.2956,6.4133,0.8334,3.0194,0.001,1.8722,0.1666,
                0.796,1.4835,0.0614,0.2629,1.6483,0.6014,1.8729,0.5425,0.0912,0.0658,0.1542];
const FSRS_DR = 0.9;            // 目标保持率
const FSRS_MAX = 365;           // 最长间隔（天）
const FSRS_DECAY = -FSRS_W[20];
const FSRS_FACTOR = Math.pow(0.9, 1/FSRS_DECAY) - 1;

const DEFAULTS = {
  v: 2,
  settings: {
    theme:'light', onlineAudio:true, autoSpeak:true, autoBackup:true,
    reminder:false, remindTime:'20:00', sessionMin:15, listenInExam:false, recallFirst:true, misGap:'xlong',
    lastSubject:'物理', lastBook:{}, lastTopic:{},
    newPerDay:7, paperCap:40, answerCap:60, seen20:false, seen201:false, seen21:false, seen22:false, seen221:false, seen222:false, seen230:false, seen240:false, seen250:false, seen260:false, seen270:false, fsrsDR:0.9,
    book:'', bookName:''
  },
  clockOffset: 0,
  items: [],
  days: {},
  meta: { deferStreak:0, deferDate:'', snapWarned:false },
  exam: null,
  learn: null,
  mistakes: [],
  spellHeat: {}
};

/** 2.7 周节奏：平日攒进度，周六清账，周日加词。单词复习和错题各有额度。 */
const WEEK_PLAN = {
  weekday: {name:'普通日', newWords:7,  review:40, misQuota:6},
  sat:     {name:'清账日', newWords:0,  review:80, misQuota:20},
  sun:     {name:'加词日', newWords:12, review:80, misQuota:20}
};
const WEEK_NEW_TOTAL = 47;     // 7×5 + 12
const WEEK_REVIEW_TOTAL = 360; // 40×5 + 80×2
const WEEK_MIS_TOTAL = 70;     // 6×5 + 20×2
/** 错题本：语数英物化地，按间隔档复习 4 遍 */
const SUBJECTS = ['语文','数学','英语','物理','化学','地理'];
/** 错题本间隔档：按天数递进，最后一遍之后归档 */
const MISTAKE_PRESETS = {
  std:   [1,2,4,7],
  long:  [1,3,7,15],
  xlong: [1,7,15,30]
};
function mistakeGaps(){
  return MISTAKE_PRESETS[S.settings.misGap] || MISTAKE_PRESETS.long;
}
/** 错题轮次：卡住越多次，自动多给 1~2 轮，别让难题反复卡在第 4 遍 */
function misRounds(m){
  return mistakeGaps().length + Math.min(2, Math.floor((Number(m && m.failCount)||0)/2));
}

/* ============================================================
   1. 存储
   ============================================================ */
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw){
      const d0 = JSON.parse(JSON.stringify(DEFAULTS));
      const m0 = readMeta();
      if(m0){
        d0.settings = Object.assign(d0.settings, m0.settings||{});
        d0.meta = Object.assign(d0.meta, m0.meta||{});
        if(Object.prototype.hasOwnProperty.call(m0,'learn')) d0.learn = m0.learn;
        if(Object.prototype.hasOwnProperty.call(m0,'exam')) d0.exam = m0.exam;
        if(m0.clockOffset != null) d0.clockOffset = m0.clockOffset;
      }
      return d0;
    }
    const d = JSON.parse(raw);
    const base = JSON.parse(JSON.stringify(DEFAULTS));
    d.settings = Object.assign(base.settings, d.settings||{});
    // 安卓 WebView 没有 speechSynthesis，老用户一次性切到联网发音
    if(!d.settings.onlineAudioFixed){
      d.settings.onlineAudio = true;
      d.settings.onlineAudioFixed = true;
    }
    d.meta = Object.assign(base.meta, d.meta||{});
    const m = readMeta();
    if(m){
      d.settings = Object.assign(d.settings, m.settings||{});
      d.meta = Object.assign(d.meta, m.meta||{});
      if(Object.prototype.hasOwnProperty.call(m,'learn')) d.learn = m.learn;
      if(Object.prototype.hasOwnProperty.call(m,'exam')) d.exam = m.exam;
      if(m.clockOffset != null) d.clockOffset = m.clockOffset;
    }
    d.items = Array.isArray(d.items)? d.items : [];
    d.days = d.days || {};
    d.mistakes = Array.isArray(d.mistakes) ? d.mistakes : [];
    d.learn = d.learn || null;
    if(!d.settings.lastBook) d.settings.lastBook = {};
    d.mistakes.forEach(m=>{
      if(m.answer == null) m.answer = '';
      if(m.cause == null) m.cause = '';
      if(m.tag == null) m.tag = '';
      if(m.img == null) m.img = '';
      if(m.finishedAt == null) m.finishedAt = '';
      if(m.failCount == null) m.failCount = 0;
      if(m.fav == null) m.fav = false;
      if(m.book == null) m.book = '';
      if(/^第+$/.test(m.book)) m.book = '';
      if(m.topic == null) m.topic = '';
      m.topic = normTopic(m.topic);
      if(!Array.isArray(m.derived)) m.derived = [];
      if(m.page == null){
        const loc = parseLoc(m.text||'');
        if(!m.book) m.book = loc.book;
        m.page = loc.page; m.no = loc.no;
      }
    });
    d.spellHeat = d.spellHeat || {};
    // 1.8 的「批量交卷」进度与 2.0 逐题复习结构不兼容，直接丢弃重排
    if(d.exam && !d.exam.instant) d.exam = null;
    return d;
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULTS)); }
}
let saveTimer = null, idbTimer = null, DB = null, DB_MODE = 'local';
let idbFailNotified = false, metaFailNotified = false;
function readMeta(){
  try{ return JSON.parse(localStorage.getItem(META_KEY) || 'null'); }catch(e){ return null; }
}
/** localStorage 只留很小的一份元数据：设置、词书、未完成学习会话 */
function saveMeta(){
  try{
    localStorage.setItem(META_KEY, JSON.stringify({
      v:APP_VERSION, saved:Date.now(), settings:S.settings, clockOffset:S.clockOffset,
      meta:S.meta, learn:S.learn, exam:S.exam, counts:{items:S.items.length, mistakes:S.mistakes.length}
    }));
  }catch(e){
    if(!metaFailNotified){
      metaFailNotified = true;
      setTimeout(()=>toast('设置/进度保存失败，请先导出备份'), 0);
    }
  }
}
function save(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
  saveMeta();
  if(DB_MODE === 'idb' && DB){
    clearTimeout(idbTimer);
    idbTimer = setTimeout(()=>{
      idbTimer = null;
      idbPut('state', S).catch(()=>{
        if(!idbFailNotified){
          idbFailNotified = true;
          toast('数据保存失败，请先导出备份');
        }
      });
    }, 250);
  }else{
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ toast('存储空间不足，请先导出备份'); }
  }
  scheduleBackup();
}
/** 高频操作（学习步骤、拼写输入）先攒 200ms 再落盘，减少卡顿 */
function saveSoon(ms){
  if(saveTimer) return;
  saveTimer = setTimeout(()=>{ saveTimer = null; save(); }, ms||200);
}
/* ---- IndexedDB：主数据存储，容量由磁盘决定，不再受 localStorage 5MB 限制 ---- */
function idbOpen(){
  return new Promise((resolve, reject)=>{
    if(!window.indexedDB) return reject(new Error('no indexedDB'));
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error || new Error('idb open failed'));
    req.onblocked = ()=>reject(new Error('idb blocked'));
  });
}
function idbGet(key){
  return new Promise((resolve, reject)=>{
    if(!DB) return reject(new Error('no db'));
    const tx = DB.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
function idbPut(key, val){
  return new Promise((resolve, reject)=>{
    if(!DB) return reject(new Error('no db'));
    const tx = DB.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(val, key);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
    tx.onabort = ()=>reject(tx.error);
  });
}
function idbDel(key){
  return new Promise((resolve, reject)=>{
    if(!DB) return reject(new Error('no db'));
    const tx = DB.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = ()=>resolve(true);
    tx.onerror = ()=>reject(tx.error);
  });
}
/**
 * 启动时优先读 IndexedDB；没有就迁移 localStorage。
 * 旧的全量 localStorage 数据保留到第二次成功启动，确认 IDB 稳定后再删除。
 */
async function idbBoot(){
  try{
    DB = await idbOpen();
    const st = await idbGet('state');
    if(st && Array.isArray(st.items)){
      S = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), st);
      S.settings = Object.assign({}, DEFAULTS.settings, st.settings||{});
      S.meta = Object.assign({}, DEFAULTS.meta, st.meta||{});
      S.items = Array.isArray(S.items) ? S.items : [];
      S.mistakes = Array.isArray(S.mistakes) ? S.mistakes : [];
      S.days = S.days || {};
      S.spellHeat = S.spellHeat || {};
      const m = readMeta();
      if(m){
        S.settings = Object.assign(S.settings, m.settings||{});
        S.meta = Object.assign(S.meta, m.meta||{});
        if(Object.prototype.hasOwnProperty.call(m,'learn')) S.learn = m.learn;
        if(Object.prototype.hasOwnProperty.call(m,'exam')) S.exam = m.exam;
        if(m.clockOffset != null) S.clockOffset = m.clockOffset;
      }
      migrateItems(S.items);
      DB_MODE = 'idb';
      S.meta.idbBoots = Number(S.meta.idbBoots||0) + 1;
      const removeOld = S.meta.idbBoots >= 2;
      await idbPut('state', S);
      if(removeOld){
        try{ localStorage.removeItem(KEY); }catch(e){}
      }
      saveMeta();
      return;
    }
    // 第一次升级：把 localStorage 里的数据整体迁进 IDB，并回读校验条数
    DB_MODE = 'idb';
    S.meta.idbBoots = 1;
    await idbPut('state', S);
    const back = await idbGet('state');
    if(!back || !Array.isArray(back.items) || back.items.length !== S.items.length){
      throw new Error('idb verify failed');
    }
    saveMeta();
  }catch(e){
    DB = null;
    DB_MODE = 'local';
  }
}
/** 页面隐藏/关闭前把待写的 IDB 落盘，避免最后一步丢失 */
function flushSave(){
  saveMeta();
  if(DB_MODE === 'idb' && DB){
    clearTimeout(idbTimer);
    idbTimer = null;
    idbPut('state', S).catch(()=>{
      if(!idbFailNotified){
        idbFailNotified = true;
        toast('数据保存失败，请先导出备份');
      }
    });
  }
}
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushSave(); });

/* ---- 自动备份：本地快照（IndexedDB，最近 5 份） + 手机文档目录（每天 1 份） ---- */
const SNAP_KEY = 'wordapp_snap_v1';   // 旧版 localStorage 快照，仅用于一次性迁移
const SNAP_KEEP = 5;
let snapCache = [];
let bkTimer = null, capBackupDay = '';
function scheduleBackup(){
  if(!S.settings || !S.settings.autoBackup) return;
  clearTimeout(bkTimer);
  bkTimer = setTimeout(()=>{ writeSnapshot(); capBackup(); }, 2500);
}
function snapshots(){ return snapCache; }
/** 启动时把快照读进来：优先 IndexedDB，旧 localStorage 快照迁一次 */
async function loadSnaps(){
  try{
    if(DB_MODE==='idb' && DB){
      const v = await idbGet('snaps');
      if(Array.isArray(v) && v.length){ snapCache = v; }
    }
    let old = [];
    try{ old = JSON.parse(localStorage.getItem(SNAP_KEY) || '[]'); }catch(e){ old = []; }
    if(Array.isArray(old) && old.length){
      const seen = new Set(snapCache.map(x=>x.d));
      old.forEach(x=>{ if(x && x.d && !seen.has(x.d)) snapCache.push(x); });
      snapCache.sort((a,b)=>String(b.d).localeCompare(String(a.d)));
      snapCache = snapCache.slice(0, SNAP_KEEP);
      if(DB_MODE==='idb' && DB) await idbPut('snaps', snapCache);
      try{ localStorage.removeItem(SNAP_KEY); }catch(e){}
    }
  }catch(e){ /* 读不到就当作没有快照 */ }
}
function backupPayload(){
  return JSON.stringify({
    v:1, saved:today(), items:S.items, days:S.days, settings:S.settings,
    clockOffset:S.clockOffset, meta:S.meta, mistakes:S.mistakes, spellHeat:S.spellHeat, learn:S.learn
  });
}
function writeSnapshot(){
  try{
    const data = backupPayload();
    const d = today();
    const rec = {d, ts:Date.now(), n:S.items.length, data};
    const i = snapCache.findIndex(x=>x.d===d);
    if(i>=0) snapCache[i] = rec; else snapCache.unshift(rec);
    snapCache = snapCache.slice(0, SNAP_KEEP);
    if(DB_MODE==='idb' && DB){
      idbPut('snaps', snapCache).catch(()=>{
        if(!S.meta.snapWarned){ S.meta.snapWarned = true; save(); toast('本地快照保存失败，请导出备份'); }
      });
    }else{
      try{ localStorage.setItem(SNAP_KEY, JSON.stringify(snapCache)); }
      catch(e){
        if(!S.meta.snapWarned){ S.meta.snapWarned = true; save(); }
      }
    }
  }catch(e){}
}
function capPlugin(name){
  const C = window.Capacitor;
  return (C && C.Plugins && C.Plugins[name]) || null;
}
async function capBackup(){
  if(!S.settings || !S.settings.autoBackup) return;
  const FS = capPlugin('Filesystem');
  if(!FS) return;
  if(capBackupDay === today()) return;
  capBackupDay = today();
  const data = backupPayload();
  const name = '温故/备份-' + today() + '.json';
  let dir = 'DOCUMENTS', path = name;
  try{
    await FS.writeFile({path:name, data, directory:dir, encoding:'utf8', recursive:true});
  }catch(e){
    // 没有存储权限时退回应用私有目录，至少不会丢
    dir = 'DATA'; path = '备份-'+today()+'.json';
    try{ await FS.writeFile({path, data, directory:dir, encoding:'utf8'}); }
    catch(_){ capBackupDay=''; return; }
  }
  // 回读校验：写进去的能读出来、条数对得上，才算备份成功
  let ok = true;
  try{
    const back = await FS.readFile({path, directory:dir, encoding:'utf8'});
    const txt = typeof back.data==='string' ? back.data : '';
    if(txt){
      const o = JSON.parse(txt);
      ok = Array.isArray(o.items) && o.items.length === S.items.length;
    }
  }catch(e){ /* 部分平台不支持回读，按成功处理 */ }
  S.meta.lastBackup = {d:today(), n:S.items.length, ok};
  save();
}
/** 覆盖/合并/恢复之前，先把当前数据另存一份，避免手滑没有退路 */
async function preRestoreBackup(){
  const FS = capPlugin('Filesystem');
  const data = backupPayload();
  const stamp = today() + '-' + Date.now();
  if(FS){
    try{
      await FS.writeFile({path:'温故/恢复前-'+stamp+'.json', data, directory:'DOCUMENTS', encoding:'utf8', recursive:true});
      return true;
    }catch(e){
      try{
        await FS.writeFile({path:'恢复前-'+stamp+'.json', data, directory:'DATA', encoding:'utf8'});
        return true;
      }catch(_){}
    }
  }
  return false;
}

/* ============================================================
   2. 日期
   ============================================================ */
const p2 = n => (n<10?'0':'')+n;
const fmt = d => d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
function parseD(s){ const a=String(s).split('-').map(Number); return new Date(a[0],a[1]-1,a[2]); }
function today(){
  const d = new Date();
  if(S.clockOffset) d.setDate(d.getDate()+Number(S.clockOffset));
  return fmt(new Date(d.getFullYear(),d.getMonth(),d.getDate()));
}
function addD(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return fmt(d); }
function diffD(a,b){ return Math.round((parseD(b)-parseD(a))/86400000); }

   ============================================================ */
function splitSenses(zh){
  return String(zh==null?'':zh).split(/[；;\/|\n]+/).map(s=>s.trim()).filter(Boolean);
}
function normEn(s){
  return String(s==null?'':s)
    .replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/\u3000/g,' ').replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"')
    .replace(/\s+/g,' ').trim().toLowerCase()
    .replace(/[\s.,;:!?"']+$/,'').trim();
}
function normZh(s){
  return String(s==null?'':s)
    .replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[（(][^）)]*[）)]/g,'')
    .replace(/[\s，,。.、；;：:！!？?"'“”‘’·…\-—_\/\\]+/g,'')
    .trim().toLowerCase();
}
function judgeEn(raw, item){
  const a=normEn(raw), b=normEn(item.en);
  if(!a) return {r:'empty'};
  if(a===b) return {r:'right'};
  return {r:'wrong'};
}

}
function loadRoots(){
  if(ROOTS) return Promise.resolve(ROOTS);
  if(!rootsLoading){
    rootsLoading = fetch('roots.json').then(r=>r.json())
      .then(d=>{ ROOTS = d || {}; return ROOTS; })
      .catch(()=>{ ROOTS = {}; return ROOTS; });

function bookById(id){

/* ============================================================
   6. 发音（安卓 WebView 没有 speechSynthesis，走联网音频）
   单词 → 有道真人音；整句 → 百度 TTS
   ============================================================ */
let lastAudio = null;
function speak(text, silent, onFail){
  const s = String(text==null?'':text).trim();
  if(!s) return;
  if(S.settings.onlineAudio){ onlineSpeak(s, silent, onFail); return; }
  if('speechSynthesis' in window){ tts(s); return; }
  onlineSpeak(s, silent, onFail);
}
function onlineSpeak(text, silent, onFail){
  const n = text.split(/\s+/).filter(Boolean).length;
  // 单词走有道真人音；词组/整句走百度 TTS（有道对带空格的词条常被浏览器拦）
  const url = n >= 2
    ? 'https://fanyi.baidu.com/gettts?lan=EN&spd=3&source=web&text='+encodeURIComponent(text)
    : 'https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(text)+'&type=2';
  try{
    if(lastAudio){ try{ lastAudio.pause(); }catch(e){} lastAudio = null; }
    const a = new Audio(url);
    a.preload = 'auto';
    lastAudio = a;
    let failed = false;
    const fail = ()=>{
      if(failed) return;
      failed = true;
      if('speechSynthesis' in window){ tts(text); return; }
      if(onFail) onFail();
      else if(!silent) toast('发音加载失败，请检查网络');
    };
    a.onerror = fail;
    const p = a.play();
    if(p && p.catch) p.catch(fail);
  }catch(e){
    if('speechSynthesis' in window) tts(text);
    else if(onFail) onFail();
    else if(!silent) toast('发音失败');
  }
}
function tts(text){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.92; u.pitch=1;
    speechSynthesis.speak(u);
  }catch(e){}
}

function pushHist(it, rec){

  if(it.history.length>40) it.history = it.history.slice(-40);
}
function newItems(){
  const bk = S.settings.book;
  return S.items.filter(i=>!i.learned && i.status==='active')
    .sort((a,b)=> ((a.book===bk?0:1)-(b.book===bk?0:1)) ||

function bookStats(bk){
  if(!bk) return {inLib:0, learned:0};
  const list = S.items.filter(i=>i.book===bk.id);
  return {inLib:list.length, learned:list.filter(i=>i.learned).length};
}
let bookTopLock = false;
async function topUpFromBook(n){
  await loadBooks();
  const bk = currentBook();
  n = Math.max(0, Number(n)||0);
  if(!bk || !n || bookTopLock) return 0;
  bookTopLock = true;
  try{
    const have = new Set(S.items.map(i=>normEn(i.en)));
    const picked = [];
    for(const w of bk.words){
      if(picked.length>=n) break;
      const k = normEn(w);
      if(!k || have.has(k)) continue;
      have.add(k); picked.push(w);
    }
    picked.forEach(w=>{
      const meta = (BOOKS.words && BOOKS.words[w]) || ['',''];
      const zh = meta[1] || dictSensesOf(w).slice(0,2).join('；') || '（待补释义）';
      const it = makeItem(w, zh, [bk.name]);
      it.book = bk.id; it.bookName = bk.name;
      S.items.push(it);
    });
    if(picked.length) save();
    return picked.length;
  }finally{ bookTopLock = false; }
}
function dueDate(it){ return (it.fsrs && it.fsrs.due) || it.nextDate || ''; }
function dueItems(){
  const t = today();
  return S.items.filter(i=>i.learned && i.status==='active' && dueDate(i) && dueDate(i)<=t);
}

/* ============================================================
   7.4 周节奏：单词复习和错题各有自己的额度
   周一–周五 7 新词 / 40 单词复习 / 6 道必做错题
   周六 0 新词 / 80 单词复习 / 20 道错题（清账）
   周日 12 新词 / 80 单词复习 / 20 道错题（加词）
   积压时自动减量：轻度新词减半，重度暂停新词
   ============================================================ */
/** 今天属于哪一类日子 */
function dayKind(dstr){
  const w = parseD(dstr || today()).getDay();
  return w===6 ? 'sat' : w===0 ? 'sun' : 'weekday';
}
function todayPlan(){ return WEEK_PLAN[dayKind()]; }
function isWeekend(){ return dayKind()!=='weekday'; }
/** 今天的新词目标：平日 7，周六 0，周日 12；积压时自动减半或暂停 */
function dayNewTarget(lvl){
  const base = todayPlan().newWords;
  if(!base) return 0;
  const level = lvl === undefined ? throttleLevel() : lvl;
  if(level==='hard') return 0;
  if(level==='soft') return Math.max(2, Math.round(base/2));
  return base;
}
/** 基础单词复习预算（返程模式会临时放大） */
function dayBaseBudget(){ return todayPlan().review; }
/** 本周周一 */
function weekStart(){
  const t = today();
  return addD(t, -((parseD(t).getDay()+6)%7));
}
/**
 * 积压刹车：只看单词积压，错题有自己的必做/等等队列，不拖累新词。
 * soft = 新词减半；hard = 暂停新词。
 * 单词积压回到预算内才自动恢复；用户可点「本周不减」跳过 7 天。
 */
function throttleLevel(){
  const t = today();
  if(S.meta.throttleSnooze && S.meta.throttleSnooze >= t) return false;
  const base = dayBaseBudget();
  const dueW = dueItems().length;
  let lvl = false;
  if(dueW > base*1.5) lvl = 'hard';
  else if(Number(S.meta.deferStreak)>=3 || dueW > base*1.15) lvl = 'soft';
  const cur = S.meta.throttle && S.meta.throttle.level;
  if(cur){
    if(dueW <= base) lvl = false;
    else lvl = (cur==='hard' || lvl==='hard') ? 'hard' : 'soft';
  }
  if(lvl) S.meta.throttle = {level:lvl, since:(S.meta.throttle && S.meta.throttle.since) || t};
  else if(S.meta.throttle) S.meta.throttle = null;
  return lvl;
}
/** 最近一个有学习记录的日子（不含今天），用于判断断更 */
function lastStudyDay(){
  const t = today();
  const ds = Object.keys(S.days).filter(d=>d < t && (
    (S.days[d].ans||0) + (S.days[d].items||0) + (S.days[d].mis||0) > 0
  )).sort();
  return ds.length ? ds[ds.length-1] : '';
}
function gapDays(){
  const l = lastStudyDay();
  return l ? Math.max(0, diffD(l, today())) : 0;
}
/** 返程模式：断更后主动开启，暂停新词、预算临时 ×1.5（最多持续 14 天） */
function catchupActive(){
  const c = S.meta.catchup;
  if(!c) return false;
  if(dueItems().length <= dayBaseBudget()){ S.meta.catchup = null; return false; }
  const start = c.start || today();
  if(diffD(start, today()) > 14){ S.meta.catchup = null; return false; }
  return true;
}
function dayBudget(){
  return catchupActive() ? Math.min(150, Math.round(dayBaseBudget()*1.5)) : dayBaseBudget();
}
/** 今天已经复习的单词数（自由复习/专项不算） */
function wordUsedToday(){
  const d = S.days[today()] || {};
  return Math.max(0, (Number(d.ans)||0) - (Number(d.free)||0));
}
function wordBudgetLeft(){ return Math.max(0, dayBudget() - wordUsedToday()); }
/** 错题每日额度：平日 6，周末 20 */
function misQuotaBase(){ return todayPlan().misQuota; }
/** 错题紧急度：逾期 > 卡住 > 最后一轮 > 轮次 */
function misUrgent(m){
  const od = overdueDays(m);
  const st = Number(m.stage)||0;
  const fails = Number(m.failCount)||0;
  const left = Math.max(0, misRounds(m) - st);
  return od*10 + fails*4 + (left<=1?6:0) + st*1.5 + (m.fav?2:0);
}
function misUrgentSort(a,b){
  return (misUrgent(b)-misUrgent(a))
    || String(a.nextDate||'').localeCompare(String(b.nextDate||''))
    || misSort(a,b);
}
/**
 * 今日必做错题：按紧急度取前 N 道，当天固定，避免做完一道又补一道。
 * 剩下的到期错题就是「等等」，完成必做就算完成，不要求清空所有到期。
 */
function misPlanToday(){
  const t = today();
  let mp = S.meta.misPlan;
  if(!mp || mp.d !== t){
    const due = dueMistakes().slice().sort(misUrgentSort);
    mp = {d:t, ids:due.slice(0, misQuotaBase()).map(m=>m.id), done:[], totalDue:due.length, quota:misQuotaBase()};
    S.meta.misPlan = mp;
    saveSoon(300);
  }
  return mp;
}
function misPlanLeft(){
  const mp = misPlanToday();
  const done = new Set(mp.done||[]);
  return mp.ids.filter(id=>!done.has(id) && mrevById(id)).length;
}
function misLaterCount(){
  const mp = misPlanToday();
  return dueMistakes().filter(m=>mp.ids.indexOf(m.id)<0).length;
}
function markPlanDone(id){
  const mp = misPlanToday();
  if(mp.ids.indexOf(id) >= 0 && (mp.done||[]).indexOf(id) < 0){
    mp.done.push(id);
    saveSoon(300);
  }
}
/** 断更回来且积压明显时，询问一次要不要进返程模式 */
function catchupOffer(){
  if(S.meta.catchup) return false;
  const gap = gapDays();
  if(gap < 3) return false;
  const l = lastStudyDay();
  if(S.meta.catchupSnooze === l) return false;
  return dueItems().length > dayBaseBudget()*1.6;
}
function catchupEta(){
  const cap = Math.max(5, dayBudget());
  return Math.max(1, Math.ceil(dueItems().length / (cap*0.8)));
}

/* ============================================================
   7.5 FSRS-6 记忆调度
   说明：S = 记忆强度（天），D = 难度（1~10），R = 可提取概率
   复习后按「忘记 / 模糊 / 记得 / 太简单」更新 S、D，再算下次到期日
   ============================================================ */
function fsrsClampD(d){ return Math.min(10, Math.max(1, Number(d)||5)); }
function fsrsD0(g){ return fsrsClampD(FSRS_W[4] - Math.exp(FSRS_W[5]*(g-1)) + 1); }
function fsrsS0(g){ return Math.max(0.1, FSRS_W[Math.max(0,g-1)]); }

/** 当前记忆保持率：t 天前复习、强度 s */
function fsrsR(t, s){
  if(!s || s<=0) return 0;
  return Math.pow(1 + FSRS_FACTOR*Math.max(0,t)/s, FSRS_DECAY);
}
/** 目标保持率 0.9 对应的间隔 */
function fsrsIvl(s, dr){
  dr = Number(dr || (S && S.settings && S.settings.fsrsDR) || FSRS_DR);
  if(!(dr>0.7 && dr<0.99)) dr = FSRS_DR;
  const iv = (s/FSRS_FACTOR) * (Math.pow(dr, 1/FSRS_DECAY) - 1);
  return Math.max(1, Math.min(FSRS_MAX, Math.round(iv)));
}
function itemRetention(it){
  const f = it && it.fsrs;
  if(!f || !f.last) return 0.9;
  const lastD = fmt(new Date(f.last));
  return fsrsR(Math.max(0, diffD(lastD, today())), f.s);
}
/** 补齐旧备份/外部数据缺失的字段，避免详情页出现 undefined */
function normalizeItem(it){
  if(!it || !it.en) return it;
  const t = today();
  if(!String(it.zh||'').trim()) it.zh = '（待补释义）';
  if(it.created == null) it.created = t;
  if(it.status == null) it.status = 'active';
  if(it.learned == null) it.learned = false;
  if(it.learnRounds == null) it.learnRounds = 0;
  if(it.stage == null) it.stage = 0;
  if(it.maxStage == null) it.maxStage = 0;
  if(it.streak == null) it.streak = 0;
  if(it.errCount == null) it.errCount = 0;
  if(it.totalAnswerCount == null) it.totalAnswerCount = 0;
  if(it.officialTestCount == null) it.officialTestCount = 0;
  if(it.officialRightCount == null) it.officialRightCount = 0;
  if(it.favTestCount == null) it.favTestCount = 0;
  if(it.favRightCount == null) it.favRightCount = 0;
  if(it.drillCount == null) it.drillCount = 0;
  if(it.drillRight == null) it.drillRight = 0;
  if(it.fav == null) it.fav = false;
  if(it.firstTestDone == null) it.firstTestDone = false;
  if(it.book == null) it.book = '';
  if(it.bookName == null) it.bookName = '';
  if(it.ex === undefined) it.ex = null;
  if(it.nextDate == null) it.nextDate = t;
  if(it.updatedAt == null) it.updatedAt = Date.now();
  return it;
}
/** 2.0 迁移：旧「阶段 + 固定间隔」→ FSRS；顺手清掉「zebra zebras」这类脏词条 */
function migrateItems(list){
  (list||[]).forEach(it=>{
    normalizeItem(it);
    if(it.learned && !it.fsrs) it.fsrs = legacyFsrs(it);
    if(it.fsrs && !it.fsrs.due) it.fsrs.due = it.nextDate || today();
    if(it.fsrs && it.nextDate !== it.fsrs.due) it.nextDate = it.fsrs.due;
    if(!Array.isArray(it.tags)) it.tags = [];
    if(!Array.isArray(it.history)) it.history = [];
    const m = String(it.en||'').match(/^([A-Za-z][A-Za-z'’-]*)\s+\1(?:s|es)?$/i);
    if(m) it.en = m[1];
  });
}
/** 旧数据迁移：用阶段与间隔反推一个合理的 S / D */
function legacyFsrs(it){
  const t = today();
  const st = Math.max(0, Number(it.stage)||0);
  const s = Math.max(1, GAPS[Math.min(st, GAPS.length-1)] || 1);
  const d = fsrsClampD(5 + Math.min(4, Number(it.errCount)||0));
  const due = /^\d{4}-\d{2}-\d{2}$/.test(String(it.nextDate||'')) ? it.nextDate : addD(t,1);
  return {d, s, reps:Math.max(1, Number(it.officialTestCount)||1), lapses:Math.min(9, Number(it.errCount)||0),
          state:2, last:Date.now()-s*86400000, due, ivl:s, lastGrade:3};
}
/** 只算不写：预测某个评分后的间隔 */
function fsrsPreview(it, g){
  const f = it.fsrs || {d:fsrsD0(3), s:fsrsS0(3), reps:0, lapses:0, state:0, last:0, due:today()};
  const elapsed = f.last ? Math.max(0, diffD(fmt(new Date(f.last)), today())) : 0;
  const R = f.state ? fsrsR(elapsed, f.s) : 0.9;
  let d = f.d, s = f.s;
  if(g===1){
    const lapseS = FSRS_W[11] * Math.pow(Math.max(1,d), -FSRS_W[12])
      * (Math.pow(s+1, FSRS_W[13]) - 1) * Math.exp(FSRS_W[14]*(1-R));
    s = Math.max(0.1, Math.min(s, lapseS));
    d = fsrsClampD(d + FSRS_W[6]*2*(10-d)/9);
    d = fsrsClampD(FSRS_W[7]*fsrsD0(4) + (1-FSRS_W[7])*d);
    return {s, d, ivl:1};
  }
  const hard = g===2 ? FSRS_W[15] : 1;
  const easy = g===4 ? FSRS_W[16] : 1;
  const grow = 1 + Math.exp(FSRS_W[8]) * (11-d) * Math.pow(Math.max(0.1,s), -FSRS_W[9])
    * (Math.exp(FSRS_W[10]*(1-R)) - 1) * hard * easy;
  s = Math.max(0.1, Math.min(36500, s * Math.max(0.2, grow)));
  d = fsrsClampD(d - FSRS_W[6]*(g-3)*(10-d)/9);
  d = fsrsClampD(FSRS_W[7]*fsrsD0(4) + (1-FSRS_W[7])*d);
  let ivl = fsrsIvl(s);
  if(g===2) ivl = Math.max(1, Math.round(ivl*0.8));
  return {s, d, ivl};
}
/** 写入 FSRS 状态，返回预测值 */
function fsrsApply(it, g){
  const t = today();
  if(!it.fsrs){
    it.fsrs = {d:fsrsD0(3), s:fsrsS0(3), reps:0, lapses:0, state:0, last:0, due:t, ivl:0, lastGrade:3};
  }
  const pv = fsrsPreview(it, g);
  it.fsrs.d = pv.d;
  it.fsrs.s = pv.s;
  it.fsrs.reps = (it.fsrs.reps||0)+1;
  it.fsrs.last = Date.now();
  it.fsrs.lastGrade = g;
  if(g===1){ it.fsrs.lapses = (it.fsrs.lapses||0)+1; it.fsrs.state = 3; }
  else it.fsrs.state = 2;
  let ivl = pv.ivl;
  // 间隔抖动 ±5%（≥3 天），避免同一天整批词一起到期
  if(ivl>=3){
    const fz = Math.max(1, Math.round(ivl*0.05));
    ivl = Math.max(1, ivl + Math.floor(Math.random()*(fz*2+1)) - fz);
  }
  it.fsrs.ivl = ivl;
  it.fsrs.due = g===1 ? addD(t,1) : addD(t, Math.min(FSRS_MAX, ivl));
  it.nextDate = it.fsrs.due;
  it.stage = Math.min(TOTAL_STAGE, Math.max(0, Math.round(Math.log2(Math.max(1,ivl))+1)));
  it.maxStage = Math.max(it.maxStage||0, it.stage);
  return pv;
}

/* ============================================================
   8. 组卷（按遗忘概率从高到低）
   ============================================================ */
function buildPaper(){
  const t = today();
  const cands = dueItems();
  if(!cands.length) return {ids:[],deferred:0,total:0};
  const scored = cands.map(it=>({
    it,
    R: itemRetention(it),
    od: Math.max(0, diffD(dueDate(it)||t, t)),
    lapses: (it.fsrs && it.fsrs.lapses) || 0
  }));
  scored.sort((a,b)=> (a.R-b.R) || (b.od-a.od) || (b.lapses-a.lapses));
  // 单词复习只用自己的 40/80 额度，错题有独立额度
  const CAP = Math.max(0, Math.min(dayBudget(), wordBudgetLeft()));
  const picked = scored.slice(0, CAP).map(x=>x.it);
  return {ids:picked.map(i=>i.id), deferred:cands.length-picked.length, total:cands.length};
}


/* ============================================================
   9. 学习流程（认识 → 回忆 → 选择 → 默写）
   ============================================================ */
let learn = null;
/** 学习会话每走一步就落盘，进程被回收/重启后还能接着学 */
function persistLearn(){
  if(!learn){ S.learn = null; saveSoon(120); return; }
  S.learn = {
    date: learn.date || today(),
    ids: learn.ids.slice(),
    idx: learn.idx,
    known: Math.max(0, Number(learn.known)||0),
    phase: learn.phase,
    revealed: !!learn.revealed,
    quiz: Array.isArray(learn.quiz) ? learn.quiz.slice() : null,
    wrong: Object.assign({}, learn.wrong || {}),
    tries: Object.assign({}, learn.tries || {}),
    requeued: Object.assign({}, learn.requeued || {}),
    spokenFor: learn.spokenFor || '',
    copy: !!learn.copy,
    text: learn.text || ''
  };
  saveSoon(120);
}
function resumeLearn(){
  const l = S.learn;
  if(!l || !Array.isArray(l.ids) || !l.ids.length){
    S.learn = null; save(); toast('没有可继续的学习'); return;
  }
  const ids = l.ids.filter(id=>byId(id));
  if(!ids.length){
    S.learn = null; save(); toast('上次学习记录已失效'); return;
  }
  learn = {
    date: l.date || today(),
    ids,
    idx: Math.min(Math.max(0, Number(l.idx)||0), ids.length),
    known: Math.max(0, Number(l.known)||0),
    phase: LEARN_PHASES.indexOf(l.phase) >= 0 ? l.phase : 'meet',
    revealed: !!l.revealed,
    quiz: Array.isArray(l.quiz) ? l.quiz : null,
    wrong: Object.assign({}, l.wrong || {}),
    tries: Object.assign({}, l.tries || {}),
    requeued: Object.assign({}, l.requeued || {}),
    spokenFor: l.spokenFor || '',
    copy: !!l.copy,
    text: l.text || ''
  };
  if(learn.idx >= learn.ids.length){ finishLearn(); return; }
  showScreen('learn');
  renderLearn();
}

function dictSensesOf(word){
  const d = dictLookup(word);
  if(!d) return [];
  const arr = Array.isArray(d.s) ? d.s : (Array.isArray(d) ? d : []);
  return arr.map(cleanDictSense).filter(Boolean);
}
/** 词典里有「zebras 或 zebra 〈动〉斑马」「-rr- 厌恶」这类脏数据，取释义时清掉前缀 */
function cleanDictSense(s){
  let t = String(s==null?'':s).trim();
  if(!/^[A-Za-z\-]/.test(t)) return t;
  const out = t
    .replace(/^.*[〈<][^〉>]{1,6}[〉>]\s*/, '')
    .replace(/^[A-Za-z0-9'’\-\.,\s\/]+?(?=[\u3400-\u9FFF])/, '')
    .trim();
  return out || t;
}
function phonOf(word){
  const d = dictLookup(word);
  return (d && d.p) ? d.p : '';
}
function exOf(word){
  const d = dictLookup(word);
  return (d && d.e && d.e.length === 2) ? d.e : null;
}
/** 词条自带的例句优先，否则用词典的 */
function itemEx(it){
  if(it && Array.isArray(it.ex) && it.ex.length === 2 && it.ex[0]) return it.ex;
  return exOf(it ? it.en : '');
}
function autoSpeak(word){
  if(S.settings.autoSpeak) speak(word);
}

const LEARN_PHASES = ['meet','recall','quiz','spell'];
const PHASE_NAME = {meet:'认识新词', recall:'回想一下', quiz:'选出释义', spell:'默写一遍'};

async function startLearn(){
  if(S.learn && Array.isArray(S.learn.ids) && S.learn.ids.length &&
     !confirm('还有一次未完成的学习，开始新的会覆盖它，继续？')) return;
  if(catchupActive()){ toast('返程模式先清到期，清完自动恢复新词'); return; }
  const newTarget = dayNewTarget();
  if(!newTarget){

    else toast('积压有点多，新词先停一停，今天先清到期');
    return;
  }
  const dueNow = dueItems();
  const capNow = dayBudget();
  if(dueNow.length > capNow){
    const go = confirm(`今天有 ${dueNow.length} 个词到期，超出每天 ${capNow} 个的任务预算。\n\n建议先把到期的清完，再学新词。\n点「确定」仍然学新词，点「取消」去复习。`);
    if(!go){ startReview(); return; }
  }
  if(S.settings.book){
    await loadBooks();

    }
  }
  const list = newItems().slice(0, newTarget);
  if(!list.length){ toast('没有待学的新词，换一本词书试试'); openBooks(); return; }
  learn = {
    date: today(),
    ids: list.map(i=>i.id),
    idx: 0,
    known: 0,
    phase: 'meet',
    revealed: false,
    quiz: null,
    wrong: {},
    tries: {},
    requeued: {},
    spokenFor: '',
    copy: false,
    text: ''
  };
  persistLearn();
  save();
  showScreen('learn');
  renderLearn();
}

function makeChoices(it){
  const right = splitSenses(it.zh)[0] || it.zh;
  const used = new Set([normZh(right)]);
  const picks = [];
  const pool = [];
  S.items.forEach(x=>{
    if(x.id===it.id) return;
    splitSenses(x.zh).forEach(s=>pool.push(s));
  });
  shuffle(pool);
  for(const p of pool){
    if(picks.length>=2) break;
    const n = normZh(p);
    if(!n || used.has(n)) continue;
    used.add(n); picks.push(p);
  }
  if(picks.length<2 && DICT){
    const keys = Object.keys(DICT);
    for(let i=0;i<200 && picks.length<2;i++){
      const s = dictSensesOf(keys[Math.floor(Math.random()*keys.length)])[0];
      if(!s || s.length>16) continue;
      const n = normZh(s);
      if(!n || used.has(n)) continue;
      used.add(n); picks.push(s);
    }
  }
  while(picks.length<2) picks.push('……');
  return shuffle([right, ...picks].slice(0,3));
}

function learnNext(){
  if(!learn) return;
  const it = byId(learn.ids[learn.idx]);
  const pi = LEARN_PHASES.indexOf(learn.phase);
  learn.revealed = false;
  learn.quiz = null;
  learn.text = '';
  if(pi < LEARN_PHASES.length-1){
    learn.phase = LEARN_PHASES[pi+1];
  }else{
    if(learn.copy && it){
      it.errCount = (it.errCount||0)+1;
      // 错词重排：拼写吃力的词排到队尾再来一遍
      learn.requeued = learn.requeued || {};
      if(!learn.requeued[it.id]){
        learn.requeued[it.id] = true;
        learn.ids.push(it.id);
      }
    }
    learn.copy = false;
    learn.idx++;
    learn.phase = 'meet';
  }
  persistLearn();
  renderLearn();
}

/** 记录拼错位置的字母，累计成热力图 */
function bumpHeat(correct, typed){
  const t = normEn(typed);
  if(!t) return;
  if(!S.spellHeat) S.spellHeat = {};
  const c = normEn(correct);
  for(let i=0;i<c.length;i++){
    const ch = c[i];
    if(ch<'a' || ch>'z') continue;
    if(t[i] !== ch) S.spellHeat[ch] = (S.spellHeat[ch]||0)+1;
  }
}

function spellCheck(){
  if(!learn) return;
  const it = byId(learn.ids[learn.idx]);
  if(!it) return;
  if(!String(learn.text||'').trim()){ toast('先用键盘拼出单词'); return; }
  if(normEn(learn.text) === normEn(it.en)){
    learn.text = '';
    learn.copy = false;
    learnNext();
    return;
  }
  bumpHeat(it.en, learn.text);
  learn.tries[it.id] = (learn.tries[it.id]||0) + 1;
  learn.text = '';
  if(learn.tries[it.id] >= 3){
    learn.copy = true;
    persistLearn();
    renderLearn();
    toast('连错 3 次，照着正确拼写再打一遍');
  }else{
    persistLearn();
    renderLearn();
    toast(learn.copy ? '再仔细看一遍正确拼写' : '不对哦，还有 '+(3-learn.tries[it.id])+' 次机会');
  }
}

function finishLearn(){
  const ids = learn ? learn.ids.slice() : [];
  // 学习过程中的错选/错拼，决定新词的初始记忆强度
  const perf = learn ? {wrong:Object.assign({}, learn.wrong), tries:Object.assign({}, learn.tries)} : {wrong:{},tries:{}};
  learn = null;
  S.learn = null;
  const t = today();
  let n = 0, weak = 0;
  ids.forEach(id=>{
    const it = byId(id);
    if(!it) return;
    const tries = Math.max(0, Number(perf.tries[id])||0);
    const wrong = !!perf.wrong[id];
    let g = 3;
    if(tries>=3) g = 1;
    else if(tries>0 || wrong) g = 2;
    if(g<3) weak++;
    it.learned = true;
    // 新学会的词进入 FSRS「学习中」状态，明天第一次复习
    it.fsrs = {d:fsrsD0(g), s:Math.max(0.3, fsrsS0(g)), reps:1, lapses:g===1?1:0,
               state:1, last:Date.now(), due:addD(t,1), ivl:1, lastGrade:g};
    it.stage = 0; it.maxStage = 0;
    it.nextDate = it.fsrs.due;
    it.updatedAt = Date.now();
    n++;
  });
  if(n){
    const d = S.days[t] || {ans:0, right:0, items:0};
    S.days[t] = {ans:d.ans||0, right:d.right||0, items:(d.items||0)+n};
  }
  save();
  goHome();
  if(n) toast('今天学了 '+n+' 个新词'+(weak?`，${weak} 个会重点复习`:'')+'，明天开始复习');
}
/** 直接学会：跳过四阶段，按「简单」给一个较长间隔，之后仍由 FSRS 正常复习 */
function knownSnap(it){
  return {id:it.id, day:today(), snap:{
    learned:it.learned, status:it.status, stage:it.stage, maxStage:it.maxStage,
    nextDate:it.nextDate, fsrs: it.fsrs ? JSON.parse(JSON.stringify(it.fsrs)) : null,
    learnRounds:it.learnRounds, updatedAt:it.updatedAt
  }};
}
function applyKnown(it){
  const t = today();
  const g = 4;
  const s = Math.max(1, fsrsS0(g));
  // 同一天批量/连续直接学会的词错开到 8~11 天，避免第 8 天一次性到期
  let h = 0;
  const key = String(it.id || it.en || '');
  for(let i=0;i<key.length;i++) h = (h*31 + key.charCodeAt(i)) >>> 0;
  const spread = h % 4;
  const due = addD(t, fsrsIvl(s) + spread);
  it.learned = true;
  if(it.status !== 'graduated') it.status = 'active';
  it.fsrs = {d:fsrsD0(g), s, reps:1, lapses:0, state:2, last:Date.now(), due,
             ivl:Math.max(1, diffD(t, due)), lastGrade:g};
  it.nextDate = due;
  it.stage = 0; it.maxStage = 0;
  it.learnRounds = Math.max(1, it.learnRounds||0);
  it.updatedAt = Date.now();
  const d = S.days[t] || {ans:0, right:0, items:0};
  d.items = (d.items||0) + 1;
  S.days[t] = d;
  return due;
}
function markKnown(id, fromLearn){
  const it = byId(id);
  if(!it) return;
  if(!fromLearn){
    undoKnown.push(knownSnap(it));
    if(undoKnown.length > 300) undoKnown.shift();
  }
  const t = today();
  const due = applyKnown(it);
  if(fromLearn && learn){
    const i = learn.ids.indexOf(id);
    if(i >= 0) learn.ids.splice(i,1);
    learn.known = Math.max(0, Number(learn.known)||0) + 1;
    learn.quiz = null; learn.revealed = false; learn.text = ''; learn.copy = false;
    if(!learn.ids.length){
      learn = null; S.learn = null; save(); goHome();
      toast('已直接学会，这次学习完成');
      return;
    }
    if(learn.idx >= learn.ids.length){
      // 当前是最后一个，前面的都已完成，直接结束这次学习
      learn = null; S.learn = null; save(); goHome();
      toast('已直接学会，这次学习完成');
      return;
    }
    persistLearn(); save(); renderLearn();
    toast('已直接学会，'+diffD(t,due)+' 天后再复习');
  }else{
    save(); closeSheet(); renderAll();
    toast('已直接学会，'+diffD(t,due)+' 天后再复习');
  }
}
/** 批量直接学会：词库里勾选一批待学词，一次性排进复习 */
function batchKnown(){
  if(!wordBatch) return;
  const ids = [...wordBatch].filter(id=>{ const it = byId(id); return it && !it.learned; });
  if(!ids.length){ toast('先选几个待学的词'); return; }
  if(!confirm(`直接学会 ${ids.length} 个？会按 8–11 天错开复习，之后仍会正常复习；在首页可以撤销。`)) return;
  ids.forEach(id=>{
    const it = byId(id);
    undoKnown.push(knownSnap(it));
    if(undoKnown.length > 300) undoKnown.shift();
    applyKnown(it);
  });
  wordBatch = null;
  save(); renderWords(); renderHome();
  toast('已直接学会 '+ids.length+' 个，8–11 天后开始复习');
}

/* ============================================================
   10. 默写键盘（应用内自绘，不唤起系统输入法）
   ============================================================ */
function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function keyboardHTML(okLabel){
  const rows = ['qwertyuiop','asdfghjkl','zxcvbnm'];
  let h = '<div class="kbdpan">';
  rows.forEach((row,ri)=>{
    h += '<div class="kb-row">';
    for(const c of row) h += `<button class="kb-key" data-kb="${c}">${c}</button>`;
    if(ri===2) h += '<button class="kb-key fn" data-kb="del">⌫</button>';
    h += '</div>';
  });
  h += `<div class="kb-row">
    <button class="kb-key fn" data-kb="'">'</button>
    <button class="kb-key fn" data-kb="-">-</button>
    <button class="kb-key fn" data-kb=".">.</button>
    <button class="kb-key fn" data-kb="space" style="flex:2.6">空格</button>
    <button class="kb-key go" data-kb="ok" style="flex:2.2">${okLabel||'确认'}</button>
  </div></div>`;
  return h;
}
function paintTyped(el, text, ph){
  if(!el) return;
  el.innerHTML = (text ? esc(text) : '<span class="ph">'+esc(ph||'')+'</span>')
    + '<span class="caret"></span>';
}
let kbSaveT = null;
function kbInput(k){
  let st = null;
  if(exam){
    const it = byId(exam.ids[exam.ptr]);
    if(!it) return;
    st = exam.instant ? studyAnswer(it) : examAnswer(it);
  }else if(learn){
    st = learn;
  }else return;

  if(k==='ok'){ if(exam) { exam.instant ? studyCheck() : nextQ(); } else spellCheck(); return; }

  let txt = st.text || '';
  if(k==='del') txt = txt.slice(0,-1);
  else if(k==='space') txt = txt + ' ';
  else txt = txt + k;
  if(txt.length > 48) return;
  st.text = txt;
  paintTyped($('#typeBox'), st.text, '用下面的键盘输入');
  if(exam && exam.mode==='review'){
    clearTimeout(kbSaveT);
    kbSaveT = setTimeout(()=>{ S.exam = exam; save(); }, 800);
  }else if(learn){
    persistLearn();
  }
}

/* ============================================================
   11. 复习（逐题回忆 → 三档评分 → FSRS 排期）
   ============================================================ */
let exam = null;

function fmtDur(ms){
  const s = Math.max(0, Math.floor((ms||0)/1000));
  const m = Math.floor(s/60);
  return (m?m+' 分 ':'') + (s%60) + ' 秒';
}
function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

/** 例句填空：英文例句里挖掉目标词 */
function clozeOf(it){
  const ex = itemEx(it);
  if(!ex || !ex[0]) return null;
  const w = String(it.en||'').trim();
  if(!w || /\s/.test(w) || w.length<3 || !/^[A-Za-z]+$/.test(w)) return null;
  const re = new RegExp('\\b'+escRe(w)+'\\b','i');
  if(!re.test(ex[0])) return null;
  return {text: ex[0].replace(re, '______'), zh: ex[1]||''};
}
/** 按记忆状态挑题型：中→英拼写为主，穿插英→中回忆、例句填空、听写 */
function cardTypeFor(it, idx){
  const f = it.fsrs;
  if(!it.learned || !f || f.state<=1 || (f.reps||0)<2) return 'en2zh';
  if(S.settings.listenInExam && idx%4===3) return 'listen';
  if(idx%3===2 && clozeOf(it)) return 'cloze';
  return idx%2===0 ? 'zh2en' : 'en2zh';
}
function studyAnswer(it){
  if(!exam.ans) exam.ans = {};
  let a = exam.ans[it.id];
  if(!a){
    const idx = Math.max(0, exam.ids.indexOf(it.id));
    a = exam.ans[it.id] = {type:'en2zh', phase:'ask', text:'', revealed:false,
                           ms:0, t0:0, played:false, hint:false, fail:0};
    a.type = cardTypeFor(it, idx);
  }
  if(!a.type) a.type = cardTypeFor(it, Math.max(0, exam.ids.indexOf(it.id)));
  if(!a.phase) a.phase = 'ask';
  if(!a.t0) a.t0 = Date.now();
  return a;
}
function exHTML(it){
  const ex = itemEx(it);
  if(!ex) return '';
  return `<div class="exbox">
    <div class="ex-en">${esc(ex[0])}<button class="ex-spk" data-act="speakS" data-s="${esc(ex[0])}">${IC_SPK_SM}</button></div>
    <div class="ex-zh">${esc(ex[1]||'')}</div></div>`;
}
function gradeBar(it, rec){
  const p1 = fsrsPreview(it,1), p2 = fsrsPreview(it,2), p3 = fsrsPreview(it,3);
  const lab = (p,g)=> g===1 ? '明天再见' : (p.ivl<=1 ? '1 天后' : '约 '+p.ivl+' 天');
  return `<div class="gradebar">
    <button class="gbtn bad ${rec===1?'rec':''}" data-grade="1" data-gid="${it.id}"><b>忘记</b><span>${lab(p1,1)}</span></button>
    <button class="gbtn warn ${rec===2?'rec':''}" data-grade="2" data-gid="${it.id}"><b>模糊</b><span>${lab(p2,2)}</span></button>
    <button class="gbtn ok ${rec===3?'rec':''}" data-grade="3" data-gid="${it.id}"><b>记得</b><span>${lab(p3,3)}</span></button>
  </div>`;
}
function prevBtn(){
  return exam.ptr>0 ? '<button data-act="prevQ">‹ 上一题</button>' : '<span></span>';
}

function startReview(){
  if(S.exam && S.exam.date===today() && !S.exam.done && Array.isArray(S.exam.ids) && S.exam.ids.length){
    exam = S.exam;
    exam.ans = exam.ans || {};
    exam.ptr = exam.ptr || 0;
    exam.instant = true;
    exam.stats = exam.stats || {again:0,hard:0,good:0,easy:0,right:0};
    Object.keys(exam.ans||{}).forEach(k=>{
      const x = exam.ans[k];
      if(x && x.phase!=='done'){ x.t0 = Date.now(); x.played = false; }
    });
  }else{
    if(wordBudgetLeft() <= 0){
      if(misPlanLeft() > 0){ toast(`单词复习完成，还有 ${misPlanLeft()} 道必做错题`); startMrev(); return; }
      toast('今天的单词复习完成了，明天再来');
      return;
    }
    const paper = buildPaper();
    if(!paper.ids.length){
      if(dueItems().length){ toast(`今天的单词复习到这就够了，还有 ${dueItems().length} 个明天继续`); return; }
      if(misPlanLeft() > 0){ toast(`还有 ${misPlanLeft()} 道必做错题`); startMrev(); return; }
      toast('今天没有到期的词，去自由复习吧');
      openFree();
      return;
    }
    if(S.meta.deferDate!==today()){
      S.meta.deferStreak = paper.deferred>0 ? (S.meta.deferStreak||0)+1 : 0;
      S.meta.deferDate = today();
    }
    exam = {mode:'review', instant:true, ids:paper.ids, ans:{}, ptr:0, date:today(), done:false,
            deferred:paper.deferred, startedAt:Date.now(),
            stats:{again:0,hard:0,good:0,easy:0,right:0}};
    S.exam = exam; save();
  }
  showScreen('review');
  renderExam();
}

function studyReveal(){

function studyHint(){

}
function studyPlay(){
  if(!exam) return;

    a.fail = (a.fail||0)+1;

  });

function studyCheck(){
  if(!exam || !exam.instant) return;
  const it = byId(exam.ids[exam.ptr]);
  if(!it) return;
  const a = studyAnswer(it);
  if(!String(a.text||'').trim()){ toast('先拼出单词再确认'); return; }
  a.ms = Date.now() - (a.t0||Date.now());
  const ok = normEn(a.text) === normEn(it.en);
  a.result = ok ? 'right' : 'wrong';
  a.phase = 'done';
  if(!ok) bumpHeat(it.en, a.text);
  if(exam.mode==='review') S.exam = exam;
  save();
  renderStudy();
}
function studyGrade(g, id){
  if(!exam || !exam.instant) return;
  const it = byId(exam.ids[exam.ptr]);
  if(!it) return;
  if(id && id !== it.id) return;   // 防止连点把评分打到下一张
  const now = Date.now();
  if(exam.gradeLock && now - exam.gradeLock < 260) return;
  exam.gradeLock = now;
  const a = studyAnswer(it);
  snapUndo(it, a);
  let grade = Number(g)||3;
  // 拼写正确且 8 秒内答出 → 按「太简单」排期
  if(a.result==='right' && grade===3 && a.ms && a.ms < 8000) grade = 4;
  applyReviewFSRS(it, grade, a);
  if(!exam.stats) exam.stats = {again:0,hard:0,good:0,easy:0,right:0};
  const k = grade===1?'again':grade===2?'hard':grade===3?'good':'easy';
  exam.stats[k]++;
  if(grade>=3) exam.stats.right++;
  a.grade = grade;
  a.phase = 'done';
  // 忘记的词本轮队尾再过一遍（只重排一次）
  if(grade===1 && !a.requeued){
    a.requeued = true;
    exam.ids.push(it.id);
    a.phase = 'ask'; a.revealed = false; a.text = ''; a.result = '';
    a.ms = 0; a.t0 = 0; a.played = false; a.hint = false;
  }
  exam.ptr++;
  if(exam.mode==='review') S.exam = exam;
  save();
  renderStudy();
}

/** 评分前留一份现场，供撤销恢复（词条、答案、进度、统计、当天数据） */
function snapUndo(it, a){
  if(!exam) return;
  if(!exam.undo) exam.undo = [];
  const t = today();
  exam.undo.push({
    ptr: exam.ptr,
    ids: exam.ids.slice(),
    stats: JSON.parse(JSON.stringify(exam.stats||{})),
    ans: JSON.parse(JSON.stringify(a)),
    item: JSON.parse(JSON.stringify(it)),
    day: S.days[t] ? JSON.parse(JSON.stringify(S.days[t])) : null
  });
  if(exam.undo.length > 20) exam.undo.shift();
}
function undoGrade(){
  if(!exam || !exam.instant || !exam.undo || !exam.undo.length){
    toast('没有可撤销的评分');
    return;
  }
  const u = exam.undo.pop();
  const i = S.items.findIndex(x=>x.id===u.item.id);
  if(i>=0) S.items[i] = u.item;
  exam.ptr = u.ptr;
  exam.ids = u.ids;
  exam.stats = u.stats;
  exam.ans[u.item.id] = u.ans;
  const t = today();
  if(u.day) S.days[t] = u.day; else delete S.days[t];
  exam.gradeLock = 0;
  if(exam.mode==='review') S.exam = exam;
  save();
  renderStudy();
  toast('已撤销，重新评一次');
}
function syncUndoBtn(){
  const b = $('#reviewUndo');
  if(!b) return;
  b.style.display = (exam && exam.instant && exam.undo && exam.undo.length) ? 'flex' : 'none';
}

function applyReviewFSRS(it, grade, a){
  const t = today();
  // 自由复习/自由重做：只统计，不改排期
  if(exam && exam.free){
    it.freeCount = (it.freeCount||0)+1;
    it.totalAnswerCount = (it.totalAnswerCount||0)+1;
    pushHist(it, {d:t, r: grade>=3?'right':'wrong', g:grade, mode:'free', dir:a?a.type:''});
    it.updatedAt = Date.now();
    const dd = S.days[t] || {ans:0,right:0,items:0};
    dd.ans = (dd.ans||0)+1;
    dd.free = (dd.free||0)+1;
    if(grade>=3) dd.right = (dd.right||0)+1;
    S.days[t] = dd;
    return;
  }
  fsrsApply(it, grade);
  it.learned = true;
  if(it.status!=='graduated') it.status = 'active';
  it.totalAnswerCount = (it.totalAnswerCount||0)+1;
  it.officialTestCount = (it.officialTestCount||0)+1;
  if(grade>=3){
    it.streak = (it.streak||0)+1;
    it.officialRightCount = (it.officialRightCount||0)+1;
  }else{
    it.streak = 0;
    if(grade===1) it.errCount = (it.errCount||0)+1;
  }
  if(exam && exam.mode==='drill'){
    it.drillCount = (it.drillCount||0)+1;
    if(grade>=3) it.drillRight = (it.drillRight||0)+1;
  }
  pushHist(it, {d:t, r: grade>=3?'right':'wrong', g:grade, mode:exam?exam.mode:'review', dir:a?a.type:''});
  it.updatedAt = Date.now();
  const d = S.days[t] || {ans:0,right:0,items:0};
  d.ans = (d.ans||0)+1;
  if(exam && exam.mode==='drill') d.free = (d.free||0)+1;   // 专项属于额外练习，不占每日预算
  if(grade>=3) d.right = (d.right||0)+1;
  d.items = Math.max(d.items||0, 1);
  S.days[t] = d;
}

/* ---------- 批量模式（自由复习） ---------- */
function examDirAt(i){
  const q = exam.qmode || 'alternate';
  if(q==='listen') return 'listen';
  if(q==='zh2en') return 'zh2en';
  if(q==='mix'){
    const r = i % 3;
    return r===0 ? 'zh2en' : (r===1 ? 'listen' : 'en2zh');
  }
  return i % 2 === 0 ? 'zh2en' : 'en2zh';
}
function examAnswer(it){
  if(!exam.ans) exam.ans = {};
  let a = exam.ans[it.id];
  if(!a){
    const idx = Math.max(0, exam.ids.indexOf(it.id));
    a = exam.ans[it.id] = {dir: examDirAt(idx), text:'', picks:[], revealed:false, ms:0, t0:0, played:false};
  }
  if(!Array.isArray(a.picks)) a.picks = [];
  if(a.dir==='en2zh' && !a.cands) a.cands = zhCands(it);
  if(!a.t0) a.t0 = Date.now();
  return a;
}
function stampAnswer(){
  if(!exam) return;
  const it = byId(exam.ids[exam.ptr]);
  if(!it || !exam.ans) return;
  const a = exam.ans[it.id];
  if(a && a.t0){ a.ms = (a.ms||0) + (Date.now()-a.t0); a.t0 = 0; }
}
function zhCands(it){
  const right = splitSenses(it.zh);
  const used = new Set(right.map(normZh));
  const picks = [];
  const pool = [];
  S.items.forEach(x=>{
    if(x.id===it.id) return;
    splitSenses(x.zh).forEach(s=>pool.push(s));
  });
  shuffle(pool);
  for(const p of pool){
    if(picks.length>=3) break;
    const n = normZh(p);
    if(!n || used.has(n)) continue;
    used.add(n); picks.push(p);
  }
  if(picks.length<3 && DICT){
    const keys = Object.keys(DICT);
    for(let i=0;i<300 && picks.length<3;i++){
      const s = dictSensesOf(keys[Math.floor(Math.random()*keys.length)])[0];
      if(!s || s.length>16) continue;
      const n = normZh(s);
      if(!n || used.has(n)) continue;
      used.add(n); picks.push(s);
    }
  }
  return shuffle(right.concat(picks));
}
function judgePicks(picks, it){
  const wantRaw = splitSenses(it.zh);
  const want = wantRaw.map(normZh);
  const got = (picks||[]).map(normZh).filter(Boolean);
  if(!got.length) return {r:'empty'};
  const missIdx = [];
  want.forEach((w,i)=>{ if(got.indexOf(w)<0) missIdx.push(i); });
  const extra = got.filter(g=>want.indexOf(g)<0);
  if(!missIdx.length && !extra.length) return {r:'right'};
  return {r:'wrong', missing:missIdx.map(i=>wantRaw[i]), extra};
}

function renderExam(){
  if(!exam){ goHome(); return; }
  if(exam.instant){ renderStudy(); return; }
  syncUndoBtn();
  const box = $('#reviewStage');
  if(exam.ptr < 0) exam.ptr = 0;
  if(exam.ptr >= exam.ids.length){ renderResults(); return; }
  const it = byId(exam.ids[exam.ptr]);
  if(!it){ exam.ptr++; return renderExam(); }

  const a = examAnswer(it);
  const dir = a.dir;
  const total = exam.ids.length;
  $('#reviewTitle').textContent = exam.mode==='free' ? '自由复习' : '默写复习';
  $('#reviewCount').textContent = (exam.ptr+1)+' / '+total;
  const pct = Math.round(exam.ptr/total*100);
  const doneN = exam.ids.filter(id=>{
    const x = exam.ans[id];
    if(!x) return false;
    return x.dir==='en2zh' ? !!x.done : !!String(x.text||'').trim();
  }).length;

  let card = '', typed = false;
  if(dir==='zh2en'){
    typed = true;
    card = `<div class="bigcard kbd">
      <div class="kbdtop">${prevBtn()}<span>看释义，拼出英文</span></div>
      <div class="zhprompt">${splitSenses(it.zh).map(esc).join('；')}</div>
      <div class="typebox" id="typeBox"></div>
    </div>
    ${keyboardHTML(exam.ptr+1>=total ? '交卷' : '下一题')}`;
  }
  else if(dir==='listen'){
    typed = true;
    card = `<div class="bigcard kbd">
      <div class="kbdtop">${prevBtn()}<span>听发音，拼出这个单词</span></div>
      <div style="text-align:center;padding-top:4px">
        <button class="speakbtn" style="width:68px;height:68px;margin:0 auto" data-act="speak" data-w="${esc(it.en)}">${IC_SPK_BIG}</button>
        <button class="btn" style="margin:12px auto 0;height:34px;font-size:12.5px;padding:0 14px;flex:0 0 auto" data-act="showAnswer">听不到？看答案</button>
      </div>
      ${a.hint?`<div class="reveal-word">答案：<b>${esc(it.en)}</b>　照着打一遍</div>`:''}
      <div class="typebox" id="typeBox"></div>
    </div>
    ${keyboardHTML(exam.ptr+1>=total ? '交卷' : '下一题')}`;
  }
  else{
    const hideChips = S.settings.recallFirst && !a.revealed;
    card = `<div class="bigcard learning">
      <div class="kbdtop">${prevBtn()}<span></span></div>
      <div style="text-align:center">
        <div class="word small">${esc(it.en)}</div>
        ${phonOf(it.en)?`<div class="phon">/${esc(phonOf(it.en))}/</div>`:''}
        <button class="speakbtn" data-act="speak" data-w="${esc(it.en)}">${IC_SPK}</button>
      </div>
      ${hideChips
        ? `<div class="hintline" style="margin-top:16px">先在心里回想它的释义</div>
           <button class="btn primary" style="margin-top:18px;width:100%" data-act="showPicks">想好了，看选项</button>`
        : `<div class="hintline" style="margin-top:12px">选出全部正确的中文释义${splitSenses(it.zh).length>1?'（共 '+splitSenses(it.zh).length+' 个）':''}</div>
           <div class="chips">${(a.cands||[]).map((c,k)=>
             `<button class="chip ${a.picks.indexOf(c)>=0?'on':''}" data-pick="${k}">${esc(c)}</button>`).join('')}</div>`}
    </div>`;
  }

  box.innerHTML = `<div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="examtip">已作答 ${doneN} / ${total}</div>
    ${card}
    ${typed ? '' : `<div class="actions" style="padding-bottom:calc(12px + env(safe-area-inset-bottom))">
      ${exam.ptr+1>=total
        ? `<button class="btn ok" data-act="grade">交卷</button>`
        : `<button class="btn primary" data-act="nextQ">下一题</button>`}
    </div>`}`;

  if(typed) paintTyped($('#typeBox'), a.text, dir==='listen'?'凭听音拼写':'用下面的键盘输入');

    setTimeout(()=>speak(it.en, false, ()=>{
      a.hint = true;
      toast('发音没加载出来，可以直接看答案');
