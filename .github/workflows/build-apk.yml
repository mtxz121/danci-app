name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 不再调用 android-actions/setup-android：
      # 新版 cmdline-tools 已移除 tools 包，该 action 会装失败；
      # GitHub 的 ubuntu-latest 镜像本身自带 Android SDK 与 ANDROID_HOME。

      # 缓存签名密钥，保证后续版本能覆盖安装而不丢数据
      - uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1

      - name: Install Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/local-notifications@6

      - name: Write capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mine.wordapp",
            "appName": "生词",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      # 版本号唯一来源：www/version.json（改这里就能升版本）
      - name: Set app version
        run: |
          V=$(node -p "require('./www/version.json').version")
          C=$(node -p "require('./www/version.json').code")
          sed -i "s/versionCode [0-9]*/versionCode $C/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          echo "APP_VERSION=$V" >> $GITHUB_ENV
          grep -n "versionName\|versionCode" android/app/build.gradle

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "生词-v${APP_VERSION}.apk"
          ls -lh "生词-v${APP_VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: 生词-v*.apk
