name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 不再调用 android-actions/setup-android：
      # 新版 cmdline-tools 已移除 tools 包，该 action 会装失败；
      # GitHub 的 ubuntu-latest 镜像本身自带 Android SDK 与 ANDROID_HOME。

      - name: Install Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/local-notifications@6

      - name: Write capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mine.wordapp",
            "appName": "温故",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      # 固定签名密钥（keystore/debug.keystore.b64），保证每个版本签名一致，
      # 手机可以直接覆盖安装，不需要卸载重装。
      - name: Restore signing key
        run: |
          python3 - <<'PY'
          import base64, pathlib
          raw = pathlib.Path('keystore/debug.keystore.b64').read_bytes().decode('utf-8-sig')
          data = base64.b64decode(''.join(raw.split()))
          pathlib.Path('android/app/debug.keystore').write_bytes(data)
          print('keystore bytes:', len(data))
          PY
          mkdir -p ~/.android
          cp android/app/debug.keystore ~/.android/debug.keystore
          ls -l android/app/debug.keystore ~/.android/debug.keystore

      # 版本号唯一来源：www/version.json（改这里就能升版本）
      - name: Set app version
        run: |
          V=$(node -p "require('./www/version.json').version")
          C=$(node -p "require('./www/version.json').code")
          sed -i "s/versionCode [0-9]*/versionCode $C/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          echo "APP_VERSION=$V" >> $GITHUB_ENV
          grep -n "versionName\|versionCode" android/app/build.gradle

      - name: Force debug signing config
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                      storeType "PKCS12"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK signature
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee /tmp/certs.txt
          FP=$(grep -i "SHA-256 digest" /tmp/certs.txt | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK SHA-256: $FP"
          echo "APK_SHA256=$FP" >> $GITHUB_ENV

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "温故-v${APP_VERSION}-${APK_SHA256:0:8}.apk"
          ls -lh "温故-v${APP_VERSION}-"*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ env.APK_SHA256 }}
          path: 温故-v*.apk
